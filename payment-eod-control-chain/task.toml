version = "2.0"
name = "payment-eod-control-chain"
category = "Software"
subcategory = "Systems"
tags = ["cobol", "sql", "batch-processing", "payments", "reconciliation"]
languages = ["cobol", "bash", "sql"]
difficulty = "advanced"
expert_time_estimate_hours = 7
artifacts = ["/app/eod"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 5400

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app/eod"
