version = "2.0"
name = "terraform-aws-eks-weekend-fleet-cutover-plan"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "eks", "offline-plan", "helm", "irsa", "cutover"]
languages = ["hcl", "bash", "json", "python"]
difficulty = "advanced"
expert_time_estimate_hours = 11
artifacts = [
  "/app/output/eks_weekend_fleet_plan.json",
  "/app/output/eks_weekend_cutover_timeline.json",
