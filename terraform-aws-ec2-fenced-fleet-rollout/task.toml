version = "2.0"
name = "terraform-aws-ec2-fenced-fleet-rollout"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "ec2", "rollout", "go", "autoscaling", "control-plane"]
languages = ["go", "hcl", "bash", "python"]
difficulty = "frontier"
expert_time_estimate_hours = 16
artifacts = ["/app/controller", "/app/internal", "/app/terraform", "/app/cmd", "/app/scripts", "/app/var/fleet", "/app/output", "/app/go.mod", "/app/go.sum", "/app/bin"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 3600
environment_mode = "separate"

[agent]
timeout_sec = 10800

[environment]
network_mode = "public"
build_timeout_sec = 2400
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
