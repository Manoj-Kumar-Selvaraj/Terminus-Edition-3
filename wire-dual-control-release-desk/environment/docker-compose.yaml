services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      WIRE_DB: wire@database:5432
      WIRE_DB_USER: wire_app
      WIRE_DB_PASSWORD: wire_local
    command: ["sleep", "infinity"]

  database:
    build:
      context: ./db
    environment:
      POSTGRES_DB: wire
      POSTGRES_USER: wire_app
      POSTGRES_PASSWORD: wire_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wire_app -d wire"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
