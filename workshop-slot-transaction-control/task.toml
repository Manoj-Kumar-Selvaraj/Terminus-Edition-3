custom_docker_compose = true
is_multi_container = true

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 9000

[environment]
network_mode = "public"
build_timeout_sec = 2400
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app/workshop"
