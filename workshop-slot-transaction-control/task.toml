version = "2.0"
name = "workshop-slot-transaction-control"
category = "Operations"
subcategory = "Supply chain"
tags = ["cobol", "postgresql", "transactions", "scheduling", "concurrency"]
languages = ["cobol", "sql", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 12
artifacts = ["/app/workshop"]

[metadata]
author_name = "anonymous"
