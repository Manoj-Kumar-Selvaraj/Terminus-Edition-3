version = "2.0"
name = "codecommit-iam-merge-fence"
category = "Security"
subcategory = "AppSec"
tags = ["iam", "codecommit", "fast-forward", "mfa", "pipeline-trigger"]
languages = ["python", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 10
artifacts = ["/app/codecommit"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 5400

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app/codecommit"
