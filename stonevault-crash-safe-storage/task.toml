version = "2.0"
name = "stonevault-crash-safe-storage"
category = "Software"
subcategory = "Databases"
tags = ["cpp", "rust", "wal", "mvcc", "recovery", "transactions"]
languages = ["cpp", "rust"]
difficulty = "frontier"
expert_time_estimate_hours = 12
artifacts = [
  "/app/stonevault",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 10800

[environment]
network_mode = "public"
build_timeout_sec = 1200
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app/stonevault"
