version = "2.0"
name = "terraform-azure-spoke-private-endpoint-transition"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "azure", "private-endpoint", "vnet", "dns", "nsg"]
languages = ["hcl", "python", "bash"]
