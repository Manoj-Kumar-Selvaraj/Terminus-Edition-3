version = "2.0"
name = "enterprise-pii-discovery-plane"
category = "Software"
subcategory = "Data Engineering"
tags = ["pii-discovery", "distributed-systems", "privacy", "recovery", "polyglot"]
languages = ["java", "go", "bash", "python"]
difficulty = "advanced"
expert_time_estimate_hours = 18
artifacts = ["/app/enterprise-pii"]

[metadata]
author_name = "anonymous"
