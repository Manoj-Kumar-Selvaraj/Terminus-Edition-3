name: Terminus Edge Router A3 Record

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-a3-record.yml'

permissions:
  contents: write
  statuses: write

env:
  TASK_ID: edge-router-runtime
  TASK_SNAPSHOT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad
  A1_INVOCATION_ID: inv_79d4551ca8b96875e1f37dc7cea565949e1ade639e32fa1b5de68d5a081bf0d8
  A2_INVOCATION_ID: inv_b9463c264c05f24c0876eb2968702df48cc551bb7bfe1c87b1a45cf9a73df239
  A3_INVOCATION_ID: inv_28c1baf5125eb73cb1a52b677925c8967f6a9ceb113e42bf4c28e8f08db86f98

jobs:
  record-a3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish recorder run breadcrumb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=terminus/a3-recorder \
            -f description='A3 canonical recorder running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify committed controller state
        run: |
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --output /tmp/status-before.json
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/status-before.json'))
          assert state['ledger_event_count']==3, state
          assert state['ledger_head_event_id']=='evt_bdcbfe8b1d2821fe6737644a649de7c95656066d65c2fa0677fa6c46e802d2c8', state
          assert state['lineage']['status']=='CURRENT', state
          assert state['next']['action']=='INVOKE_STAGE', state
          assert state['next']['stage_id']=='DEFECT_TOPOLOGY', state
          assert state['next']['primary_role_id']=='A3_DEFECT_TOPOLOGY_DESIGNER', state
          PY

      - name: Load exact staged A3 result
        run: |
          git show "origin/task/edge-router-runtime:.terminus/tmp/edge-router-a3-result.json" > /tmp/a3-result.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/a3-result.json'))
          assert r['schema_version']=='1.0', r
          assert r['invocation_id']==os.environ['A3_INVOCATION_ID'], r
          assert r['output_task_commit']==os.environ['TASK_SNAPSHOT'], r
          assert r['status']=='DESIGN_READY', r
          assert set(r['outputs'])=={'profile','root_cause_clusters','defects','causal_edges','behavioral_surfaces','organic_f2p_surface_assessment'}, r['outputs'].keys()
          assert r['outputs']['profile']=='large_system_strict', r
          PY

      - name: Canonicalize immutable file evidence metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          p='/tmp/a3-result.json'
          r=json.load(open(p))
          for ref in r['evidence_refs']:
              if ref.get('kind') != 'FILE':
                  continue
              rawref=ref['ref']
              assert rawref.startswith('git:') and '@' in rawref, rawref
              path, commit = rawref[len('git:'):].rsplit('@',1)
              data=subprocess.check_output(['git','show',f'{commit}:{path}'])
              ref['ref']=f'git:{commit}:{path}'
              ref['content_hash']='sha256:'+hashlib.sha256(data).hexdigest()
          json.dump(r,open(p,'w'),indent=2)
          print(json.dumps(r['evidence_refs'],indent=2))
          PY

      - name: Validate persisted topology artifact matches stage outputs
        run: |
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/a3-result.json'))
          design=json.load(open('.terminus/designs/edge-router-runtime.json'))
          assert design==result['outputs'], 'persisted design manifest differs from A3 outputs'
          defects=design['defects']; clusters=design['root_cause_clusters']; edges=design['causal_edges']
          ids={d['id'] for d in defects}
          assert 20 <= len(defects) <= 30, len(defects)
          assert 4 <= len(clusters) <= 8, len(clusters)
          connected=set(); cross=set(); dcluster={d['id']:d['root_cause'] for d in defects}; seen=set()
          for e in edges:
              p=(e['from'],e['to'])
              assert e['from'] in ids and e['to'] in ids and e['from']!=e['to'], e
              assert p not in seen, e
              seen.add(p); connected.update(p)
              if dcluster[e['from']] != dcluster[e['to']]:
                  cross.add(tuple(sorted((dcluster[e['from']],dcluster[e['to']]))))
          assert len(connected) >= 15, len(connected)
          assert cross, cross
          assert all(d.get('partial_fix_trap') for d in defects)
          print({'defects':len(defects),'clusters':len(clusters),'edges':len(edges),'interrelated':len(connected),'cross_cluster_pairs':len(cross)})
          PY

      - name: Rebuild exact A3 invocation
        run: |
          python3 - <<'PY'
          import json, os
          base=f".terminus/executions/{os.environ['TASK_ID']}"
          a1=json.load(open(f"{base}/{os.environ['A1_INVOCATION_ID']}.result.json"))
          a2=json.load(open(f"{base}/{os.environ['A2_INVOCATION_ID']}.result.json"))
          a1o=a1['outputs']
          selected=next(c for c in a1o['CANDIDATES'] if c['ID']==a1o['RECOMMENDATION'])
          operational={'REQUIRED_END_STATE':selected['REQUIRED_END_STATE'],'REQUIREMENT_FAMILIES':selected['REQUIREMENT_FAMILIES'],'PRESERVATION_OBLIGATIONS':selected['PRESERVATION_OBLIGATIONS'],'EDGE_FAILURE_SURFACE':selected['EDGE_FAILURE_SURFACE']}
          rule=a1['invocation_snapshot']['inputs']['required']['CREATION_RULE_CONTEXT']
          json.dump({'APPROVED_OPERATIONAL_REQUIREMENTS':operational,'APPROVED_WORK_PACKAGE':selected,'CLEAN_SYSTEM_ARCHITECTURE':a2['outputs'],'CREATION_PROFILE':rule['CREATION_PROFILE']},open('/tmp/a3-inputs.json','w'),indent=2,sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/a3-inputs.json \
            --output /tmp/a3-next.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/a3-next.json')); inv=p['invocation']
          assert inv['invocation_id']==os.environ['A3_INVOCATION_ID'], inv
          assert inv['stage']['stage_id']=='DEFECT_TOPOLOGY', inv
          assert inv['stage']['role_id']=='A3_DEFECT_TOPOLOGY_DESIGNER', inv
          assert inv['readiness']=='READY', inv
          json.dump(inv,open('/tmp/a3-invocation.json','w'),indent=2,sort_keys=True)
          PY

      - name: Record A3 through canonical recorder
        run: |
          python3 .terminus/execution/controller_cli.py record \
            --invocation /tmp/a3-invocation.json \
            --result /tmp/a3-result.json \
            --output /tmp/a3-record-output.json
          python3 - <<'PY'
          import json
          out=json.load(open('/tmp/a3-record-output.json')); rec=out['record']; state=out['state']
          assert rec['status']=='DESIGN_READY', rec
          assert rec['disposition']=='ADVANCE', rec
          assert rec['stage_id']=='DEFECT_TOPOLOGY', rec
          assert state['ledger_event_count']==4, state
          assert state['next']['action']=='INVOKE_STAGE', state
          assert state['next']['stage_id']=='ENVIRONMENT_BUILD', state
          print(json.dumps({'record_id':rec['record_id'],'ledger_event_id':out['ledger_event']['event_id'],'record_hash':out['ledger_event']['record_hash'],'state_snapshot_id':state['state_snapshot_id'],'next':state['next']},indent=2,sort_keys=True))
          PY

      - name: Persist exact A3 execution evidence to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; task=os.environ['TASK_ID']; inv=os.environ['A3_INVOCATION_ID']
          for path in [f'.terminus/executions/{task}/{inv}.result.json', f'.terminus/executions/{task}/ledger.jsonl']:
              data=open(path,'rb').read(); encoded=base64.b64encode(data).decode(); api=f'repos/{repo}/contents/{path}'
              try:
                  existing=json.loads(subprocess.check_output(['gh','api',api,'-f','ref=main']))
                  payload={'message':f'workflow: record {task} A3 lifecycle evidence','content':encoded,'branch':'main','sha':existing['sha']}
              except subprocess.CalledProcessError:
                  payload={'message':f'workflow: record {task} A3 lifecycle evidence','content':encoded,'branch':'main'}
              subprocess.run(['gh','api','--method','PUT',api,'--input','-'],input=json.dumps(payload).encode(),check=True)
          PY

      - name: Replay persisted four-event ledger from main
        run: |
          git fetch origin main
          git checkout --force origin/main
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --output /tmp/status-after.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/status-after.json'))
          assert s['ledger_event_count']==4, s
          assert s['lineage']['status']=='CURRENT', s
          assert s['next']['action']=='INVOKE_STAGE', s
          assert s['next']['stage_id']=='ENVIRONMENT_BUILD', s
          print(json.dumps(s['next'],indent=2,sort_keys=True))
          PY

      - name: Publish A3 recorder success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=terminus/a3-recorder \
            -f description='A3 canonical recorder and main replay complete' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
