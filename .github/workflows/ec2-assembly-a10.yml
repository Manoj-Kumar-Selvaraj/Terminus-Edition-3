name: EC2 Assembly A10

on:
  push:
    branches:
      - diagnostic/ec2-ledger-integrity-20260820
    paths:
      - .github/ec2_assembly_a10.py
      - .github/workflows/ec2-assembly-a10.yml

permissions:
  contents: write

concurrency:
  group: ec2-assembly-a10
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist run locator and helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/ec2_assembly_a10.py "$RUNNER_TEMP/ec2_assembly_a10.py"
          path=".terminus/diagnostic-run-locators/ec2-assembly-a10-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"run_attempt":%s,"event_sha":"%s","branch":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$path"
          git config user.name 'terminus-diagnostic-locator[bot]'
          git config user.email 'terminus-diagnostic-locator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 assembly/A10 run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Execute A9 and A10 on latest canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main task/ec2-artifact-policy-enforcement-q7-snapshot-20260820
          base="$(git rev-parse origin/main)"
          echo "BASE=$base" >> "$GITHUB_ENV"
          git checkout --detach "$base"
          python3 "$RUNNER_TEMP/ec2_assembly_a10.py"

      - name: Persist canonical execution evidence with unrelated-main guard
        shell: bash
        run: |
          set -euo pipefail
          task="ec2-artifact-policy-enforcement"
          git config user.name 'terminus-ec2-a9-a10[bot]'
          git config user.email 'terminus-ec2-a9-a10[bot]@users.noreply.github.com'
          git add -- ".terminus/executions/$task"
          git diff --cached --check
          git commit -m "Record ${task} assembly and complexity gate"
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [[ "$remote" != "$BASE" ]]; then
            work="$RUNNER_TEMP/ec2-assembly-a10"
            python3 .terminus/execution/controller_cli.py control-plane --head "$remote" --output "$work/remote-control.json"
            resolved="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["control_plane_commit"])' "$work/remote-control.json")"
            [[ "$resolved" == "215cc70bcebcccc3c9a401af1b74a97d90026da3" ]] || { echo "::error::control changed during assembly/A10"; exit 75; }
            ec2_drift="$(git diff --name-only "$BASE" "$remote" -- "$task" ".terminus/executions/$task" || true)"
            [[ -z "$ec2_drift" ]] || { echo "::error::EC2 changed concurrently:"; echo "$ec2_drift"; exit 75; }
            git rebase "$remote"
          fi
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-assembly-a10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ec2-assembly-a10
          if-no-files-found: warn
