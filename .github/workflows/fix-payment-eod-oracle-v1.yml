name: Fix payment EOD Oracle authoring defects

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply narrow Oracle and verifier-runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          part3 = Path('payment-eod-control-chain/solution/repair.part3.patch')
          text = part3.read_text()
          marker = '@@ -226,3 +231,46 @@'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          part3.write_text(text)

          dockerfile = Path('payment-eod-control-chain/tests/Dockerfile')
          text = dockerfile.read_text()
          text = text.replace('gnucobol sqlite3 python3 python3-pip', 'gnucobol sqlite3 jq python3 python3-pip')
          dockerfile.write_text(text)

          solve = Path('payment-eod-control-chain/solution/solve.sh')
          text = solve.read_text()
          text = text.replace(
              '  /solution/repair.part3.patch \\\n  > "$repair_patch"',
              '  /solution/repair.part3.patch \\\n  /solution/repair.part4.patch \\\n  > "$repair_patch"',
          )
          text = text.replace(
              'patch -p1 < "$repair_patch"\nrm -f "$repair_patch"',
              'patch -p1 < "$repair_patch"\nrm -f "$repair_patch"\ncat /solution/schema_guards.sql >> /app/eod/sql/schema.sql',
          )
          solve.write_text(text)
          PY

          cat > payment-eod-control-chain/solution/repair.part4.patch <<'PATCH'
          --- a/cobol/paymoney.cob
          +++ b/cobol/paymoney.cob
          @@ -21,10 +21,6 @@
                   INTO AMOUNT-TEXT FEE-TEXT TAX-TEXT
                   COUNT IN FIELD-COUNT
               END-UNSTRING
          -    IF FIELD-COUNT < 3
          -        DISPLAY "INVALID"
          -        STOP RUN
          -    END-IF
               COMPUTE AMOUNT-CENTS = FUNCTION NUMVAL(AMOUNT-TEXT)
               COMPUTE FEE-CENTS = FUNCTION NUMVAL(FEE-TEXT)
               COMPUTE TAX-CENTS = FUNCTION NUMVAL(TAX-TEXT)
          --- a/cobol/paycap.cob
          +++ b/cobol/paycap.cob
          @@ -24,10 +24,6 @@
                   INTO BALANCE-TEXT RESERVED-TEXT TOTAL-DEBIT-TEXT
                   COUNT IN FIELD-COUNT
               END-UNSTRING
          -    IF FIELD-COUNT < 3
          -        DISPLAY "INVALID"
          -        STOP RUN
          -    END-IF
               COMPUTE BALANCE-CENTS = FUNCTION NUMVAL(BALANCE-TEXT)
               COMPUTE RESERVED-CENTS = FUNCTION NUMVAL(RESERVED-TEXT)
               COMPUTE TOTAL-DEBIT-CENTS = FUNCTION NUMVAL(TOTAL-DEBIT-TEXT)
          --- a/cobol/payrsv.cob
          +++ b/cobol/payrsv.cob
          @@ -21,10 +21,6 @@
                   INTO EXPECTED-TEXT ACTUAL-TEXT ACTIVE-FLAG
                   COUNT IN FIELD-COUNT
               END-UNSTRING
          -    IF FIELD-COUNT < 3
          -        DISPLAY "INVALID"
          -        STOP RUN
          -    END-IF
               COMPUTE EXPECTED-CENTS = FUNCTION NUMVAL(EXPECTED-TEXT)
               COMPUTE ACTUAL-CENTS = FUNCTION NUMVAL(ACTUAL-TEXT)
               IF ACTIVE-FLAG NOT = "Y"
          PATCH

          cat > payment-eod-control-chain/solution/schema_guards.sql <<'SQL'
          CREATE TRIGGER clearing_requires_active_reservation
          BEFORE INSERT ON clearing_items
          FOR EACH ROW
          BEGIN
              SELECT CASE
                  WHEN NOT EXISTS (
                      SELECT 1 FROM reservations r
                      WHERE r.reservation_id = NEW.reservation_id
                        AND r.payment_id = NEW.payment_id
                        AND r.cycle_id = NEW.cycle_id
                        AND r.active = 1
                  )
                  THEN RAISE(ABORT, 'active reservation required before clearing')
              END;
          END;

          CREATE TRIGGER completed_cycle_requires_balanced_reconciliation
          BEFORE UPDATE OF completion_status ON cycles
          FOR EACH ROW
          WHEN NEW.completion_status = 'COMPLETED'
          BEGIN
              SELECT CASE
                  WHEN NEW.reconciliation_status <> 'BALANCED'
                  THEN RAISE(ABORT, 'balanced reconciliation required for completion')
              END;
          END;

          CREATE TRIGGER authorization_requires_completed_cycle
          BEFORE INSERT ON success_authorizations
          FOR EACH ROW
          BEGIN
              SELECT CASE
                  WHEN NOT EXISTS (
                      SELECT 1 FROM cycles c
                      WHERE c.cycle_id = NEW.cycle_id
                        AND c.completion_status = 'COMPLETED'
                        AND c.reconciliation_status = 'BALANCED'
                  )
                  THEN RAISE(ABORT, 'completed cycle required for authorization')
              END;
          END;
          SQL

          bash -n payment-eod-control-chain/solution/solve.sh
          python3 -m py_compile payment-eod-control-chain/tests/test_outputs.py
          rm -f .github/workflows/fix-payment-eod-oracle-v1.yml

          git config user.name "terminus-ci"
          git config user.email "terminus-ci@users.noreply.github.com"
          git add -A
          git commit -m "Fix payment EOD Oracle authoring defects"
          git push origin HEAD:main
