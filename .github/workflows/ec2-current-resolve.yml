name: EC2 Runtime Oracle Validation

on:
  push:
    branches: [diagnostic/ec2-ledger-integrity-20260820]
    paths: ['.github/workflows/ec2-current-resolve.yml']

permissions:
  contents: write

concurrency:
  group: ec2-runtime-oracle-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist run locator and helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/ec2_runtime_validation.py "$RUNNER_TEMP/ec2_runtime_validation.py"
          path=".terminus/diagnostic-run-locators/ec2-runtime-oracle-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"run_attempt":%s,"event_sha":"%s","branch":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$path"
          git config user.name 'terminus-diagnostic-locator[bot]'
          git config user.email 'terminus-diagnostic-locator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 runtime/oracle run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Execute runtime authenticity and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git rev-parse origin/main)"
          echo "BASE=$base" >> "$GITHUB_ENV"
          git checkout --detach "$base"
          python3 "$RUNNER_TEMP/ec2_runtime_validation.py"

      - name: Persist canonical EC2 execution evidence
        shell: bash
        run: |
          set -euo pipefail
          task="ec2-artifact-policy-enforcement"
          control="67b805a297ac005ee08e82facc533f53a3233192"
          git config user.name 'terminus-ec2-runtime[bot]'
          git config user.email 'terminus-ec2-runtime[bot]@users.noreply.github.com'
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE "^\.terminus/(executions|workflows)/${task}(/|$)" || true)"
          [[ -z "$unexpected" ]] || { echo "::error::unexpected runtime/oracle mutations: $unexpected"; exit 1; }
          git add -- ".terminus/executions/$task"
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::no canonical runtime/oracle evidence produced"; exit 1; }
          git commit -m "Record ${task} runtime and deterministic validation"
          original_base="$BASE"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            remote="$(git rev-parse origin/main)"
            if [[ "$remote" != "$original_base" ]]; then
              work="$RUNNER_TEMP/ec2-runtime-validation"
              python3 .terminus/execution/controller_cli.py control-plane --head "$remote" --output "$work/remote-control.json"
              resolved="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["control_plane_commit"])' "$work/remote-control.json")"
              [[ "$resolved" == "$control" ]] || { echo "::error::control changed during runtime/oracle to $resolved"; exit 75; }
              drift="$(git diff --name-only "$original_base" "$remote" -- "$task" ".terminus/designs/${task}.json" ".terminus/designs/${task}-test-map.json" ".terminus/executions/$task" || true)"
              [[ -z "$drift" ]] || { echo "::error::EC2 changed concurrently:"; echo "$drift"; exit 75; }
              git rebase "$remote"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 1
          done
          echo "::error::unable to publish runtime/oracle evidence"
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-runtime-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ec2-runtime-validation
          if-no-files-found: warn
