name: Generate Fresh JetStream 0FE5 Q4 Q6 Packets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  packets:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Generate exact-commit Q4 and Q6 packets
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change 'Third-cycle Q4 findings remediated without increasing F2P count; refrozen at 0fe5c749 with 5,523 substantive LOC, 40 tests = 30 F2P + 10 P2P, Oracle 40/40 and NOP exactly 30 F2P fail + 10 P2P pass. Reconciliation progress outputs and source-ownership validation now cover the existing solver-visible contract.'
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            production-logic \
            --state FROZEN_CANDIDATE \
            --change 'Refrozen at 0fe5c749 after Q4 verifier/interface/reference remediation. Production system architecture remains the same; solver-visible runtime/configuration changed only to expose already-contracted reconciliation progress fields and source-ownership validation. Formatting-only churn was removed.'
          find .terminus/reviews/jetstream-regional-stream-continuity/0fe5c749 -type f -name '*.packet.json' -print -exec cat {} \;

      - name: Upload immutable generated packets
        uses: actions/upload-artifact@v4
        with:
          name: jetstream-q4-q6-0fe5-${{ github.run_id }}
          path: .terminus/reviews/jetstream-regional-stream-continuity/0fe5c749/*.packet.json
          if-no-files-found: error
          retention-days: 14
