name: StoneVault Refreeze Review Packets Temp

on:
  push:
    paths:
      - '.github/workflows/stonevault-refreeze-review-packets-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate fresh Q4 and Q6 packets
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py stonevault-crash-safe-storage spec-test-contract --change "Consolidated remediation of Q4-001 through Q4-011 after Oracle 63/63, NOP 30 failed/33 passed, Complexity PASS, Runtime Authenticity PASS, and deterministic refreeze"
          python3 .terminus/new_review_packet.py stonevault-crash-safe-storage production-logic --change "Refrozen after Q4 remediation changed the solver-visible technical contract within environment scope; re-audit production logic and scope independently"
          git status --short .terminus/reviews/stonevault-crash-safe-storage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .terminus/reviews/stonevault-crash-safe-storage
          git commit -m 'review: generate refrozen StoneVault Q4 Q6 packets'
          git push origin HEAD:main
