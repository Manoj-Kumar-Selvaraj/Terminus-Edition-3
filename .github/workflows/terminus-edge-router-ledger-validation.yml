name: Terminus Edge Router Ledger Validation

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-ledger-validation.yml'

permissions:
  contents: read

env:
  TASK_ID: edge-router-runtime
  TASK_COMMIT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay committed controller ledger
        run: |
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_COMMIT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --output /tmp/state.json
          cat /tmp/state.json
          python3 - <<'PY'
          import json
          state = json.load(open('/tmp/state.json'))
          nxt = state['next']
          assert nxt['action'] == 'INVOKE_STAGE', nxt
          assert nxt['stage_id'] == 'WORK_PACKAGE_RESEARCH', nxt
          assert nxt['primary_role_id'] == 'A1_SCENARIO_RESEARCHER', nxt
          print('COMMITTED_LEDGER_REPLAY=PASS')
          print('NEXT_STAGE=WORK_PACKAGE_RESEARCH')
          PY
