name: Terminus Edge Router Controller Emit

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-controller-emit.yml'

permissions:
  contents: read

env:
  TASK_ID: edge-router-runtime
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad

jobs:
  emit-controller-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical controller evidence
        run: |
          python3 - <<'PY'
          import json
          rule_inputs = {
              "CREATION_REQUEST": "Create a production-grade real-time non-Python HTTP edge-routing and traffic-management task in Go.",
              "REQUESTED_DOMAIN": "production Go HTTP edge-routing and traffic-management runtime",
              "REQUESTED_PROFILE": "large_system_strict",
              "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image"
          }
          json.dump(rule_inputs, open('/tmp/rule-inputs.json','w'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$GITHUB_SHA" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/rule-inputs.json \
            --output /tmp/rule-next.json
          python3 - <<'PY'
          import json, os
          payload = json.load(open('/tmp/rule-next.json'))
          invocation = payload['invocation']
          assert invocation['stage']['stage_id'] == 'RULE_RESOLUTION'
          assert invocation['readiness'] == 'READY'
          json.dump(invocation, open('/tmp/rule-invocation.json','w'), indent=2, sort_keys=True)
          cp = os.environ['CONTROL_PLANE_COMMIT']
          result = {
              "schema_version": "1.0",
              "invocation_id": invocation["invocation_id"],
              "output_task_commit": os.environ["GITHUB_SHA"],
              "status": "RULES_RESOLVED",
              "outputs": {
                  "CONTROL_PLANE_COMMIT": cp,
                  "RULE_SOURCES": ["TERMINUS_3_AI_INSTRUCTIONS.md", ".terminus/AGENT_SYSTEM.md", ".terminus/agents/CREATION_CONTROLLER.md", ".terminus/agents/CREATION_PIPELINE.md", ".terminus/agents/PRODUCTION_AUTHENTICITY.md", ".terminus/reviewers/REVIEWER_CHECKLIST.md", ".terminus/agents/stage_contracts.json"],
                  "ACTIVE_VALIDATORS": [".terminus/validate_agent_system.py", ".terminus/validate_stage_contracts.py", ".terminus/validate_task_complexity.py", ".terminus/validate_runtime_authenticity.py", ".terminus/validate_review_freshness.py", ".terminus/validate_quality_interlock.py", "Terminus Edition 3 CI", "Terminus Creator Complexity Gate", "Terminus Production Authenticity Gate"],
                  "CREATION_PROFILE": "large_system_strict",
                  "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image",
                  "KNOWN_POLICY_CONFLICTS": []
              },
              "evidence_refs": [{"kind":"COMMIT","ref":"commit:"+cp}]
          }
          json.dump(result, open('/tmp/rule-result.json','w'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py record \
            --invocation /tmp/rule-invocation.json \
            --result /tmp/rule-result.json \
            --output /tmp/rule-record-response.json
          python3 - <<'PY'
          import json, os
          cp = os.environ['CONTROL_PLANE_COMMIT']
          context = {
              "CONTROL_PLANE_COMMIT": cp,
              "RULE_SOURCES": ["TERMINUS_3_AI_INSTRUCTIONS.md", ".terminus/AGENT_SYSTEM.md", ".terminus/agents/CREATION_CONTROLLER.md", ".terminus/agents/CREATION_PIPELINE.md", ".terminus/agents/PRODUCTION_AUTHENTICITY.md", ".terminus/reviewers/REVIEWER_CHECKLIST.md", ".terminus/agents/stage_contracts.json"],
              "ACTIVE_VALIDATORS": [".terminus/validate_agent_system.py", ".terminus/validate_stage_contracts.py", ".terminus/validate_task_complexity.py", ".terminus/validate_runtime_authenticity.py", ".terminus/validate_review_freshness.py", ".terminus/validate_quality_interlock.py", "Terminus Edition 3 CI", "Terminus Creator Complexity Gate", "Terminus Production Authenticity Gate"],
              "CREATION_PROFILE": "large_system_strict",
              "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image",
              "KNOWN_POLICY_CONFLICTS": []
          }
          json.dump({"CREATION_RULE_CONTEXT": context, "REQUESTED_DOMAIN": "production Go HTTP edge-routing and traffic-management runtime"}, open('/tmp/a1-inputs.json','w'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$GITHUB_SHA" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/a1-inputs.json \
            --output /tmp/a1-next.json

      - name: Emit exact canonical JSON
        run: |
          echo '===RULE_INVOCATION_BEGIN==='
          cat /tmp/rule-invocation.json
          echo '===RULE_INVOCATION_END==='
          echo '===RULE_RESULT_BEGIN==='
          cat /tmp/rule-result.json
          echo '===RULE_RESULT_END==='
          echo '===LEDGER_BEGIN==='
          cat .terminus/executions/edge-router-runtime/ledger.jsonl
          echo '===LEDGER_END==='
          echo '===EXECUTION_RECORD_BEGIN==='
          cat .terminus/executions/edge-router-runtime/*.result.json
          echo '===EXECUTION_RECORD_END==='
          echo '===A1_NEXT_BEGIN==='
          cat /tmp/a1-next.json
          echo '===A1_NEXT_END==='
