name: Fix payment EOD verifier lint

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Apply exact lint cleanups and verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('payment-eod-control-chain/tests/test_outputs.py')
          text = path.read_text()
          text = text.replace('import pytest\n\n', '')
          text = text.replace(
              "    DB.parent.mkdir(parents=True, exist_ok=True); DB.unlink(missing_ok=True)\n",
              "    DB.parent.mkdir(parents=True, exist_ok=True)\n    DB.unlink(missing_ok=True)\n",
          )
          text = text.replace(
              "    shutil.rmtree(OUT, ignore_errors=True); OUT.mkdir(parents=True, exist_ok=True)\n",
              "    shutil.rmtree(OUT, ignore_errors=True)\n    OUT.mkdir(parents=True, exist_ok=True)\n",
          )
          text = text.replace(
              "    con = sqlite3.connect(DB); con.executescript(SCHEMA.read_text()); con.execute('PRAGMA foreign_keys=OFF'); con.executescript(seed); con.commit(); con.close()\n",
              "    con = sqlite3.connect(DB)\n    con.executescript(SCHEMA.read_text())\n    con.execute('PRAGMA foreign_keys=OFF')\n    con.executescript(seed)\n    con.commit()\n    con.close()\n",
          )
          text = text.replace(
              "    reset_db(seed); run_batch()\n",
              "    reset_db(seed)\n    run_batch()\n",
          )
          path.write_text(text)
          PY

          uvx --from ruff==0.12.8 ruff check payment-eod-control-chain/tests
          python3 -m py_compile payment-eod-control-chain/tests/test_outputs.py

          rm -f .terminus/staging/payment-eod-ruff-diagnostic.txt
          rm -f .terminus/staging/payment-eod-lint-fix.ready
          rm -f .github/workflows/fix-payment-eod-verifier-lint.yml

          git config user.name "terminus-ci"
          git config user.email "terminus-ci@users.noreply.github.com"
          git add -A
          git commit -m "Fix payment EOD verifier lint"
          git push origin HEAD:main
