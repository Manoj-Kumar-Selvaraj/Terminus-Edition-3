name: Terraform Ansible Frozen Quality Packets

on:
  push:
    branches:
      - task/terraform-ansible-managed-resources-validation
    paths:
      - .github/workflows/terraform-ansible-quality-packets.yml

permissions:
  contents: read

jobs:
  packets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Q4 packet
        run: |
          python3 .terminus/new_review_packet.py terraform-ansible-managed-resources spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change 'Fresh post-freeze Q4 after forward A3/A2B provenance recovery, Q2 cleanup-coverage repair, and exact 35-test deterministic validation.'
      - name: Generate Q6 packet
        run: |
          python3 .terminus/new_review_packet.py terraform-ansible-managed-resources production-logic \
            --state FROZEN_CANDIDATE \
            --change 'Fresh post-freeze Q6 after forward A3/A2B provenance recovery and exact task-scoped complexity/runtime/deterministic validation.'
      - name: Show packets
        run: |
          find .terminus/reviews/terraform-ansible-managed-resources -name '*.packet.json' -type f -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-ansible-quality-packets
          path: .terminus/reviews/terraform-ansible-managed-resources/**/*.packet.json
          if-no-files-found: error
