name: Classify COBOL Q4 review delta

on:
  push:
    paths:
      - '.github/workflows/classify-cobol-q4-review-delta.yml'

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify Q4 delta and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TASK='cobol-comp3-python-equiv'
          EXPECTED='9ce15848421135eaa83c356c26a0661ec795532f'
          PRIOR='.terminus/reviews/cobol-comp3-python-equiv/02a558ab/cobol-comp3-python-equiv-02a558ab-spec-test-contract-5feb4ce4ba.json'
          CURRENT='.terminus/reviews/cobol-comp3-python-equiv/9ce15848/cobol-comp3-python-equiv-9ce15848-spec-test-contract-425d520855.json'
          WORKFLOW='.github/workflows/classify-cobol-q4-review-delta.yml'

          actual="$(git log -1 --format=%H -- "$TASK")"
          echo "Git-derived task commit: $actual"
          [[ "$actual" == "$EXPECTED" ]] || { echo "::error::STALE task commit"; exit 1; }

          echo '--- deterministic review-delta classification ---'
          python3 .terminus/classify_review_delta.py "$PRIOR" "$CURRENT" | tee /tmp/q4-delta.json
          echo '--- end classification ---'

          rm -f "$WORKFLOW"
          git config user.name 'terminus-review-delta-bot'
          git config user.email 'terminus-review-delta-bot@users.noreply.github.com'
          git add "$WORKFLOW"
          git commit -m 'Remove temporary COBOL Q4 delta classifier workflow'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
