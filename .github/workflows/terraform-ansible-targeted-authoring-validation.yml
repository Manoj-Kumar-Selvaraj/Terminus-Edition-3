name: Terraform Ansible Targeted Authoring Validation

on:
  pull_request:
    paths:
      - "terraform-ansible-managed-resources/**"
      - ".terminus/designs/terraform-ansible-managed-resources*.json"
      - ".github/workflows/terraform-ansible-targeted-authoring-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-authoring-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate task complexity
        run: python3 .terminus/validate_task_complexity.py terraform-ansible-managed-resources
      - name: Validate runtime authenticity
        run: python3 .terminus/validate_runtime_authenticity.py terraform-ansible-managed-resources
      - name: Validate business module diversity
        run: python3 .terminus/validate_business_module_diversity.py terraform-ansible-managed-resources
