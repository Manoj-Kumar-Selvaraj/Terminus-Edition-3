name: Freeze COBOL Q4 closure packet

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - .github/workflows/freeze-cobol-q4-closure-packet.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0

      - name: Verify exact closure strategy and frozen task
        shell: bash
        run: |
          set -euo pipefail
          REDESIGN=ddf8fd8f1219e807464897a93538e75fbe316fbd
          TASK_COMMIT=bb2e042c45873da3f3d78836d915ddb6446debf2
          git merge-base --is-ancestor "$REDESIGN" HEAD
          test -z "$(git diff --name-only "$REDESIGN"..HEAD -- cobol-comp3-python-equiv)"
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "$TASK_COMMIT"
          test -f .terminus/agents/Q4_CLOSURE_POLICY.md
          grep -F 'Policy version: `1.0`' .terminus/agents/Q4_CLOSURE_POLICY.md
          test -f .terminus/new_q4_closure_packet.py
          test -f .terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json
          test -f .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-spec-test-contract-852fc1b28a.json
          test "$(git status --porcelain -- cobol-comp3-python-equiv)" = ""
          test "$(find .terminus/reviews/cobol-comp3-python-equiv/bb2e042c -maxdepth 1 -type f -name '*q4-closure-adjudication*.packet.json' | wc -l)" -eq 0
          test "$(find .terminus/reviews/cobol-comp3-python-equiv/bb2e042c -maxdepth 1 -type f -name '*q4-closure-adjudication*.json' ! -name '*.packet.json' | wc -l)" -eq 0

      - name: Harden structural closure packet bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          generator = Path('.terminus/new_q4_closure_packet.py')
          text = generator.read_text(encoding='utf-8')
          anchor = '''    packet["question"] = (\n'''
          addition = '''    packet["closure_policy_version"] = "1.0"\n    packet["boundary_adjudication"] = boundary_rel\n    packet["final_q4_result"] = q4_rel\n    packet["repair_base_task_commit"] = args.repair_base\n    packet["final_task_commit"] = final_commit\n    packet["finding_fingerprints"] = {}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('generator structural-binding anchor mismatch')
          text = text.replace(anchor, addition + anchor, 1)
          old_fp = '''        packet["evidence_allowed"].append(\n            f"q4_finding:{finding_id}:{finding_fingerprint(finding)}"\n        )\n'''
          new_fp = '''        fingerprint = finding_fingerprint(finding)\n        packet["finding_fingerprints"][finding_id] = fingerprint\n        packet["evidence_allowed"].append(\n            f"q4_finding:{finding_id}:{fingerprint}"\n        )\n'''
          if text.count(old_fp) != 1:
              raise SystemExit('generator fingerprint anchor mismatch')
          generator.write_text(text.replace(old_fp, new_fp, 1), encoding='utf-8')

          schema_path = Path('.terminus/agents/schemas/context_packet.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['properties']
          props['closure_policy_version'] = {'type': 'string', 'minLength': 1}
          props['boundary_adjudication'] = {'type': 'string', 'minLength': 1}
          props['final_q4_result'] = {'type': 'string', 'minLength': 1}
          props['repair_base_task_commit'] = {'type': 'string', 'minLength': 40}
          props['final_task_commit'] = {'type': 'string', 'minLength': 40}
          props['finding_fingerprints'] = {'type': 'object'}
          closure_required = [
              'closure_policy_version',
              'boundary_adjudication',
              'final_q4_result',
              'repair_base_task_commit',
              'final_task_commit',
              'finding_fingerprints',
          ]
          conditional = {
              'if': {'properties': {'role': {'const': 'Q4 Closure Adjudicator'}}},
              'then': {'required': closure_required},
          }
          schema['allOf'] = [
              item for item in schema.get('allOf', [])
              if item.get('if', {}).get('properties', {}).get('role', {}).get('const') != 'Q4 Closure Adjudicator'
          ]
          schema['allOf'].append(conditional)
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          closure_path = Path('.terminus/q4_closure.py')
          ctext = closure_path.read_text(encoding='utf-8')
          boundary_anchor = '''    boundary = None\n    q4 = None\n'''
          boundary_checks = '''    if packet.get("closure_policy_version") != "1.0":\n        errors.append("closure packet policy version must be 1.0")\n    if packet.get("boundary_adjudication") != boundary_rel:\n        errors.append("closure packet top-level boundary binding mismatch")\n    if packet.get("final_q4_result") != final_q4_rel:\n        errors.append("closure packet top-level final-Q4 binding mismatch")\n    if packet.get("repair_base_task_commit") != repair_base:\n        errors.append("closure packet top-level repair-base binding mismatch")\n    if packet.get("final_task_commit") != final_commit:\n        errors.append("closure packet top-level final-task binding mismatch")\n\n'''
          if ctext.count(boundary_anchor) != 1:
              raise SystemExit('closure validator boundary anchor mismatch')
          ctext = ctext.replace(boundary_anchor, boundary_checks + boundary_anchor, 1)
          fp_anchor = '''    packet_fps: dict[str, str] = {}\n'''
          fp_check = '''    top_level_fps = packet.get("finding_fingerprints")\n    if not isinstance(top_level_fps, dict) or top_level_fps != expected_fps:\n        errors.append("closure packet top-level finding fingerprints do not exactly bind final Q4")\n\n'''
          if ctext.count(fp_anchor) != 1:
              raise SystemExit('closure validator fingerprint anchor mismatch')
          closure_path.write_text(ctext.replace(fp_anchor, fp_check + fp_anchor, 1), encoding='utf-8')

          test_path = Path('.terminus/tests/test_q4_closure.py')
          ttext = test_path.read_text(encoding='utf-8')
          fixture_anchor = '''    closure_packet["evidence_allowed"] = [\n        f"boundary_adjudication:{boundary_rel}",\n        f"final_q4_result:{q4_rel}",\n        f"repair_diff:{base}..{final}:{task}",\n        f"q4_finding:Q4-001:{fp}",\n    ]\n'''
          fixture_new = fixture_anchor + '''    closure_packet["closure_policy_version"] = "1.0"\n    closure_packet["boundary_adjudication"] = boundary_rel\n    closure_packet["final_q4_result"] = q4_rel\n    closure_packet["repair_base_task_commit"] = base\n    closure_packet["final_task_commit"] = final\n    closure_packet["finding_fingerprints"] = {"Q4-001": fp}\n'''
          if ttext.count(fixture_anchor) != 1:
              raise SystemExit('closure test fixture anchor mismatch')
          ttext = ttext.replace(fixture_anchor, fixture_new, 1)
          extra = '''\n\ndef test_ready_closure_rejects_top_level_chain_drift(tmp_path: Path) -> None:\n    root, rel = _fixture(tmp_path)\n    result = json.loads((root / rel).read_text())\n    packet_path = root / result["context_packet"]\n    packet = json.loads(packet_path.read_text())\n    packet["final_task_commit"] = "0" * 40\n    packet_path.write_text(json.dumps(packet))\n    errors, _ = q4_closure.validate_ready_closure(root, rel)\n    assert any("top-level final-task binding mismatch" in error for error in errors)\n\n\ndef test_ready_closure_rejects_top_level_fingerprint_drift(tmp_path: Path) -> None:\n    root, rel = _fixture(tmp_path)\n    result = json.loads((root / rel).read_text())\n    packet_path = root / result["context_packet"]\n    packet = json.loads(packet_path.read_text())\n    packet["finding_fingerprints"]["Q4-001"] = "0" * 64\n    packet_path.write_text(json.dumps(packet))\n    errors, _ = q4_closure.validate_ready_closure(root, rel)\n    assert any("top-level finding fingerprints" in error for error in errors)\n'''
          if 'test_ready_closure_rejects_top_level_chain_drift' in ttext:
              raise SystemExit('closure top-level regression tests already exist')
          test_path.write_text(ttext.rstrip() + extra + '\n', encoding='utf-8')
          PY
          python -m py_compile .terminus/new_q4_closure_packet.py .terminus/q4_closure.py
          git diff --check
          if git diff --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: closure hardening changed task scope' >&2
            exit 1
          fi

      - name: Validate and commit closure control-plane hardening
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q .terminus/tests/test_q4_closure.py
          python .terminus/validate_agent_system.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .terminus/new_q4_closure_packet.py \
            .terminus/q4_closure.py \
            .terminus/agents/schemas/context_packet.schema.json \
            .terminus/tests/test_q4_closure.py
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: closure hardening staged task scope' >&2
            exit 1
          fi
          git commit -m 'control: bind Q4 closure packet chain structurally'
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "bb2e042c45873da3f3d78836d915ddb6446debf2"

      - name: Generate repository-native Q4 closure packet
        shell: bash
        run: |
          set -euo pipefail
          python .terminus/new_q4_closure_packet.py \
            cobol-comp3-python-equiv \
            --boundary-adjudication .terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json \
            --final-q4 .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-spec-test-contract-852fc1b28a.json \
            --repair-base 59dcf2146e1bac84cbc98d7d641e79b5a0138c4a \
            | tee /tmp/closure-packet-generation.log
          packet=$(find .terminus/reviews/cobol-comp3-python-equiv/bb2e042c -maxdepth 1 -type f -name '*q4-closure-adjudication*.packet.json')
          test -n "$packet"
          test "$(printf '%s\n' "$packet" | wc -l)" -eq 1
          printf '%s\n' "$packet" > /tmp/closure-packet-path

      - name: Validate packet bindings and result absence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          task_commit = 'bb2e042c45873da3f3d78836d915ddb6446debf2'
          boundary = '.terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json'
          final_q4 = '.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-spec-test-contract-852fc1b28a.json'
          repair_base = '59dcf2146e1bac84cbc98d7d641e79b5a0138c4a'

          packet_path = Path(Path('/tmp/closure-packet-path').read_text().strip())
          packet = json.loads(packet_path.read_text(encoding='utf-8'))
          q4 = json.loads(Path(final_q4).read_text(encoding='utf-8'))

          assert packet['schema_version'] == '3.0'
          assert packet['role'] == 'Q4 Closure Adjudicator'
          assert packet['state'] == 'Q4_CLOSURE_ADJUDICATION'
          assert packet['task'] == 'cobol-comp3-python-equiv'
          assert packet['task_commit'] == task_commit
          assert packet['final_task_commit'] == task_commit
          assert packet['repair_base_task_commit'] == repair_base
          assert packet['boundary_adjudication'] == boundary
          assert packet['final_q4_result'] == final_q4
          assert packet['closure_policy_version'] == '1.0'
          assert packet['prior_verdicts_visible'] is True
          assert len(packet['role_contract_hash']) == 64

          fingerprints = packet['finding_fingerprints']
          assert isinstance(fingerprints, dict)
          q4_ids = {str(item['id']) for item in q4['findings']}
          assert set(fingerprints) == q4_ids
          assert all(len(value) == 64 for value in fingerprints.values())

          expected_packet = Path(packet['review_output_path']).with_suffix('.packet.json')
          assert packet_path == expected_packet
          assert not Path(packet['review_output_path']).exists()
          assert packet_path.parent.name == task_commit[:8]

          print('packet=' + packet_path.as_posix())
          print('review_id=' + packet['review_id'])
          print('review_output=' + packet['review_output_path'])
          print('control_plane_commit=' + packet['control_plane_commit'])
          print('role_contract_hash=' + packet['role_contract_hash'])
          print('finding_count=' + str(len(fingerprints)))
          for finding_id in sorted(fingerprints):
              print(f'fingerprint[{finding_id}]={fingerprints[finding_id]}')
          PY
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "bb2e042c45873da3f3d78836d915ddb6446debf2"
          if git diff --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: packet generation changed task scope' >&2
            exit 1
          fi

      - name: Commit immutable packet and remove freezer
        shell: bash
        run: |
          set -euo pipefail
          packet=$(cat /tmp/closure-packet-path)
          rm .github/workflows/freeze-cobol-q4-closure-packet.yml
          git add "$packet" .github/workflows/freeze-cobol-q4-closure-packet.yml
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: packet commit staged task scope' >&2
            exit 1
          fi
          git commit -m 'review: freeze COBOL Q4 closure packet'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
