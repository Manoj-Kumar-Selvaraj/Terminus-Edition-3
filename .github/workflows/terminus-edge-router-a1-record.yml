name: Terminus Edge Router A1 Record

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-a1-record.yml'

permissions:
  contents: read

env:
  TASK_ID: edge-router-runtime
  TASK_SNAPSHOT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad
  A1_INVOCATION_ID: inv_79d4551ca8b96875e1f37dc7cea565949e1ade639e32fa1b5de68d5a081bf0d8

jobs:
  record-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact A1 invocation
        run: |
          python3 - <<'PY'
          import json, os
          cp = os.environ['CONTROL_PLANE_COMMIT']
          context = {
              "CONTROL_PLANE_COMMIT": cp,
              "RULE_SOURCES": [
                  "TERMINUS_3_AI_INSTRUCTIONS.md",
                  ".terminus/AGENT_SYSTEM.md",
                  ".terminus/agents/CREATION_CONTROLLER.md",
                  ".terminus/agents/CREATION_PIPELINE.md",
                  ".terminus/agents/PRODUCTION_AUTHENTICITY.md",
                  ".terminus/reviewers/REVIEWER_CHECKLIST.md",
                  ".terminus/agents/stage_contracts.json"
              ],
              "ACTIVE_VALIDATORS": [
                  ".terminus/validate_agent_system.py",
                  ".terminus/validate_stage_contracts.py",
                  ".terminus/validate_task_complexity.py",
                  ".terminus/validate_runtime_authenticity.py",
                  ".terminus/validate_review_freshness.py",
                  ".terminus/validate_quality_interlock.py",
                  "Terminus Edition 3 CI",
                  "Terminus Creator Complexity Gate",
                  "Terminus Production Authenticity Gate"
              ],
              "CREATION_PROFILE": "large_system_strict",
              "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image",
              "KNOWN_POLICY_CONFLICTS": []
          }
          json.dump({"CREATION_RULE_CONTEXT": context, "REQUESTED_DOMAIN": "production Go HTTP edge-routing and traffic-management runtime"}, open('/tmp/a1-inputs.json','w'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/a1-inputs.json \
            --output /tmp/a1-next.json
          python3 - <<'PY'
          import json, os
          payload = json.load(open('/tmp/a1-next.json'))
          invocation = payload.get('invocation')
          assert isinstance(invocation, dict)
          assert invocation['invocation_id'] == os.environ['A1_INVOCATION_ID']
          assert invocation['stage']['stage_id'] == 'WORK_PACKAGE_RESEARCH'
          assert invocation['readiness'] == 'READY'
          json.dump(invocation, open('/tmp/a1-invocation.json','w'), indent=2, sort_keys=True)
          PY

      - name: Build corrected A1 stage result
        run: |
          python3 - <<'PY'
          import json, os
          candidates = [
            {
              "ID":"GENERATION_SAFE_DYNAMIC_RECONCILIATION",
              "PERSONA":"Edge platform engineer or SRE responsible for a public-facing Go HTTP edge-routing runtime.",
              "ENGINEERING_OBJECTIVE":"Implement generation-safe dynamic route and upstream reconciliation so configuration and backend-membership changes can be applied atomically under concurrent traffic, rolling backend turnover, invalid updates, and process restart.",
              "REQUIRED_END_STATE":[
                "Configuration inputs are validated and compiled into immutable runtime snapshots before publication.",
                "Every accepted configuration generation is fenced so stale or out-of-order generations cannot overwrite newer state.",
                "Route and upstream-pool state becomes visible atomically rather than through partially applied generations.",
                "Endpoint reconciliation identifies additions, removals, and unchanged endpoints using stable runtime identity.",
                "Reusable load-balancing, stickiness, health, and lifecycle state is preserved for unchanged endpoints.",
                "Removed endpoints enter an explicit draining lifecycle before retirement instead of disappearing immediately.",
                "Retries and sticky routing avoid endpoints that are no longer eligible while preserving continuity where safe.",
                "Invalid updates leave the last-known-good generation serving traffic.",
                "The latest accepted generation can be checkpointed and recovered without publishing mixed or partially restored state.",
                "Lifecycle telemetry and per-generation or per-endpoint metrics are garbage-collected when their owning runtime state is retired."
              ],
              "REQUIREMENT_FAMILIES":["configuration ingestion and semantic validation","route-graph compilation","generation fencing and atomic publication","backend discovery and endpoint diffing","health-state lifecycle","weighted, sticky, retry, and failover selection","connection and endpoint draining","checkpoint persistence and restart recovery","observability lifecycle and metric garbage collection"],
              "INHERITED_SYSTEM_STATE":"Only the solver-visible target is assumed: a Go public-facing HTTP edge-routing and traffic-management runtime. No hidden incident history, pre-existing topology, private design, implementation defect, oracle behavior, or verifier-private expectation is assumed.",
              "REASONING_CHAIN":["receive candidate update","validate and compile it","check generation ordering","diff the endpoint and route graph","migrate reusable runtime state","atomically publish the complete generation","serve requests through health, selection, retry, stickiness, and drain state","retire unreachable runtime objects and telemetry","checkpoint accepted state","recover a complete last-known-good generation after restart"],
              "PARTIAL_FIX_TRAPS":["Rebuilding all load-balancing or sticky state on every reload makes an apparently correct reload path operationally unstable.","Publishing routes before their referenced pools produces mixed-generation request handling.","Validating syntax without generation fencing still permits stale updates to win races.","Removing a backend immediately can terminate or strand in-flight traffic.","Keeping retired endpoint metrics indefinitely creates stale observations and unbounded cardinality.","Checkpointing metadata before the complete runtime generation is durable can recover a state that was never safely published.","Treating duplicate endpoint aliases as independent identities can split health and load-balancing state."],
              "PRESERVATION_OBLIGATIONS":["In-flight and long-lived requests remain valid across unrelated updates.","Unchanged route semantics remain stable across generations.","Healthy unchanged endpoints preserve meaningful runtime selection and affinity state.","A rejected update cannot damage the currently serving generation.","Readers never observe a partially applied configuration.","Runtime and observability state remain bounded after repeated updates."],
              "SCALE_FIT":{"ASSESSMENT":"VERY_HIGH","SUBSTANTIVE_RUNTIME_LOC":"Naturally supports at least 3000 substantive reachable runtime/configuration LOC without filler.","MODULE_BREADTH":"Approximately 8-10 strongly coupled implementation areas.","DEFECT_MANIFESTATIONS":"Naturally supports approximately 20-30 materially distinct behavioral manifestations.","F2P_SURFACE":"Naturally supports approximately 25-30 non-duplicative functional tests spanning normal, edge, boundary, negative, concurrency, restart, and failure behavior.","P2P_SURFACE":"Strong preservation-test surface around last-known-good serving, unchanged-route behavior, in-flight traffic, affinity continuity, and bounded state."},
              "EDGE_FAILURE_SURFACE":["duplicate and out-of-order configuration generations","bursts of watcher or discovery events","invalid updates mixed with valid endpoint changes","backend disappearance during an active request","stale affinity targeting an ineligible backend","all backends unhealthy","restart during or immediately after an update","duplicate endpoint identities","slow or stuck drains","rapid remove and re-add of the same endpoint","retired metric cleanup","corrupt or incomplete checkpoint","concurrent request readers racing with state publication"],
              "INSTRUCTION_FIT":"The material behavior can be expressed in roughly 10-12 concise family-level requirements, remaining comfortably within the strict instruction-size limit without exposing an implementation blueprint.",
              "REFERENCES":["[https://caddyserver.com/docs/caddyfile/directives/reverse_proxy](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy)","[https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/](https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/)","[https://github.com/caddyserver/caddy/issues/6844](https://github.com/caddyserver/caddy/issues/6844)","[https://github.com/traefik/traefik/issues/2068](https://github.com/traefik/traefik/issues/2068)","[https://github.com/traefik/traefik/issues/8787](https://github.com/traefik/traefik/issues/8787)","[https://github.com/traefik/traefik/issues/9836](https://github.com/traefik/traefik/issues/9836)","[https://github.com/traefik/traefik/issues/7886](https://github.com/traefik/traefik/issues/7886)"],
              "DUPLICATE_RISK":"MEDIUM: dynamic reload and reconciliation are established production patterns, but coupling generation fencing, atomic publication, runtime-state migration, draining, restart checkpointing, and telemetry garbage collection into one causal state-transition system gives the candidate a materially more distinctive shape than a generic reload task."
            },
            {
              "ID":"HEALTH_AWARE_POOL_LIFECYCLE_AND_FAILOVER",
              "PERSONA":"Traffic reliability engineer responsible for upstream selection and failure containment in a Go edge service.",
              "ENGINEERING_OBJECTIVE":"Build a coherent health-aware upstream-pool state machine combining active and passive health signals with weighted selection, stickiness, retries, failover, dynamic membership, and safe all-down behavior.",
              "REQUIRED_END_STATE":["Active probes use the correct upstream transport, host, scheme, timeout, and TLS identity.","Passive request failures update bounded health state with explicit aging or decay.","Health transitions use deterministic state rules rather than instantaneous uncontrolled flapping.","Only eligible endpoints participate in load balancing.","Retries exclude already failed or newly ineligible targets.","Sticky affinity is retained for healthy endpoints and safely remapped when its target becomes unavailable.","Composite failover or weighted services propagate child health correctly.","Dynamic endpoint additions and removals reconcile without leaking health state.","The zero-healthy-endpoint case fails deterministically without retry amplification.","Probe, endpoint, and transition telemetry remains bounded."],
              "REQUIREMENT_FAMILIES":["active health probing","passive health accounting","health-transition state machine","weighted upstream selection","sticky affinity","retry target exclusion","failover and child-health propagation","dynamic endpoint reconciliation","connection lifecycle","health telemetry"],
              "INHERITED_SYSTEM_STATE":"Only the solver-visible Go edge-routing runtime target is assumed. No excluded implementation, incident, oracle, review, or verifier state is treated as inherited fact.",
              "REASONING_CHAIN":["observe active and passive evidence","classify endpoint health","update endpoint eligibility","select a destination","retry or fail over when permitted","propagate aggregate service health","age transient failure state","reconcile membership changes","garbage-collect retired state"],
              "PARTIAL_FIX_TRAPS":["A probe can report false failures if its TLS name, host, or transport differs from normal traffic.","Retries can repeatedly select the same failed endpoint.","Passive failure counters can permanently poison an endpoint if they never decay.","Affinity can continue pinning clients to an unhealthy endpoint.","Parent failover state can disagree with the health of nested child services.","Reloading can silently reset health state and cause traffic oscillation.","Duplicate endpoint representations can be counted as independent capacity."],
              "PRESERVATION_OBLIGATIONS":["Healthy-peer traffic distribution remains meaningful.","Sticky clients remain on their healthy target when possible.","Retry behavior cannot create uncontrolled amplification.","Health probing remains bounded under large pools.","Existing request semantics remain unchanged when all upstreams are healthy."],
              "SCALE_FIT":{"ASSESSMENT":"HIGH","SUBSTANTIVE_RUNTIME_LOC":"Approximately 3000-5000 substantive LOC is plausible when implemented as one health and pool lifecycle system.","DEFECT_MANIFESTATIONS":"Approximately 20-25 distinct manifestations arise naturally.","F2P_SURFACE":"Approximately 25-30 distinct behavioral tests are credible.","P2P_SURFACE":"Good preservation coverage exists for healthy routing, affinity, weighting, and bounded probes.","RISK":"The scope can degrade into a feature collection unless all requirements are organized around a single endpoint-health state machine."},
              "EDGE_FAILURE_SURFACE":["intermittent upstream TLS failure","half-responsive backend","health flapping","all endpoints unhealthy","health-check timeout","health request affected by routing middleware","dynamic endpoint removal","stale affinity","duplicate endpoints","probe and production-transport disagreement"],
              "INSTRUCTION_FIT":"Approximately 9-12 grouped requirements are sufficient.",
              "REFERENCES":["[https://caddyserver.com/docs/caddyfile/directives/reverse_proxy](https://caddyserver.com/docs/caddyfile/directives/reverse_proxy)","[https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/](https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/)","[https://github.com/caddyserver/caddy/issues/6489](https://github.com/caddyserver/caddy/issues/6489)","[https://github.com/traefik/traefik/issues/7886](https://github.com/traefik/traefik/issues/7886)","[https://github.com/traefik/traefik/issues/5316](https://github.com/traefik/traefik/issues/5316)","[https://github.com/traefik/traefik/issues/4509](https://github.com/traefik/traefik/issues/4509)","[https://github.com/traefik/traefik/issues/8977](https://github.com/traefik/traefik/issues/8977)"],
              "DUPLICATE_RISK":"MEDIUM_HIGH: health-aware load balancing is a common benchmark shape. The lifecycle-state-machine treatment makes it credible but less original than the recommended candidate."
            },
            {
              "ID":"PROTOCOL_SAFE_PROXY_PIPELINE",
              "PERSONA":"Go networking engineer responsible for correctness and trust boundaries in a public HTTP edge runtime.",
              "ENGINEERING_OBJECTIVE":"Harden the complete HTTP proxy request and response pipeline across route rewriting, forwarding trust, query handling, transport/TLS, streaming, upgrades, cancellation, retries, and error mapping.",
              "REQUIRED_END_STATE":["Path and query rewriting preserves intended byte and escaping semantics.","Untrusted forwarding metadata is removed or reconstructed according to an explicit trust boundary.","Hop-by-hop request and response headers are handled correctly.","Upstream Host and TLS server-name behavior is deterministic.","Streaming responses and flush behavior remain low-latency.","Protocol upgrades have explicit lifecycle and cancellation handling.","Client cancellation propagates upstream.","Timeouts distinguish appropriate request phases.","Retries occur only when request bodies and methods are safely replayable.","Transport and response failures map to deterministic downstream behavior and telemetry."],
              "REQUIREMENT_FAMILIES":["route matching and path rewriting","forwarding-header trust boundary","query and escaping semantics","upstream transport and TLS","streaming and flushing","protocol upgrades","timeouts and cancellation","retry-body replay","response mutation and error handling","request telemetry"],
              "INHERITED_SYSTEM_STATE":"Only the solver-visible Go HTTP edge-runtime target is inherited; no private defect list or current implementation behavior is presumed.",
              "REASONING_CHAIN":["match route","canonicalize and rewrite request","apply forwarding trust policy","construct upstream transport request","execute request","retry only when safe","relay normal, streaming, or upgraded response","map failures","emit telemetry"],
              "PARTIAL_FIX_TRAPS":["Forwarded-header reconstruction can accidentally preserve spoofed client values.","Query normalization can change malformed or deliberately escaped inputs.","Path rewriting can double-escape segments.","A retry can silently replay a non-replayable request body incorrectly.","Streaming or upgrade paths can leak goroutines or connections.","A single broad timeout can break long-lived streams.","Host and TLS SNI can disagree."],
              "PRESERVATION_OBLIGATIONS":["Standards-compatible forwarding behavior","byte-safe path and query semantics","streaming latency","request-body integrity","client cancellation propagation","normal successful proxy behavior"],
              "SCALE_FIT":{"ASSESSMENT":"MEDIUM_HIGH","SUBSTANTIVE_RUNTIME_LOC":"Can reach the 3000 LOC strict floor naturally but has less structural breadth than the recommended reconciliation candidate.","DEFECT_MANIFESTATIONS":"Approximately 20 materially distinct manifestations are plausible.","F2P_SURFACE":"Approximately 25 protocol-focused tests are plausible.","P2P_SURFACE":"Strong preservation surface for ordinary proxying and streaming."},
              "EDGE_FAILURE_SURFACE":["malformed raw query","encoded slash and double escaping","spoofed forwarding headers","trailers","chunked request bodies","non-replayable bodies","upgrade disconnect","client cancellation","stream timeout boundaries","Host and SNI mismatch"],
              "INSTRUCTION_FIT":"Approximately 10 grouped bullets are sufficient.",
              "REFERENCES":["[https://pkg.go.dev/net/http/httputil](https://pkg.go.dev/net/http/httputil)","[https://github.com/traefik/traefik/issues/4406](https://github.com/traefik/traefik/issues/4406)","[https://github.com/traefik/traefik/issues/9841](https://github.com/traefik/traefik/issues/9841)","[https://github.com/traefik/traefik/issues/5564](https://github.com/traefik/traefik/issues/5564)"],
              "DUPLICATE_RISK":"HIGH: protocol-safe reverse-proxy hardening is an established task family and is less differentiated despite offering good technical depth."
            },
            {
              "ID":"ROLLING_BACKEND_TRANSITION_AND_DRAIN",
              "PERSONA":"Edge deployment and reliability engineer responsible for disruption-free backend turnover.",
              "ENGINEERING_OBJECTIVE":"Implement an explicit backend lifecycle from discovery through readiness, active service, draining, and retirement so rolling membership changes do not create avoidable routing failures or leaked runtime state.",
              "REQUIRED_END_STATE":["Endpoint identity remains stable across discovery updates.","New endpoints are admitted only after required readiness or health gates.","Active endpoints can transition into a draining state that excludes new traffic.","Affinity targeting a draining or failed endpoint is safely remapped.","Retries cannot select endpoints that are terminating or already failed for the request.","In-flight requests can complete within a bounded drain policy.","Long-lived streams have an explicit retirement deadline policy.","Retired endpoints release idle transport connections and runtime state.","Health transitions cannot accidentally reactivate a draining endpoint.","Per-endpoint telemetry is removed after retirement."],
              "REQUIREMENT_FAMILIES":["endpoint identity and reconciliation","readiness admission","backend lifecycle state machine","sticky-affinity migration","retry exclusion","graceful draining","long-lived stream handling","transport connection disposal","health and lifecycle interaction","observability garbage collection"],
              "INHERITED_SYSTEM_STATE":"The only inherited fact is the solver-visible Go edge-routing and traffic-management target. No hidden deployment incident or backend topology is assumed.",
              "REASONING_CHAIN":["receive membership change","identify endpoint diff","gate additions through readiness","transition removals to draining","exclude draining targets from new selection and retries","allow bounded completion of existing work","dispose transport state","retire endpoint","garbage-collect endpoint telemetry"],
              "PARTIAL_FIX_TRAPS":["A removed endpoint can remain reachable through the retry set.","A blocking drain implementation can prevent newer configuration from applying.","Idle keep-alive connections can outlive their endpoint.","Affinity can continue targeting a retired backend.","A health recovery event can accidentally re-admit an endpoint already marked for retirement.","Retired endpoint metrics can accumulate forever.","Unbounded drain semantics can strand long-lived streams indefinitely."],
              "PRESERVATION_OBLIGATIONS":["No new traffic is intentionally assigned to draining endpoints.","In-flight work has a bounded opportunity to finish.","Unchanged peers preserve their runtime routing state.","Transport resources do not leak across repeated turnover.","Planned membership transitions do not create a transient avoidable error spike."],
              "SCALE_FIT":{"ASSESSMENT":"HIGH","SUBSTANTIVE_RUNTIME_LOC":"Approximately 4000 or more substantive LOC is plausible across lifecycle, selection, transport, reconciliation, and observability components.","DEFECT_MANIFESTATIONS":"Approximately 20-25 distinct manifestations are natural.","F2P_SURFACE":"Approximately 25-30 distinct lifecycle tests are plausible.","P2P_SURFACE":"Strong preservation coverage exists for unchanged peers, in-flight requests, connection cleanup, and ordinary routing."},
              "EDGE_FAILURE_SURFACE":["rapid remove and re-add","endpoint identity reuse","all endpoints draining","long-lived stream beyond drain deadline","backend disappears before graceful drain completes","rolling membership changes with affinity enabled","health recovery during drain","connection-pool cleanup failure"],
              "INSTRUCTION_FIT":"Approximately 8-11 concise grouped requirements can express the work package.",
              "REFERENCES":["[https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/](https://doc.traefik.io/traefik/v3.5/reference/routing-configuration/http/load-balancing/service/)","[https://github.com/traefik/traefik/issues/7886](https://github.com/traefik/traefik/issues/7886)","[https://github.com/traefik/traefik/issues/5564](https://github.com/traefik/traefik/issues/5564)","[https://github.com/traefik/traefik/issues/9836](https://github.com/traefik/traefik/issues/9836)","[https://github.com/traefik/traefik/issues/8787](https://github.com/traefik/traefik/issues/8787)"],
              "DUPLICATE_RISK":"MEDIUM: graceful backend turnover is a familiar operational concern, but a full explicit lifecycle with affinity, retry, transport disposal, and state garbage collection remains a coherent production-sized package."
            }
          ]
          outputs = {
            "CANDIDATES": candidates,
            "RECOMMENDATION":"GENERATION_SAFE_DYNAMIC_RECONCILIATION",
            "WHY_THIS_ONE":"GENERATION_SAFE_DYNAMIC_RECONCILIATION has the strongest strict-profile fit without padding. Its requirement families all participate in one causal architecture: a versioned runtime-state transition from validated input through reconciliation, state migration, atomic publication, request serving, retirement, checkpointing, and recovery. That coupling naturally supports at least 3000 substantive reachable LOC, approximately 20-30 distinct failure manifestations, approximately 25-30 non-duplicative functional tests, and meaningful preservation tests. It provides normal, edge, boundary, negative, concurrency, failure, and restart surfaces while remaining expressible in fewer than 20 concise material requirements. Public references establish that reload races, stale discovery state, load-balancer reset behavior, backend turnover, and stale telemetry are real engineering work shapes, but the candidate does not copy their prose or topology. No artificial data volume is needed because this is not naturally a data-backed workload.",
            "DUPLICATE_RISK_NOTES":"An exact-name solver-visible search at input task snapshot 6c91b9aca662fa192c144d55c8aee0e693adcc0d found no edge-router-runtime match. Screening was intentionally bounded by the invocation: prior reviews, private design, oracle material, verifier-private evidence, CI/runtime evidence, and durable session state were not consulted for candidate research. Public references were used only for independent engineering-work-shape and failure-mode provenance."
          }
          result = {
            "schema_version":"1.0",
            "invocation_id":os.environ['A1_INVOCATION_ID'],
            "output_task_commit":os.environ['TASK_SNAPSHOT'],
            "status":"CANDIDATES_READY",
            "outputs":outputs,
            "evidence_refs":[
              {"kind":"COMMIT","ref":"commit:"+os.environ['CONTROL_PLANE_COMMIT']},
              {"kind":"COMMIT","ref":"commit:"+os.environ['TASK_SNAPSHOT']}
            ]
          }
          json.dump(result, open('/tmp/a1-result.json','w'), indent=2, sort_keys=True)
          PY

      - name: Record A1 through canonical recorder
        run: |
          python3 .terminus/execution/controller_cli.py record \
            --invocation /tmp/a1-invocation.json \
            --result /tmp/a1-result.json \
            --output /tmp/a1-record-response.json

      - name: Emit canonical A1 record and next-state contract
        run: |
          echo '===A1_RECORD_RESPONSE_BEGIN==='
          cat /tmp/a1-record-response.json
          echo '===A1_RECORD_RESPONSE_END==='
          echo '===LEDGER_BEGIN==='
          cat .terminus/executions/edge-router-runtime/ledger.jsonl
          echo '===LEDGER_END==='
          echo '===A1_RECORD_BEGIN==='
          cat .terminus/executions/edge-router-runtime/${A1_INVOCATION_ID}.result.json
          echo '===A1_RECORD_END==='
          echo '===NEXT_STATE_BEGIN==='
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT"
          echo '===NEXT_STATE_END==='
