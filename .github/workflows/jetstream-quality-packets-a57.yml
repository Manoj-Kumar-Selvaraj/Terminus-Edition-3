name: Generate Fresh JetStream Q4 Q6 Packets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  packets:
    if: github.event.pull_request.head.ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Generate exact-commit Q4 and Q6 packets
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py jetstream-regional-stream-continuity spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change "Historical Q4 findings remediated in verifier; refrozen at a57ed7e6 with 30 F2P + 9 P2P, Oracle 39/39 and NOP exactly 30 F2P fail + 9 P2P pass"
          python3 .terminus/new_review_packet.py jetstream-regional-stream-continuity production-logic \
            --state FROZEN_CANDIDATE \
            --change "Refrozen at a57ed7e6 after verifier-only Q4 remediation; solver-visible production runtime and production logic are unchanged, exact task-commit provenance moved"
          find .terminus/reviews/jetstream-regional-stream-continuity/a57ed7e6 -name '*.packet.json' -type f -print -exec cat {} \;
      - name: Upload immutable generated packets
        uses: actions/upload-artifact@v4
        with:
          name: jetstream-q4-q6-a57-${{ github.run_id }}
          path: .terminus/reviews/jetstream-regional-stream-continuity/a57ed7e6/*.packet.json
          if-no-files-found: error
          retention-days: 14
