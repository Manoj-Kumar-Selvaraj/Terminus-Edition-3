name: Validate COBOL strict rebuild

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/validate-cobol-strict-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile runtime and verifier
        run: |
          set -euo pipefail
          python3 -m compileall -q cobol-comp3-python-equiv/environment/equiv/src
          python3 -m compileall -q cobol-comp3-python-equiv/solution/fixed
          python3 -m py_compile cobol-comp3-python-equiv/tests/test_outputs.py
      - name: Strict complexity gate
        run: python3 .terminus/validate_task_complexity.py cobol-comp3-python-equiv
      - name: Runtime authenticity gate
        run: python3 .terminus/validate_runtime_authenticity.py cobol-comp3-python-equiv
      - name: Install verifier dependency
        run: python3 -m pip install --quiet pytest==8.4.1
      - name: Oracle matrix
        run: |
          set -euo pipefail
          rm -rf /tmp/oracle-runtime
          cp -a cobol-comp3-python-equiv/environment/equiv /tmp/oracle-runtime
          cp -a cobol-comp3-python-equiv/solution/fixed/*.py /tmp/oracle-runtime/src/
          cp cobol-comp3-python-equiv/solution/fixed/schema.sql /tmp/oracle-runtime/sql/schema.sql
          EQUIV_ROOT=/tmp/oracle-runtime PYTHONPATH=/tmp/oracle-runtime python3 -m pytest cobol-comp3-python-equiv/tests/test_outputs.py -q -rA
      - name: Starter F2P/P2P matrix
        run: |
          set -euo pipefail
          rm -rf /tmp/starter-runtime
          cp -a cobol-comp3-python-equiv/environment/equiv /tmp/starter-runtime
          set +e
          EQUIV_ROOT=/tmp/starter-runtime PYTHONPATH=/tmp/starter-runtime python3 -m pytest cobol-comp3-python-equiv/tests/test_outputs.py -q -rA > /tmp/starter.txt 2>&1
          rc=$?
          set -e
          cat /tmp/starter.txt
          test "$rc" -ne 0
          failed=$(grep -c '^FAILED ' /tmp/starter.txt || true)
          passed=$(grep -c '^PASSED ' /tmp/starter.txt || true)
          echo "starter_failed=$failed starter_passed=$passed"
          test "$failed" -eq 30
          test "$passed" -eq 4
