name: Terminus Executor Bridge CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-executor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bubblewrap sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Install pinned test tools
        run: python3 -m pip install --quiet ruff==0.14.10 pytest==8.4.1 jsonschema==4.23.0
      - name: Compile executor bridge
        run: |
          python3 -m compileall -q .terminus/execution
          python3 -m py_compile .terminus/validate_executor_bridge.py
      - name: Lint executor bridge
        run: |
          ruff check \
            .terminus/execution \
            .terminus/tests/test_executor_bridge.py \
            .terminus/tests/test_executor_handoff_provenance.py \
            .terminus/tests/test_quality_executor.py \
            .terminus/tests/test_quality_lifecycle_record.py \
            .terminus/validate_executor_bridge.py
      - name: Run executor bridge tests
        run: |
          python3 -m pytest \
            .terminus/tests/test_executor_bridge.py \
            .terminus/tests/test_executor_handoff_provenance.py \
            .terminus/tests/test_quality_executor.py \
            .terminus/tests/test_quality_lifecycle_record.py \
            -q
      - name: Validate executor boundary
        run: python3 .terminus/validate_executor_bridge.py
      - name: Recheck invocation and recorder compatibility
        run: |
          python3 .terminus/validate_stage_invocation.py
          python3 .terminus/validate_execution_record.py
