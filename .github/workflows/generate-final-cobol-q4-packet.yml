name: Generate final COBOL Q4 packet
on:
  push:
    paths:
      - '.github/workflows/generate-final-cobol-q4-packet.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate immutable final Q4 packet and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TASK='cobol-comp3-python-equiv'
          EXPECTED='59dcf2146e1bac84cbc98d7d641e79b5a0138c4a'
          PREFIX="${EXPECTED:0:8}"
          WORKFLOW='.github/workflows/generate-final-cobol-q4-packet.yml'

          actual="$(git log -1 --format=%H -- "$TASK")"
          echo "Git-derived task commit: $actual"
          [[ "$actual" == "$EXPECTED" ]] || {
            echo "::error::STALE task commit: expected $EXPECTED got $actual"
            exit 1
          }
          [[ -z "$(git status --porcelain -- "$TASK")" ]] || {
            echo "::error::Task tree is dirty"
            exit 1
          }

          python3 .terminus/new_review_packet.py \
            "$TASK" spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change 'Fresh Q4 after Adjudicator-authorized closure of Q4-001 through Q4-007. Solver-visible instruction now defines the reason/type compatibility table and detailed-settlement invariants, plus preflight recovery/catalog health and archive retention/non-mutation obligations. Verifier coverage now uses grouped black-box caller/preflight/audit perturbations; independently inspects archive exports, lineage/integrity, registry, archive journal evidence, retention and live-artifact preservation; drives real reconciliation and detailed-settlement failures through the pipeline to independently prove non-publication; proves QUANTITY, TRANSFER_LOOP, ITEM_INACTIVE and WAREHOUSE_INACTIVE at operational reject DB/CSV persistence boundaries; and removes grading dependence on undocumented private policy labels, pipeline state strings, incidental CLI JSON field layouts and a fixed manifest serialization shape. Authoritative Edition 3 run 31940594234/job 95149083356 on final task commit 59dcf2146e1bac84cbc98d7d641e79b5a0138c4a passed Preflight, Ruff, Oracle reward 1 and NOP reward 0; artifact 9261919232 independently records Oracle 40/40 PASS and untouched starter 30/30 F2P FAIL plus 10/10 P2P PASS. Strict complexity remains task-specific PASS at 3907 substantive LOC, 29 defects, 7 root causes, 40 tests, 30 F2P, 10 P2P and 12 requirements. Q6 task.toml plus environment production scope is unchanged from the existing PASS/HIGH/SUFFICIENT result and remains scope-reusable.'

          mapfile -t packets < <(find ".terminus/reviews/$TASK/$PREFIX" -maxdepth 1 -type f -name "${TASK}-${PREFIX}-spec-test-contract-*.packet.json" -print)
          [[ ${#packets[@]} -eq 1 ]] || {
            printf '::error::Expected exactly one Q4 packet, found %s\n' "${#packets[@]}"
            printf '%s\n' "${packets[@]:-}"
            exit 1
          }
          PACKET="${packets[0]}"
          python3 - "$PACKET" "$EXPECTED" <<'PY'
          import json, pathlib, sys
          packet_path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          packet = json.loads(packet_path.read_text())
          assert packet['task'] == 'cobol-comp3-python-equiv'
          assert packet['task_commit'] == expected
          assert packet['state'] == 'FROZEN_CANDIDATE'
          assert packet['role'] == 'Spec-Test Contract Reviewer'
          output = pathlib.Path(packet['review_output_path'])
          assert not output.exists(), f'review output already exists: {output}'
          print('packet:', packet_path)
          print('review_id:', packet['review_id'])
          print('review_output:', output)
          PY

          rm -f "$WORKFLOW"
          git config user.name 'terminus-review-packet-bot'
          git config user.email 'terminus-review-packet-bot@users.noreply.github.com'
          git add ".terminus/reviews/$TASK/$PREFIX" "$WORKFLOW"
          git commit -m 'Add final post-adjudication COBOL Q4 review packet'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
