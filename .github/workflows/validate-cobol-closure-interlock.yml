name: Validate COBOL closure interlock

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - .github/workflows/validate-cobol-closure-interlock.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0

      - name: Verify exact frozen task and closure result
        shell: bash
        run: |
          set -euo pipefail
          TASK=bb2e042c45873da3f3d78836d915ddb6446debf2
          CLOSURE=.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "$TASK"
          test -f "$CLOSURE"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json')
          d=json.loads(p.read_text())
          assert d['task_commit']=='bb2e042c45873da3f3d78836d915ddb6446debf2'
          assert d['verdict']=='PASS'
          assert d['confidence']=='HIGH'
          assert d['evidence_status']=='SUFFICIENT'
          assert d['role_output']['CLOSURE_OUTCOME']=='PASS'
          assert len(d['role_output']['FINDING_DISPOSITIONS'])==5
          PY

      - name: Validate closure chain deterministically
        shell: bash
        run: |
          set -euo pipefail
          python .terminus/q4_closure.py \
            .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json

      - name: Prove Q6 scope reuse remains valid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/'.terminus'))
          from review_contract import review_scope_hash, role_contract_hash
          rel='.terminus/reviews/cobol-comp3-python-equiv/02a558ab/cobol-comp3-python-equiv-02a558ab-production-logic-80ad7c5258.json'
          d=json.loads(Path(rel).read_text())
          current_scope=review_scope_hash(root,'Production Logic Auditor','cobol-comp3-python-equiv')
          assert d['verdict']=='PASS'
          assert d['evidence_status']=='SUFFICIENT'
          assert d['confidence'] in {'HIGH','MEDIUM'}
          assert d['review_scope_hash']==current_scope=='e00d2d343c916fb9ea2b8d027400fee0bce59834558e1be1a984284fe1e77baf'
          assert d['role_contract_hash']==role_contract_hash(root,'Production Logic Auditor')=='8eb84a3715c4805f762325ceaa890339fc966a2a475cb58986578a15418c5378'
          print('Q6_SCOPE_REUSE=PASS')
          print('Q6_RESULT='+rel)
          print('Q6_SCOPE_HASH='+current_scope)
          PY

      - name: Prospective Quality Interlock validation
        shell: bash
        run: |
          set -euo pipefail
          cp .terminus/sessions/cobol-comp3-python-equiv.md /tmp/session-original.md
          python - <<'PY'
          from pathlib import Path
          p=Path('.terminus/sessions/cobol-comp3-python-equiv.md')
          s=p.read_text()
          s=s.replace('- Controller state: `BLOCKED`','- Controller state: `PRE_LLMAJ`',1)
          s=s.replace('| Q4 Adjudicated Closure | PENDING | generate a current `Q4 Closure Adjudicator` packet under Q4_CLOSURE_POLICY.md |','| Q4 Adjudicated Closure | PASS | `.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json` |',1)
          s=s.replace('| Q6 Production Logic Auditor | PASS / scope-reusable | existing Q6 production scope unchanged because `task.toml` and `environment/**` did not change |','| Q6 Production Logic Auditor | PASS | `.terminus/reviews/cobol-comp3-python-equiv/02a558ab/cobol-comp3-python-equiv-02a558ab-production-logic-80ad7c5258.json`; Protocol-2.2 scope reuse hash `e00d2d343c916fb9ea2b8d027400fee0bce59834558e1be1a984284fe1e77baf` |',1)
          s=s.replace('| Quality Interlock | BLOCKED | decisive post-circuit-breaker Q4 remains `REVISE` |','| Quality Interlock | PASS | Q4 satisfaction `ADJUDICATED_CLOSURE_PASS`; Q6 Protocol-valid unchanged-scope PASS |',1)
          p.write_text(s)
          PY
          set +e
          python .terminus/validate_quality_interlock.py --task cobol-comp3-python-equiv > /tmp/interlock.log 2>&1
          rc=$?
          set -e
          cat /tmp/interlock.log
          cp /tmp/session-original.md .terminus/sessions/cobol-comp3-python-equiv.md
          echo "PROSPECTIVE_INTERLOCK_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
