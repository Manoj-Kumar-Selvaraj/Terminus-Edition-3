name: Terminus Edge Router A2 Record

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-a2-record.yml'

permissions:
  contents: read
  statuses: write

env:
  TASK_ID: edge-router-runtime
  TASK_SNAPSHOT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad
  A1_INVOCATION_ID: inv_79d4551ca8b96875e1f37dc7cea565949e1ade639e32fa1b5de68d5a081bf0d8
  A2_INVOCATION_ID: inv_b9463c264c05f24c0876eb2968702df48cc551bb7bfe1c87b1a45cf9a73df239

jobs:
  record-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current controller state
        run: |
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --output /tmp/status-before.json
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/status-before.json'))
          assert state['ledger_event_count']==2, state
          assert state['next']['action']=='INVOKE_STAGE', state
          assert state['next']['stage_id']=='SYSTEM_ARCHITECTURE', state
          assert state['next']['primary_role_id']=='A2_SYSTEM_ARCHITECT', state
          PY

      - name: Rebuild exact A2 invocation
        run: |
          python3 - <<'PY'
          import json, os
          p=f".terminus/executions/{os.environ['TASK_ID']}/{os.environ['A1_INVOCATION_ID']}.result.json"
          rec=json.load(open(p,encoding='utf-8'))
          outputs=rec['outputs']
          selected=next(c for c in outputs['CANDIDATES'] if c['ID']==outputs['RECOMMENDATION'])
          rule=rec['invocation_snapshot']['inputs']['required']['CREATION_RULE_CONTEXT']
          operational={
            'REQUIRED_END_STATE': selected['REQUIRED_END_STATE'],
            'REQUIREMENT_FAMILIES': selected['REQUIREMENT_FAMILIES'],
            'PRESERVATION_OBLIGATIONS': selected['PRESERVATION_OBLIGATIONS'],
            'EDGE_FAILURE_SURFACE': selected['EDGE_FAILURE_SURFACE'],
          }
          json.dump({
            'APPROVED_OPERATIONAL_REQUIREMENTS': operational,
            'APPROVED_WORK_PACKAGE': selected,
            'CREATION_RULE_CONTEXT': rule,
          },open('/tmp/a2-inputs.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/a2-inputs.json \
            --output /tmp/a2-next.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/a2-next.json'))
          inv=p['invocation']
          assert inv['invocation_id']==os.environ['A2_INVOCATION_ID'], inv
          assert inv['stage']['stage_id']=='SYSTEM_ARCHITECTURE', inv
          assert inv['stage']['role_id']=='A2_SYSTEM_ARCHITECT', inv
          assert inv['readiness']=='READY', inv
          json.dump(inv,open('/tmp/a2-invocation.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          PY

      - name: Record A2 through canonical recorder
        run: |
          python3 .terminus/execution/controller_cli.py record \
            --invocation /tmp/a2-invocation.json \
            --result .terminus/tmp/edge-router-a2-result.json \
            --output /tmp/a2-record-output.json
          python3 - <<'PY'
          import json
          out=json.load(open('/tmp/a2-record-output.json'))
          rec=out['record']
          state=out['state']
          assert rec['status']=='ARCHITECTURE_READY', rec
          assert rec['disposition']=='ADVANCE', rec
          assert rec['stage_id']=='SYSTEM_ARCHITECTURE', rec
          assert state['ledger_event_count']==3, state
          assert state['next']['action']=='INVOKE_STAGE', state
          assert state['next']['stage_id']=='DEFECT_TOPOLOGY', state
          assert state['next']['primary_role_id']=='A3_DEFECT_TOPOLOGY_DESIGNER', state
          print(json.dumps({
            'record_id':rec['record_id'],
            'disposition':rec['disposition'],
            'ledger_event_id':out['ledger_event']['event_id'],
            'ledger_event_count':state['ledger_event_count'],
            'next':state['next'],
            'state_snapshot_id':state['state_snapshot_id'],
          },indent=2,sort_keys=True))
          PY

      - name: Export exact generated evidence
        run: |
          echo '===A2_RECORD_B64_BEGIN==='
          base64 -w0 ".terminus/executions/${TASK_ID}/${A2_INVOCATION_ID}.result.json"
          echo
          echo '===A2_RECORD_B64_END==='
          echo '===LEDGER_B64_BEGIN==='
          base64 -w0 ".terminus/executions/${TASK_ID}/ledger.jsonl"
          echo
          echo '===LEDGER_B64_END==='

      - name: Publish run breadcrumb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=terminus/a2-recorder \
            -f description="A2 canonical recorder complete" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
