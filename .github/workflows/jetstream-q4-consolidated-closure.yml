name: JetStream Q4 Consolidated Closure

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/jetstream-q4-consolidated-closure.yml

permissions:
  contents: write

jobs:
  close-q4-findings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Correct P2P boundary assertion after exact NOP evidence
        shell: bash
        run: |
          set -euo pipefail
          current_task_commit="$(git log -1 --format=%H -- jetstream-regional-stream-continuity)"
          if [[ "$current_task_commit" != "a220ee28917d79e2df3001b2d88b201157aa21cb" ]]; then
            echo "Task is $current_task_commit; deterministic P2P correction already applied or superseded."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          task = Path('jetstream-regional-stream-continuity')
          tests = task / 'tests/test_contract_coverage.py'
          text = tests.read_text(encoding='utf-8')
          old = '            assert message.headers.get("Nats-Msg-Id") == event_id\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one over-strong message-id assertion, found {text.count(old)}')
          text = text.replace(old, '', 1)
          tests.write_text(text, encoding='utf-8')

          combined = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((task / 'tests').glob('test_*.py'))
          )
          f2p = len(re.findall(r'^def test_f2p_', combined, flags=re.MULTILINE))
          p2p = len(re.findall(r'^def test_p2p_', combined, flags=re.MULTILINE))
          if (f2p, p2p) != (30, 10):
              raise SystemExit(f'test matrix changed: f2p={f2p} p2p={p2p}')

          repaired = tests.read_text(encoding='utf-8')
          for required in (
              'expected_west_stream',
              'get_message_by_sequence',
              'document = json.loads(message.data.decode("utf-8"))',
              'expected_replay_ids <= observed_replay_ids',
          ):
              if required not in repaired:
                  raise SystemExit(f'external JetStream replay proof lost {required}')
          if 'result.status == "COMMITTED"' in combined or 'result.status == "QUARANTINED"' in combined:
              raise SystemExit('phantom ProcessingResult status assertion reappeared')
          PY

          python3 -m compileall -q jetstream-regional-stream-continuity/tests
          git diff --check
          git config user.name "Terminus CI Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add jetstream-regional-stream-continuity/tests/test_contract_coverage.py
          git diff --cached --check
          git commit -m "Keep replay P2P at the external publication boundary"
          git push origin HEAD:task/jetstream-quality-interlock
