name: Terminus Controller Run Locator

on:
  workflow_run:
    workflows: ["Terminus Controller Stage"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: terminus-controller-run-locator-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  persist-controller-run-locator:
    name: Persist controller run locator
    if: startsWith(github.event.workflow_run.head_branch, 'terminus-controller-request/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Resolve exact request and controller job
        id: locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          git cat-file -e "$REQUEST_SHA^{commit}"

          mapfile -t request_paths < <(
            git diff-tree --no-commit-id --name-only -r "$REQUEST_SHA" -- \
              '.terminus/controller-requests/*.json'
          )
          [[ "${#request_paths[@]}" == 1 ]] || {
            echo "::error::Expected exactly one controller request at $REQUEST_SHA; found ${#request_paths[@]}"
            exit 1
          }
          request_path="${request_paths[0]}"
          request_file="$RUNNER_TEMP/controller-request.json"
          git show "$REQUEST_SHA:$request_path" > "$request_file"

          jobs_file="$RUNNER_TEMP/controller-jobs.json"
          if ! gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            > "$jobs_file"; then
            printf '%s\n' '{"jobs":[]}' > "$jobs_file"
          fi

          task="$(python3 - "$request_file" <<'PY'
          import json, re, sys
          request = json.load(open(sys.argv[1], encoding='utf-8'))
          task = request.get('task_id')
          if not isinstance(task, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', task):
              raise SystemExit('controller request has unsafe task_id')
          print(task)
          PY
          )"
          locator_path=".terminus/controller-run-locators/$task/$REQUEST_SHA.json"

          # A later workflow_run activity can finish before an earlier locator
          # invocation gets runner time. Preserve monotonic run state so an old
          # requested/in_progress event can never overwrite completed evidence.
          git fetch origin "$REQUEST_BRANCH"
          git reset --hard "origin/$REQUEST_BRANCH"
          mkdir -p "$(dirname "$locator_path")"

          python3 - \
            "$request_file" \
            "$jobs_file" \
            "$locator_path" \
            "$REQUEST_BRANCH" \
            "$REQUEST_SHA" \
            "$request_path" \
            "$RUN_ID" \
            "$RUN_NUMBER" \
            "$RUN_ATTEMPT" \
            "$RUN_STATUS" \
            "$RUN_CONCLUSION" \
            "$RUN_UPDATED_AT" <<'PY'
          import json
          import pathlib
          import sys

          (
              request_file,
              jobs_file,
              locator_file,
              request_branch,
              request_commit,
              request_path,
              run_id,
              run_number,
              run_attempt,
              run_status,
              run_conclusion,
              run_updated_at,
          ) = sys.argv[1:]

          request = json.load(open(request_file, encoding='utf-8'))
          jobs_payload = json.load(open(jobs_file, encoding='utf-8'))
          jobs = jobs_payload.get('jobs', []) if isinstance(jobs_payload, dict) else []
          expected_job_name = 'Execute deterministic controller stage'
          matching = [
              job for job in jobs
              if isinstance(job, dict) and job.get('name') == expected_job_name
          ]
          if len(matching) > 1:
              raise SystemExit('multiple deterministic controller jobs found for one run')
          job = matching[0] if matching else {}

          conclusion = run_conclusion or None
          incoming = {
              'schema_version': '1.0',
              'locator_kind': 'CONTROLLER_RUN',
              'task_id': request['task_id'],
              'stage_id': request['stage_id'],
              'task_commit': request['task_commit'],
              'control_plane_commit': request['control_plane_commit'],
              'expected_repository_head': request['expected_repository_head'],
              'request_branch': request_branch,
              'request_commit': request_commit,
              'request_path': request_path,
              'workflow_name': 'Terminus Controller Stage',
              'run_id': int(run_id),
              'run_number': int(run_number),
              'run_attempt': int(run_attempt),
              'status': run_status,
              'conclusion': conclusion,
              'job_name': expected_job_name,
              'job_id': job.get('id'),
              'job_status': job.get('status'),
              'job_conclusion': job.get('conclusion'),
              'updated_at': run_updated_at,
          }

          path = pathlib.Path(locator_file)
          existing = None
          if path.is_file():
              try:
                  loaded = json.loads(path.read_text(encoding='utf-8'))
                  if isinstance(loaded, dict):
                      existing = loaded
              except json.JSONDecodeError:
                  pass

          rank = {'queued': 0, 'requested': 0, 'waiting': 0, 'pending': 0, 'in_progress': 1, 'completed': 2}
          if existing and existing.get('run_id') == incoming['run_id']:
              old_attempt = int(existing.get('run_attempt') or 0)
              new_attempt = incoming['run_attempt']
              old_rank = rank.get(str(existing.get('status')), -1)
              new_rank = rank.get(str(incoming.get('status')), -1)
              if old_attempt > new_attempt or (old_attempt == new_attempt and old_rank > new_rank):
                  incoming = existing
              elif old_attempt == new_attempt and old_rank == new_rank:
                  # Preserve a known numeric job locator if an event snapshot
                  # happens to omit jobs temporarily.
                  if incoming.get('job_id') is None and existing.get('job_id') is not None:
                      incoming['job_id'] = existing['job_id']
                      incoming['job_status'] = existing.get('job_status')
                      incoming['job_conclusion'] = existing.get('job_conclusion')

          path.write_text(
              json.dumps(incoming, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "locator_path=$locator_path" >> "$GITHUB_OUTPUT"

      - name: Persist locator on the request branch
        shell: bash
        env:
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          LOCATOR_PATH: ${{ steps.locator.outputs.locator_path }}
        run: |
          set -euo pipefail
          git config user.name "terminus-controller-run-locator[bot]"
          git config user.email "terminus-controller-run-locator[bot]@users.noreply.github.com"
          git add -- "$LOCATOR_PATH"
          if git diff --cached --quiet; then
            echo "Controller run locator already contains equal/newer state."
            exit 0
          fi
          git commit -m "Track controller run $RUN_ID $RUN_STATUS"
          git push origin "HEAD:$REQUEST_BRANCH"

      - name: Summarize polling locator
        if: always()
        shell: bash
        env:
          LOCATOR_PATH: ${{ steps.locator.outputs.locator_path }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            echo "### Controller run locator"
            echo "- Request branch: \`$REQUEST_BRANCH\`"
            if [[ -n "$LOCATOR_PATH" && -f "$LOCATOR_PATH" ]]; then
              echo "- Locator: \`$LOCATOR_PATH\`"
              echo "- Run ID: \`$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id"])' "$LOCATOR_PATH")\`"
              echo "- Job ID: \`$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("job_id"))' "$LOCATOR_PATH")\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
