name: Freeze COBOL Q2 adjudication packet

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - .github/workflows/freeze-cobol-q2-adjudication-packet.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0

      - name: Verify frozen dispute inputs
        shell: bash
        run: |
          set -euo pipefail
          TASK=bb2e042c45873da3f3d78836d915ddb6446debf2
          Q2=.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q2-verifier-coverage-direct-20260816.md
          CLOSURE=.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json
          BOUNDARY=.terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "$TASK"
          test -f "$Q2"
          test -f "$CLOSURE"
          test -f "$BOUNDARY"
          grep -q 'Status: `REPAIR_PROPOSED`' "$Q2"
          python .terminus/q4_closure.py "$CLOSURE"

      - name: Generate immutable Adjudicator packet
        shell: bash
        run: |
          set -euo pipefail
          CHANGE='Post-Q4-closure producer-gate conflict at unchanged task commit bb2e042c45873da3f3d78836d915ddb6446debf2. Fresh direct Q1 was NO_GAP. Fresh direct Q2 Verifier Coverage Repairer is frozen at .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q2-verifier-coverage-direct-20260816.md and returned REPAIR_PROPOSED with twelve proposed scenario groups. The already-frozen Q4 Closure Adjudicator result .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q4-closure-adjudication-c00658ae75.json is PASS/HIGH/SUFFICIENT and, under Q4_CLOSURE_POLICY.md, classifies broad private-src coupling, exhaustive movement/item/warehouse coverage, additional safety/publication subclasses, stronger per-family preflight/audit demands, and corrupt/missing archive-input expansion as REJECTED_SCOPE_REOPEN or LATENT_AFTER_BOUNDARY; it forbids reopening another ordinary task patch loop on those scopes. Q2 nevertheless proposes coverage additions across several of those same families, plus possible distinct concerns including explicit business-date generation identity, cross-generation replay, stable reject-code DB+CSV surfaces, weighted valuation end-to-end durability, archive controls/deltas lineage, and other partial/none classifications. Protocol 2.2 requires Adjudicator when mandatory semantic evidence conflicts or a proposed fix trades one gate against another. Reconcile the frozen Q2 diagnostic against the frozen boundary Adjudicator .terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json, the final frozen Q4, the Q4 closure result/policy, current authoritative rules, and current verifier/task evidence. Decide which Q2 proposed scenario/requirement clusters are controlling current blockers versus rejected/latent/no-drip scope, whether any genuinely distinct Q2 blocker remains that authorizes a bounded verifier repair, and what exact controller disposition is valid for the Q2 producer gate. Do not modify task files, do not rerun Q4, and do not infer a desired PASS.'
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv adjudication --state BLOCKED --change "$CHANGE" | tee /tmp/generate.log
          PACKET=$(sed -n 's/^wrote //p' /tmp/generate.log)
          OUTPUT=$(sed -n 's/^review_output=//p' /tmp/generate.log)
          test -n "$PACKET"
          test -n "$OUTPUT"
          test -f "$PACKET"
          test ! -e "$OUTPUT"
          echo "PACKET=$PACKET" | tee -a "$GITHUB_ENV"
          echo "OUTPUT=$OUTPUT" | tee -a "$GITHUB_ENV"

      - name: Verify packet binding and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path(os.environ['PACKET'])
          d=json.loads(p.read_text())
          assert d['schema_version']=='3.0'
          assert d['role']=='Adjudicator'
          assert d['task']=='cobol-comp3-python-equiv'
          assert d['task_commit']=='bb2e042c45873da3f3d78836d915ddb6446debf2'
          assert d['state']=='BLOCKED'
          assert d['review_output_path']==os.environ['OUTPUT']
          assert not Path(os.environ['OUTPUT']).exists()
          assert '.terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-q2-verifier-coverage-direct-20260816.md' in d['change_since_last_review']
          assert 'q4-closure-adjudication-c00658ae75.json' in d['change_since_last_review']
          print('ADJUDICATION_PACKET_READY')
          print('REVIEW_ID='+d['review_id'])
          print('CONTROL_PLANE_COMMIT='+d['control_plane_commit'])
          print('ROLE_CONTRACT_HASH='+d['role_contract_hash'])
          print('PACKET='+str(p))
          print('OUTPUT='+d['review_output_path'])
          PY
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "bb2e042c45873da3f3d78836d915ddb6446debf2"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKET"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'review: freeze COBOL Q2 adjudication packet'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
