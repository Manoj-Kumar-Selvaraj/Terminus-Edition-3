name: JetStream Q4 Source Ownership Fixture Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Repair model-valid origin metadata test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import ast
          import textwrap
          from pathlib import Path

          def replace_function(path: Path, name: str, replacement: str) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              node = next(
                  item for item in tree.body
                  if isinstance(item, ast.FunctionDef) and item.name == name
              )
              replacement = textwrap.dedent(replacement).lstrip()
              if not replacement.endswith('\n'):
                  replacement += '\n'
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1:node.end_lineno] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding='utf-8')

          test_path = Path('jetstream-regional-stream-continuity/tests/test_continuity.py')
          replace_function(
              test_path,
              'test_f2p_archive_metadata_preserves_origin_identity',
              r'''
              def test_f2p_archive_metadata_preserves_origin_identity(
                  engine: ContinuityEngine,
              ) -> None:
                  """A matching event id with corrupted source ownership is reported as divergent."""
                  complete_archive(engine, "east")
                  event = sample_event(engine, sequence=120)
                  engine.store.execute(
                      "UPDATE archive_index SET source_domain='edge-west' WHERE event_id=?",
                      (event.identity.event_id,),
                  )
                  summary = engine.reconcile_region("east", 1)
                  assert summary.metadata_mismatch_count == 1
                  assert summary.highest_contiguous_archive_origin_sequence == 6000
                  assert summary.converged is False
                  assert any(
                      finding.event_id == event.identity.event_id
                      for finding in summary.blocking_findings
                  )
              ''',
          )

          solution_path = Path('jetstream-regional-stream-continuity/solution/files/engine.py')
          text = solution_path.read_text(encoding='utf-8')
          old = '''        findings: list[Finding] = []\n        metadata_mismatch_count = 0\n\n        for event_id in missing_ids:\n'''
          new = '''        findings: list[Finding] = []\n        metadata_mismatch_count = 0\n        region_row = self.store.region(region)\n        expected_source_stream = str(region_row["physical_stream"])\n        expected_source_domain = str(region_row["jetstream_domain"])\n\n        for event_id in missing_ids:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('missing solution reconciliation ownership anchor')
              text = text.replace(old, new, 1)
          old2 = '''            if event.payload_sha256.lower() != record.payload_sha256.lower():\n                mismatches.append("payload_sha256")\n            if mismatches:\n'''
          new2 = '''            if event.payload_sha256.lower() != record.payload_sha256.lower():\n                mismatches.append("payload_sha256")\n            if record.source_stream != expected_source_stream:\n                mismatches.append("source_stream")\n            if record.source_domain != expected_source_domain:\n                mismatches.append("source_domain")\n            if mismatches:\n'''
          if new2 not in text:
              if old2 not in text:
                  raise SystemExit('missing solution shared-event metadata anchor')
              text = text.replace(old2, new2, 1)
          ast.parse(text)
          solution_path.write_text(text, encoding='utf-8')
          PY

          python3 -m pip install --quiet ruff==0.12.8
          ruff check jetstream-regional-stream-continuity/tests
          python3 -m py_compile \
            jetstream-regional-stream-continuity/tests/test_continuity.py \
            jetstream-regional-stream-continuity/solution/files/engine.py
          python3 .terminus/validate_task_complexity.py jetstream-regional-stream-continuity

          if git diff --quiet; then
            echo 'Source-ownership repair already present'
            exit 0
          fi
          git config user.name 'Terminus CI Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            jetstream-regional-stream-continuity/tests/test_continuity.py \
            jetstream-regional-stream-continuity/solution/files/engine.py
          git commit -m 'Use source ownership for JetStream reconciliation metadata coverage'
          git push origin HEAD:task/jetstream-quality-interlock
