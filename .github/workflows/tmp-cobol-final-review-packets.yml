name: Temporary COBOL final review packets

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-completion
    paths:
      - .github/workflows/tmp-cobol-final-review-packets.yml

permissions:
  contents: read

jobs:
  packets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Q4 packet
        run: |
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change "Controlled post-adjudication Q4 remediation removed stale offline handoff obligations, private malformed-record recovery assumptions, incident-note preservation grading, and circular ODO/REDEFINES summary guarantees; added exact input naming and non-vacuous --layout override coverage." \
            --print
      - name: Generate Q6 packet
        run: |
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv production-logic \
            --state FROZEN_CANDIDATE \
            --change "Post-adjudication Q4 remediation changed task metadata and solver-visible handoff/report-contract prose while preserving the core COMP-3, REDEFINES, ODO, cursor, report and CLI implementation architecture." \
            --print
