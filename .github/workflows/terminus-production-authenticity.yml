name: Terminus Production Authenticity Gate

on:
  workflow_dispatch:
    inputs:
      task:
        description: Optional top-level task to validate after regression tests
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  production-authenticity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test tools
        run: python3 -m pip install --quiet pytest==8.4.1
      - name: Production-authenticity policy
        run: python3 .terminus/validate_production_policy.py
      - name: Production-authenticity regression suite
        run: >-
          python3 -m pytest
          .terminus/tests/test_runtime_authenticity.py
          .terminus/tests/test_business_module_diversity.py
          -q
      - name: Validate requested task only
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          [[ -n "$TASK" ]] || { echo 'No task requested; regression suite only.'; exit 0; }
          [[ "$TASK" != /* && "$TASK" != *".."* && "$TASK" != */* ]] || {
            echo '::error::task must be one safe top-level directory'; exit 1;
          }
          [[ -f "$TASK/task.toml" ]] || { echo "::error::No task.toml for $TASK"; exit 1; }
          manifest=".terminus/designs/$TASK-production.json"
          if [[ ! -f "$manifest" ]]; then
            echo "Task $TASK has no production-authenticity manifest; no production gate applies."
            exit 0
          fi
          python3 .terminus/validate_runtime_authenticity.py "$TASK"
          python3 .terminus/validate_business_module_diversity.py "$TASK"
