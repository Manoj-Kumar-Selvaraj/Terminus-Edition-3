name: Terminus Production Authenticity Gate

on:
  pull_request:
    paths:
      - "**/instruction.md"
      - "**/README.md"
      - "**/environment/**"
      - ".terminus/designs/**"
      - ".terminus/validate_runtime_authenticity.py"
      - ".terminus/tests/test_runtime_authenticity.py"
      - ".terminus/agents/PRODUCTION_AUTHENTICITY.md"
      - ".terminus/agents/CREATION_CONTROLLER.md"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_AGENT_REGISTRY.md"
      - ".github/workflows/terminus-production-authenticity.yml"
  push:
    branches: [main]
    paths:
      - "**/instruction.md"
      - "**/README.md"
      - "**/environment/**"
      - ".terminus/designs/**"
      - ".terminus/validate_runtime_authenticity.py"
      - ".terminus/tests/test_runtime_authenticity.py"
      - ".terminus/agents/PRODUCTION_AUTHENTICITY.md"
      - ".terminus/agents/CREATION_CONTROLLER.md"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_AGENT_REGISTRY.md"
      - ".github/workflows/terminus-production-authenticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-authenticity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test tools
        run: python3 -m pip install --quiet pytest==8.4.1
      - name: Production-authenticity policy
        run: python3 .terminus/validate_production_policy.py
      - name: Runtime-authenticity regression suite
        run: python3 -m pytest .terminus/tests/test_runtime_authenticity.py -q
      - name: Validate declared production profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .terminus/validate_runtime_authenticity.py
          found=0
          shopt -s nullglob
          for manifest in .terminus/designs/*-production.json; do
            task="$(basename "$manifest" -production.json)"
            [[ -f "$task/task.toml" ]] || continue
            found=1
            echo "==> production authenticity: $task"
            python3 .terminus/validate_runtime_authenticity.py "$task"
          done
          if (( found == 0 )); then
            echo "No production-authenticity manifests found."
          fi
