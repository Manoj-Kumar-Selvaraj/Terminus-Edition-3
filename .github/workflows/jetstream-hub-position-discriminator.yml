name: JetStream Hub Position Discriminator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Make inherited hub-position defect observable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py')
          text = path.read_text(encoding='utf-8')
          old = '            highest_contiguous_archive_origin_sequence=archive_origin_floor,\n'
          new = (
              '            highest_contiguous_archive_origin_sequence=contiguous_floor(\n'
              '                record.hub_stream_sequence for record in archive\n'
              '            ),\n'
          )
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected starter reconciliation anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py
          python3 .terminus/validate_complexity.py jetstream-regional-stream-continuity
      - name: Commit exact task repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terminus CI Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py
          if git diff --cached --quiet; then
            echo 'No task change required.'
            exit 0
          fi
          git commit -m 'Make JetStream hub-position defect behaviorally observable'
          git push origin HEAD:task/jetstream-quality-interlock
