name: Terminus Generate Review Packets Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminus-generate-review-packets-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate packet-bound review contexts
        shell: bash
        run: |
          set -euo pipefail
          change='Control-plane protocol migrated to packet/result v3 after PR #4; solver-visible task content is unchanged.'
          python3 .terminus/new_review_packet.py payment-eod-control-chain task-architect --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain verifier-engineer --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain originality --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain difficulty-design --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain compliance --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain instruction --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain documentation --change "$change"
          python3 .terminus/new_review_packet.py payment-eod-control-chain comprehensive-checklist --change "$change"
      - name: Commit immutable packets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'terminus-control-plane'
          git config user.email 'actions@users.noreply.github.com'
          git add .terminus/reviews/payment-eod-control-chain/ff7394ff/*.packet.json
          git diff --cached --check
          git commit -m 'Generate fresh v3 payment EOD review packets'
          git push origin HEAD:main
