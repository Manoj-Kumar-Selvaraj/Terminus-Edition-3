name: Terminus control-plane version guard fix

on:
  push:
    branches:
      - task/jetstream-quality-interlock
    paths:
      - .github/workflows/terminus-control-plane-version-guard-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Invoke control-plane version guard fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Update policy version guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.terminus/validate_agent_system.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"Agent-system policy version", "2.3"': '"Agent-system policy version", "2.4"',
              '"Policy version", "2.1"': '"Policy version", "2.2"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/terminus-control-plane-version-guard-fix.yml

      - name: Validate upgraded control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            .terminus/validate_agent_system.py \
            .terminus/review_contract.py \
            .terminus/new_review_packet.py \
            .terminus/validate_review_freshness.py \
            .terminus/validate_quality_interlock.py \
            .terminus/classify_review_delta.py
          python -m pip install --quiet ruff==0.14.10 pytest==8.4.1
          ruff check .terminus
          python -m pytest .terminus/tests -q
          python .terminus/validate_agent_system.py
          python .terminus/validate_review_freshness.py --task jetstream-regional-stream-continuity
          python .terminus/validate_quality_interlock.py --task jetstream-regional-stream-continuity
          python .terminus/new_review_packet.py jetstream-regional-stream-continuity production-logic --state BLOCKED --change self-check --print | grep -q 'review_scope_hash'
          if python .terminus/new_review_packet.py jetstream-regional-stream-continuity spec-test-contract --state BLOCKED --change self-check --print | grep -q 'review_scope_hash'; then
            echo 'Q4 unexpectedly received a scope hash' >&2
            exit 1
          fi

      - name: Commit guard fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add .terminus/validate_agent_system.py .github/workflows/terminus-control-plane-version-guard-fix.yml
          git diff --cached --check
          git commit -m "Align control-plane version guards with Protocol 2.2"
          git push origin HEAD:task/jetstream-quality-interlock
