name: EC2 Q6 Remediation Validation

on:
  push:
    branches: [remediation/ec2-q4-q6-20260820]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Track EC2 remediation run') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Persist run locator
        shell: bash
        run: |
          set -euo pipefail
          path=".terminus/diagnostic-run-locators/ec2-q6-remediation-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"event_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$path"
          git config user.name 'terminus-remediation-validator[bot]'
          git config user.email 'terminus-remediation-validator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 remediation run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Apply compatibility-preserving starter seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed = []

          manager = Path('ec2-artifact-policy-enforcement/environment/enforcer/internal/platform/manager_profiles.go')
          text = manager.read_text()
          old = '''\tcase "maven-coordinate":
          \t\treturn mavenNameRE.MatchString(name)
          \tcase "npm-package":'''
          new = '''\tcase "maven-coordinate":
          \t\tif strings.Contains(name, ":") {
          \t\t\treturn mavenNameRE.MatchString(name)
          \t\t}
          \t\treturn rpmNameRE.MatchString(name)
          \tcase "npm-package":'''
          if old in text:
              text = text.replace(old, new, 1)
              changed.append(manager)
          old = '''\tcase "go-module":
          \t\treturn goModuleRE.MatchString(name) && strings.Contains(name, "/")'''
          new = '''\tcase "go-module":
          \t\treturn goModuleRE.MatchString(name)'''
          if old in text:
              text = text.replace(old, new, 1)
              if manager not in changed:
                  changed.append(manager)
          manager.write_text(text)

          evidence = Path('ec2-artifact-policy-enforcement/environment/enforcer/internal/platform/evidence_runtime.go')
          text = evidence.read_text()
          old = '''func legacyScannerRecord(context *EvaluationContext, assessment ScannerAssessment) ScannerAssessment {
          \tif assessment.Healthy {
          \t\treturn assessment
          \t}
          \t// Intentional starter defect: unavailable scanner evidence is transformed
          \t// into a current clean record instead of failing closed.  The solution
          \t// removes this conversion.
          \tassessment.Healthy = true
          \tassessment.RevisionMatches = true
          \tassessment.Status = "ok"
          \tassessment.DBRevision = context.Compiled.ScannerRevision
          \tassessment.Vulnerabilities = nil
          \tassessment.MaximumSeverity = "NONE"
          \tassessment.Reason = "legacy-fail-open-clean"
          \treturn assessment
          }'''
          new = '''func legacyScannerRecord(context *EvaluationContext, assessment ScannerAssessment) ScannerAssessment {
          \tif !assessment.Healthy {
          \t\t// Intentional starter defect: unavailable scanner evidence is transformed
          \t\t// into a current clean record instead of failing closed.  The solution
          \t\t// removes this conversion.
          \t\tassessment.Healthy = true
          \t\tassessment.RevisionMatches = true
          \t\tassessment.Status = "ok"
          \t\tassessment.DBRevision = context.Compiled.ScannerRevision
          \t\tassessment.Vulnerabilities = nil
          \t\tassessment.MaximumSeverity = "NONE"
          \t\tassessment.Reason = "legacy-fail-open-clean"
          \t\treturn assessment
          \t}
          \tif !assessment.RevisionMatches {
          \t\t// Intentional starter defect: a healthy record from a stale scanner DB
          \t\t// is accepted as if it were current.
          \t\tassessment.RevisionMatches = true
          \t\tassessment.Reason = "legacy-stale-revision-accepted"
          \t}
          \treturn assessment
          }'''
          if old in text:
              evidence.write_text(text.replace(old, new, 1))
              changed.append(evidence)

          if changed:
              print('patched:', *changed)
          else:
              print('compatibility seams already applied')
          PY
          gofmt -w ec2-artifact-policy-enforcement/environment/enforcer/internal/platform/manager_profiles.go ec2-artifact-policy-enforcement/environment/enforcer/internal/platform/evidence_runtime.go
          if ! git diff --quiet -- ec2-artifact-policy-enforcement/environment/enforcer/internal/platform; then
            git config user.name 'terminus-remediation[bot]'
            git config user.email 'terminus-remediation[bot]@users.noreply.github.com'
            git add -- ec2-artifact-policy-enforcement/environment/enforcer/internal/platform
            git commit -m 'Preserve EC2 starter compatibility and stale evidence defect'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Add missing Q4 behavioral contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          tests = Path('ec2-artifact-policy-enforcement/tests/test_outputs.py')
          text = tests.read_text()
          marker = 'def test_f2p_exact_exception_cannot_override_untrusted_source():'
          if marker not in text:
              text += '''\n\n
def test_f2p_exact_exception_cannot_override_untrusted_source():
    """An exact vulnerability exception cannot waive the trusted-source prerequisite."""
    with case_dir() as root:
        policy = base_policy()
        digest = find_digest(vulnerable=True)
        req = make_request("req-ex-source-order", "package", "apt", digest, "attacker.invalid/repo")
        ex = exception_for(req)
        cp, out, _ = run_evaluate(root, req, policy=policy, exceptions={"exceptions": [ex]})
        assert cp.returncode == 42 and out["code"] == "DENY_UNTRUSTED_SOURCE"


def test_p2p_permit_request_id_mismatch_remains_invalid():
    """Changing request_id must continue to invalidate an otherwise intact permit."""
    with case_dir() as root:
        permit, req, policy = issue_clean_permit(root / "issue")
        changed = copy.deepcopy(req)
        changed["request_id"] = req["request_id"] + "-different"
        cp, out = run_verify(permit, changed, policy, b"verifier-secret-a", work=root / "verify")
        assert cp.returncode == 43 and out["valid"] is False


def test_p2p_permit_policy_version_mismatch_remains_invalid():
    """Changing policy version must continue to invalidate an otherwise intact permit."""
    with case_dir() as root:
        permit, req, policy = issue_clean_permit(root / "issue")
        changed_policy = copy.deepcopy(policy)
        changed_policy["version"] = policy["version"] + "-different"
        cp, out = run_verify(permit, req, changed_policy, b"verifier-secret-a", work=root / "verify")
        assert cp.returncode == 43 and out["valid"] is False


def test_p2p_wrong_exception_policy_code_remains_non_authorizing():
    """An exception for another policy code must not waive vulnerability threshold denial."""
    with case_dir() as root:
        policy = base_policy()
        digest = find_digest(vulnerable=True)
        req = make_request("req-ex-code", "package", "apt", digest, trusted_source("package", policy))
        ex = exception_for(req, codes=["SOURCE_POLICY"])
        cp, out, _ = run_evaluate(root, req, policy=policy, exceptions={"exceptions": [ex]})
        assert cp.returncode == 42 and out["code"] == "DENY_VULNERABLE"
'''
              tests.write_text(text)

          path = Path('.terminus/designs/ec2-artifact-policy-enforcement-test-map.json')
          data = json.loads(path.read_text())
          additions = [
              ["test_f2p_exact_exception_cannot_override_untrusted_source", "F2P", "REQ_SOURCE_DIGEST", "F2P-SRC-05"],
              ["test_p2p_permit_request_id_mismatch_remains_invalid", "P2P", "REQ_PRESERVATION", "P2P-10"],
              ["test_p2p_permit_policy_version_mismatch_remains_invalid", "P2P", "REQ_PRESERVATION", "P2P-11"],
              ["test_p2p_wrong_exception_policy_code_remains_non_authorizing", "P2P", "REQ_PRESERVATION", "P2P-12"],
          ]
          existing = {row[0] for row in data['tests']}
          for row in additions:
              if row[0] not in existing:
                  data['tests'].append(row)
          cross = data.setdefault('behavioral_dimensions', {}).setdefault('cross_component', [])
          if 'F2P-SRC-05' not in cross:
              cross.append('F2P-SRC-05')
          normal = data['behavioral_dimensions'].setdefault('normal', [])
          for case in ('P2P-10', 'P2P-11', 'P2P-12'):
              if case not in normal:
                  normal.append(case)
          organic = data.get('organic_count_justification', '')
          data['organic_count_justification'] = organic.replace('The 27 F2P cases', 'The 28 F2P cases')
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          if ! git diff --quiet -- ec2-artifact-policy-enforcement/tests/test_outputs.py .terminus/designs/ec2-artifact-policy-enforcement-test-map.json; then
            git config user.name 'terminus-verifier-remediation[bot]'
            git config user.email 'terminus-verifier-remediation[bot]@users.noreply.github.com'
            git add -- ec2-artifact-policy-enforcement/tests/test_outputs.py .terminus/designs/ec2-artifact-policy-enforcement-test-map.json
            git commit -m 'Cover EC2 Q4 contract gaps'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Format and build production runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          gofmt -w "$ROOT/cmd" "$ROOT/internal"
          if ! git diff --quiet -- "$ROOT/cmd" "$ROOT/internal"; then
            git config user.name 'terminus-remediation-validator[bot]'
            git config user.email 'terminus-remediation-validator[bot]@users.noreply.github.com'
            git add -- "$ROOT/cmd" "$ROOT/internal"
            git commit -m "Format EC2 remediation runtime"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          cd "$ROOT"
          test -z "$(gofmt -l ./cmd ./internal)"
          go test ./...
          go build -o /tmp/artifactguard ./cmd/artifactguard
      - name: Validate untouched starter F2P/P2P matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(realpath ec2-artifact-policy-enforcement/environment/enforcer)"
          TESTS="$(realpath ec2-artifact-policy-enforcement/tests)"
          export ENFORCER_ROOT="$ROOT"
          export AG_BIN=/tmp/artifactguard
          cd "$TESTS"
          python3 -m pytest -q test_outputs.py -k 'p2p' --junitxml=/tmp/p2p.xml
          set +e
          python3 -m pytest -q test_outputs.py -k 'f2p' --junitxml=/tmp/f2p.xml
          f2p_rc=$?
          set -e
          [[ "$f2p_rc" != 0 ]]
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def counts(path):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              return tuple(sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests','failures','errors','skipped'))
          p2p = counts('/tmp/p2p.xml')
          f2p = counts('/tmp/f2p.xml')
          print('P2P_MATRIX', p2p)
          print('F2P_MATRIX', f2p)
          if p2p != (12, 0, 0, 0):
              raise SystemExit(f'expected 12 clean P2P passes, got {p2p}')
          if f2p != (28, 28, 0, 0):
              raise SystemExit(f'expected all 28 F2P probes to fail on starter, got {f2p}')
          PY
      - name: Measure reachable authored Go
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          echo '--- authored Go LOC ---'
          find "$ROOT/cmd" "$ROOT/internal" -type f -name '*.go' -print0 | sort -z | xargs -0 wc -l
          echo '--- catalog residue ---'
          if find "$ROOT/internal" -type f -name 'catalog*.go' | grep -q .; then
            find "$ROOT/internal" -type f -name 'catalog*.go'
            exit 12
          fi
      - name: Run Terminus structural gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/validate_environment_complexity.py ec2-artifact-policy-enforcement
          python3 .terminus/validate_task_complexity.py ec2-artifact-policy-enforcement
