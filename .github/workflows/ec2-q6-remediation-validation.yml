name: EC2 Q6 Remediation Validation

on:
  push:
    branches: [remediation/ec2-q4-q6-20260820]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Track EC2 remediation run') && !contains(github.event.head_commit.message, 'Materialize EC2 Q4 Q6 remediation') && !contains(github.event.head_commit.message, 'Materialize EC2 Oracle remediation') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist run locator
        shell: bash
        run: |
          set -euo pipefail
          path=".terminus/diagnostic-run-locators/ec2-q6-remediation-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"event_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$path"
          git config user.name 'terminus-remediation-validator[bot]'
          git config user.email 'terminus-remediation-validator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 remediation run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Materialize deterministic remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ec2_q4_q6_remediate.py
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          gofmt -w "$ROOT/cmd" "$ROOT/internal"
          if ! git diff --quiet -- "$ROOT" ec2-artifact-policy-enforcement/tests .terminus/designs/ec2-artifact-policy-enforcement-test-map.json; then
            git config user.name 'terminus-remediation[bot]'
            git config user.email 'terminus-remediation[bot]@users.noreply.github.com'
            git add -- "$ROOT" ec2-artifact-policy-enforcement/tests .terminus/designs/ec2-artifact-policy-enforcement-test-map.json
            git commit -m 'Materialize EC2 Q4 Q6 remediation'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Build production runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          cd "$ROOT"
          test -z "$(gofmt -l ./cmd ./internal)"
          go test ./...
          go build -o /tmp/artifactguard ./cmd/artifactguard
      - name: Validate untouched starter matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'pytest==8.4.1'
          ROOT="$(realpath ec2-artifact-policy-enforcement/environment/enforcer)"
          TESTS="$(realpath ec2-artifact-policy-enforcement/tests)"
          export ENFORCER_ROOT="$ROOT"
          export AG_BIN=/tmp/artifactguard
          cd "$TESTS"
          python3 -m pytest -q test_outputs.py test_q4_contract_gaps.py -k 'p2p' --junitxml=/tmp/p2p.xml
          set +e
          python3 -m pytest -q test_outputs.py test_q4_contract_gaps.py -k 'f2p' --junitxml=/tmp/f2p.xml
          f2p_rc=$?
          set -e
          [[ "$f2p_rc" != 0 ]]
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def counts(path):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              return tuple(sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests','failures','errors','skipped'))
          p2p = counts('/tmp/p2p.xml')
          f2p = counts('/tmp/f2p.xml')
          print('P2P_MATRIX', p2p)
          print('F2P_MATRIX', f2p)
          if p2p != (12, 0, 0, 0):
              raise SystemExit(f'expected 12 clean P2P passes, got {p2p}')
          if f2p != (28, 28, 0, 0):
              raise SystemExit(f'expected all 28 F2P probes to fail on starter, got {f2p}')
          PY
      - name: Materialize Oracle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ec2_oracle_remediate.py
          chmod +x ec2-artifact-policy-enforcement/solution/solve.sh
          if ! git diff --quiet -- ec2-artifact-policy-enforcement/solution; then
            git config user.name 'terminus-remediation[bot]'
            git config user.email 'terminus-remediation[bot]@users.noreply.github.com'
            git add -- ec2-artifact-policy-enforcement/solution
            git commit -m 'Materialize EC2 Oracle remediation'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Validate Oracle twice and full matrix
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(realpath ec2-artifact-policy-enforcement/environment/enforcer)"
          SOLUTION_ROOT="$(realpath ec2-artifact-policy-enforcement/solution)"
          TESTS="$(realpath ec2-artifact-policy-enforcement/tests)"
          rm -rf /tmp/ec2-oracle
          cp -a "$SRC" /tmp/ec2-oracle
          ENFORCER_ROOT=/tmp/ec2-oracle SOLUTION_ROOT="$SOLUTION_ROOT" ARTIFACTGUARD_BIN=/tmp/artifactguard-oracle bash "$SOLUTION_ROOT/solve.sh"
          ENFORCER_ROOT=/tmp/ec2-oracle SOLUTION_ROOT="$SOLUTION_ROOT" ARTIFACTGUARD_BIN=/tmp/artifactguard-oracle bash "$SOLUTION_ROOT/solve.sh"
          export ENFORCER_ROOT=/tmp/ec2-oracle
          export AG_BIN=/tmp/artifactguard-oracle
          cd "$TESTS"
          python3 -m pytest -q test_outputs.py test_q4_contract_gaps.py --junitxml=/tmp/oracle.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/oracle.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          counts = tuple(sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests','failures','errors','skipped'))
          print('ORACLE_MATRIX', counts)
          if counts != (40, 0, 0, 0):
              raise SystemExit(f'expected 40 clean Oracle passes, got {counts}')
          PY
      - name: Measure production logic
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          find "$ROOT/cmd" "$ROOT/internal" -type f -name '*.go' -print0 | sort -z | xargs -0 wc -l
          if find "$ROOT/internal" -type f -name 'catalog*.go' | grep -q .; then
            echo 'catalog padding remains'
            exit 12
          fi
      - name: Run Terminus structural gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/validate_environment_complexity.py ec2-artifact-policy-enforcement
          python3 .terminus/validate_task_complexity.py ec2-artifact-policy-enforcement
