name: EC2 Q6 Remediation Validation

on:
  push:
    branches: [remediation/ec2-q4-q6-20260820]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Track EC2 remediation run') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Persist run locator
        shell: bash
        run: |
          set -euo pipefail
          path=".terminus/diagnostic-run-locators/ec2-q6-remediation-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"event_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$path"
          git config user.name 'terminus-remediation-validator[bot]'
          git config user.email 'terminus-remediation-validator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 remediation run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Build production runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          cd "$ROOT"
          echo '--- gofmt diff ---'
          test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 11; }
          go test ./...
          go build -o /tmp/artifactguard ./cmd/artifactguard
      - name: Measure reachable authored Go
        shell: bash
        run: |
          set -euo pipefail
          ROOT=ec2-artifact-policy-enforcement/environment/enforcer
          echo '--- authored Go LOC ---'
          find "$ROOT/cmd" "$ROOT/internal" -type f -name '*.go' -print0 | sort -z | xargs -0 wc -l
          echo '--- catalog residue ---'
          if find "$ROOT/internal" -type f -name 'catalog*.go' | grep -q .; then
            find "$ROOT/internal" -type f -name 'catalog*.go'
            exit 12
          fi
      - name: Run Terminus structural gates
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/validate_environment_complexity.py ec2-artifact-policy-enforcement
          python3 .terminus/validate_task_complexity.py ec2-artifact-policy-enforcement
