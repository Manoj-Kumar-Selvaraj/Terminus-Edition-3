name: Temporary COBOL Q4 P2P correction

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/tmp-cobol-q4-p2p-correction.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0
      - name: Correct P2P ownership and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cobol-comp3-python-equiv/tests/test_outputs.py')
          text = path.read_text(encoding='utf-8')

          old = '''    preflight = cli(\n        "preflight",\n        *run_arguments(db_path, source, layout_path, controls, report_dir, publish_dir),\n        "--schema",\n        SCHEMA,\n        "--seed",\n        SEED,\n    )\n    assert preflight.returncode == 0\n    assert parse_stdout(preflight)["passed"] is True\n\n    run = cli(\n'''
          new = '''    preflight = cli(\n        "preflight",\n        *run_arguments(db_path, source, layout_path, controls, report_dir, publish_dir),\n        "--schema",\n        SCHEMA,\n        "--seed",\n        SEED,\n    )\n    assert preflight.returncode == 0\n    preflight_payload = parse_stdout(preflight)\n    assert preflight_payload["passed"] is True\n    assert preflight_payload["historical_baseline"]["records"] == 15000\n    assert preflight_payload["historical_scale_issues"] == []\n\n    missing_layout = cli("describe-layout", "--layout", tmp_path / "missing-layout.json")\n    assert missing_layout.returncode == 2\n    assert missing_layout.stdout == ""\n    assert isinstance(parse_stderr(missing_layout).get("error"), dict)\n\n    run = cli(\n'''
          if old not in text:
              raise SystemExit('caller-layout block not found')
          text = text.replace(old, new, 1)

          old = '''    failed = cli("describe-layout", "--layout", tmp_path / "missing-layout.json")\n    assert failed.returncode == 2\n    assert failed.stdout == ""\n    error_payload = parse_stderr(failed)\n    assert isinstance(error_payload.get("error"), dict)\n\n\ndef test_p2p_preflight_uses_historical_baseline'''
          new = '''\n\ndef test_p2p_preflight_uses_historical_baseline'''
          if old not in text:
              raise SystemExit('P2P CLI failure block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''    assert first.returncode == 0\n    first_payload = parse_stdout(first)\n    assert first_payload["passed"] is True\n    assert first_payload["historical_baseline"]["records"] == 15000\n    assert first_payload["historical_scale_issues"] == []\n''',
              '''    first_payload = parse_stdout(first)\n    assert first_payload["historical_baseline"]["records"] == 15000\n    assert first_payload["historical_scale_issues"] == []\n''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/tmp-cobol-q4-p2p-correction.yml
          git config user.name 'Terminus remediation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cobol-comp3-python-equiv/tests/test_outputs.py
          git commit -m 'Correct Q4 P2P verifier ownership'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
