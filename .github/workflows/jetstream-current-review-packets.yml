name: JetStream Current Review Packets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/jetstream-current-review-packets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact invocation branch
        uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Generate immutable Q4 and Q6 packets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain -- jetstream-regional-stream-continuity)" = ""
          task_commit="$(git log -1 --format=%H -- jetstream-regional-stream-continuity)"
          test "$task_commit" = "d7e131f962753acce119afba5f63bd525203d9c7"
          grep -q '^- Controller state: `FROZEN_CANDIDATE`' .terminus/sessions/jetstream-regional-stream-continuity.md

          review_root=.terminus/reviews/jetstream-regional-stream-continuity/d7e131f9
          test ! -e "$review_root" || test -z "$(find "$review_root" -maxdepth 1 -name '*.packet.json' -print -quit)"

          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change "Consolidated Q4 closure on the frozen d7e131f9 task tree: the existing real-NATS execute-replay P2P now independently reads the expected physical west JetStream stream and proves expected stable replay payload identities are present; all three named captured incident artifacts use full SHA-256 preservation; the delegated continuity contract now documents the stable graded health/reconciliation report interface; redundant in-process ProcessingResult.status token assertions were removed while durable behavior checks remain. The suite remains exactly 40 tests = 30 F2P + 10 P2P. Fresh deterministic evidence is Oracle 40/40 and NOP exactly 30 F2P fail + 10 P2P pass."

          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            production-logic \
            --state FROZEN_CANDIDATE \
            --change "Task refrozen at d7e131f9 after a consolidated spec/verifier closure. Solver-visible production runtime behavior was not bypassed or replaced; changes are limited to the delegated report-interface documentation and verifier coverage around external replay observation, captured-evidence integrity, and durable consumer outcomes. The real replay P2P now crosses the physical west JetStream boundary. Fresh deterministic evidence is Oracle 40/40 and NOP exactly 30 F2P fail + 10 P2P pass; Creator Complexity, Production Authenticity, and Agent System/package isolation all pass."

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.terminus/reviews/jetstream-regional-stream-continuity/d7e131f9')
          packets = sorted(root.glob('*.packet.json'))
          assert len(packets) == 2, packets
          roles = {json.loads(p.read_text())['role'] for p in packets}
          assert roles == {'Spec-Test Contract Reviewer', 'Production Logic Auditor'}, roles
          for p in packets:
              data = json.loads(p.read_text())
              assert data['task_commit'] == 'd7e131f962753acce119afba5f63bd525203d9c7'
              assert data['state'] == 'FROZEN_CANDIDATE'
              assert data['prior_verdicts_visible'] is False
              print(p)
              print(data['review_id'])
              print(data['review_output_path'])
          PY

      - name: Commit exact packet evidence and remove one-shot controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Terminus CI Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/jetstream-current-review-packets.yml
          if test -e .github/workflows/jetstream-q4-consolidated-closure.yml; then
            git rm .github/workflows/jetstream-q4-consolidated-closure.yml
          fi
          git add .terminus/reviews/jetstream-regional-stream-continuity/d7e131f9/
          git diff --cached --check
          git commit -m "Generate fresh JetStream Q4 Q6 packets for d7e131f9"
          git push origin HEAD:task/jetstream-quality-interlock
