name: Terminus Edge Router Environment Invoke

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-env-invoke.yml'

permissions:
  contents: read
  statuses: write

env:
  TASK_ID: edge-router-runtime
  TASK_SNAPSHOT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad
  A1_INVOCATION_ID: inv_79d4551ca8b96875e1f37dc7cea565949e1ade639e32fa1b5de68d5a081bf0d8
  A2_INVOCATION_ID: inv_b9463c264c05f24c0876eb2968702df48cc551bb7bfe1c87b1a45cf9a73df239
  A3_INVOCATION_ID: inv_28c1baf5125eb73cb1a52b677925c8967f6a9ceb113e42bf4c28e8f08db86f98

jobs:
  invoke-environment-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish run breadcrumb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=terminus/environment-invocation \
            -f description='Environment invocation generation running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replay committed four-event ledger
        run: |
          python3 .terminus/execution/controller_cli.py status \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --output /tmp/status.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          assert s['ledger_event_count']==4, s
          assert s['ledger_head_event_id']=='evt_f1c98192e311a34491b5fb6a6ac53af55c3d89eae3918ad858c244dfd73c863a', s
          assert s['lineage']['status']=='CURRENT', s
          assert s['next']['action']=='INVOKE_STAGE', s
          assert s['next']['stage_id']=='ENVIRONMENT_BUILD', s
          assert s['next']['primary_role_id']=='A2_ENVIRONMENT_BUILDER', s
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Build exact environment inputs
        run: |
          python3 - <<'PY'
          import json, os
          base=f".terminus/executions/{os.environ['TASK_ID']}"
          a1=json.load(open(f"{base}/{os.environ['A1_INVOCATION_ID']}.result.json"))
          a2=json.load(open(f"{base}/{os.environ['A2_INVOCATION_ID']}.result.json"))
          a3=json.load(open(f"{base}/{os.environ['A3_INVOCATION_ID']}.result.json"))
          rule=a1['invocation_snapshot']['inputs']['required']['CREATION_RULE_CONTEXT']
          inputs={
            'CREATION_RULE_CONTEXT': rule,
            'CLEAN_SYSTEM_ARCHITECTURE': a2['outputs'],
            'DEFECT_TOPOLOGY': a3['outputs'],
            'SOLVER_VISIBLE_DOC_PLAN': a2['outputs']['SOLVER_VISIBLE_DOC_PLAN'],
          }
          json.dump(inputs,open('/tmp/env-inputs.json','w'),indent=2,sort_keys=True)
          PY

      - name: Generate exact environment invocation
        run: |
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$TASK_SNAPSHOT" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/env-inputs.json \
            --output /tmp/env-next.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/env-next.json'))
          inv=p['invocation']
          assert inv['readiness']=='READY', inv
          assert inv['stage']['stage_id']=='ENVIRONMENT_BUILD', inv
          assert inv['stage']['role_id']=='A2_ENVIRONMENT_BUILDER', inv
          print('===ENV_INVOCATION_ID===')
          print(inv['invocation_id'])
          print('===ENV_STATE_SNAPSHOT===')
          print(p['state_snapshot_id'])
          print('===ENV_INVOCATION_BEGIN===')
          print(json.dumps(inv,indent=2,sort_keys=True))
          print('===ENV_INVOCATION_END===')
          PY

      - name: Publish success breadcrumb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=terminus/environment-invocation \
            -f description='Environment invocation generated from committed A3 ledger' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
