name: Generate repeated COBOL Q4 adjudication packet
on:
  push:
    paths:
      - '.github/workflows/generate-cobol-q4-repeat-adjudication.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify repeated Q4 and generate adjudication packet
        shell: bash
        run: |
          set -euo pipefail
          TASK='cobol-comp3-python-equiv'
          EXPECTED='59dcf2146e1bac84cbc98d7d641e79b5a0138c4a'
          PREFIX="${EXPECTED:0:8}"
          WORKFLOW='.github/workflows/generate-cobol-q4-repeat-adjudication.yml'
          PRIOR='.terminus/reviews/cobol-comp3-python-equiv/9ce15848/cobol-comp3-python-equiv-9ce15848-spec-test-contract-425d520855.json'
          PRIOR_ADJ='.terminus/reviews/cobol-comp3-python-equiv/9ce15848/cobol-comp3-python-equiv-9ce15848-adjudication-400e19c155.json'
          CURRENT='.terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-spec-test-contract-49bcc5e6c4.json'

          actual="$(git log -1 --format=%H -- "$TASK")"
          echo "Git-derived task commit: $actual"
          [[ "$actual" == "$EXPECTED" ]] || { echo "::error::STALE task commit"; exit 1; }
          [[ -f "$PRIOR" && -f "$PRIOR_ADJ" && -f "$CURRENT" ]] || { echo "::error::missing frozen review evidence"; exit 1; }
          [[ -z "$(git status --porcelain -- "$TASK")" ]] || { echo "::error::task tree dirty"; exit 1; }

          python3 .terminus/classify_review_delta.py "$PRIOR" "$CURRENT" > /tmp/q4-repeat-delta.json
          cat /tmp/q4-repeat-delta.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/q4-repeat-delta.json', encoding='utf-8'))
          assert data['prior_exhaustiveness_complete'] is True
          findings = data['findings']
          assert len(findings) == 7
          unexpected = [f for f in findings if f['classification'] != 'TOUCHED_BY_REPAIR']
          assert not unexpected, unexpected
          assert data['requires_adjudication'] is False
          PY

          python3 .terminus/new_review_packet.py \
            "$TASK" adjudication \
            --state BLOCKED \
            --change 'Protocol-2.2 repeated-Q4 circuit breaker after an earlier semantic adjudication and its authorized targeted repair. Prior exhaustive Q4 at task commit 9ce15848421135eaa83c356c26a0661ec795532f returned seven blockers and canonical Adjudicator result cobol-comp3-python-equiv-9ce15848-adjudication-400e19c155 decided BOTH_PARTLY / REQUEST_CHANGES / HIGH / SUFFICIENT, upholding all seven and authorizing bounded repair. That repair produced current task commit 59dcf2146e1bac84cbc98d7d641e79b5a0138c4a; authoritative deterministic validation passed Preflight, Ruff, Oracle reward 1 with 40/40 tests, and NOP reward 0 with 30/30 F2P fail plus 10/10 P2P pass; Q6 production scope remained unchanged. Fresh exhaustive Q4 cobol-comp3-python-equiv-59dcf214-spec-test-contract-49bcc5e6c4 then returned REVISE/HIGH/SUFFICIENT with seven blockers. Repository-native classify_review_delta.py against the prior 9ce15848 Q4 and current 59dcf214 Q4 classifies all seven as TOUCHED_BY_REPAIR because tests/test_outputs.py and, for most findings, instruction.md were changed; path-level requires_adjudication=false. Nevertheless Protocol 2.2 independently requires Adjudicator when repeated revisions fail to resolve the same finding or the same semantic finding survives attempted fixes. Semantically reconcile each current Q4 finding against the prior Q4, prior Adjudicator dispositions, exact 9ce15848..59dcf214 task diff, and current evidence. In particular determine whether Q4-001 private src.* ABI/os.replace is a valid latent/private-contract blocker versus reviewer overreach; Q4-002 artifact representation is a repair-introduced regression against prior adjudication guardrails; Q4-003 and Q4-004 are incomplete closure or materially new portions of prior operator-health findings; Q4-005 validly requires every documented settlement/safety class at publication versus over-expands the prior representative end-to-end requirement; Q4-006 corrupt/missing archive-input and registry-attribution coverage is latent, newly required, or overbroad; and Q4-007 movement-shape/item-policy/warehouse-capability authority is a valid unresolved public-contract ambiguity versus private-policy overreach. Decide which current blockers are controlling, which if any should be rejected/narrowed, and whether another explicitly bounded repair is authorized. Do not repair task files and do not rerun Q4.'

          mapfile -t packets < <(find ".terminus/reviews/$TASK/$PREFIX" -maxdepth 1 -type f -name "${TASK}-${PREFIX}-adjudication-*.packet.json" -print)
          [[ ${#packets[@]} -eq 1 ]] || { printf '::error::expected one adjudication packet, found %s\n' "${#packets[@]}"; printf '%s\n' "${packets[@]:-}"; exit 1; }
          PACKET="${packets[0]}"
          python3 - "$PACKET" "$EXPECTED" <<'PY'
          import json, pathlib, sys
          packet_path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          packet = json.loads(packet_path.read_text())
          assert packet['task'] == 'cobol-comp3-python-equiv'
          assert packet['task_commit'] == expected
          assert packet['state'] == 'BLOCKED'
          assert packet['role'] == 'Adjudicator'
          output = pathlib.Path(packet['review_output_path'])
          assert not output.exists(), f'review output already exists: {output}'
          print('packet:', packet_path)
          print('review_id:', packet['review_id'])
          print('review_output:', output)
          PY

          rm -f "$WORKFLOW"
          git config user.name 'terminus-review-packet-bot'
          git config user.email 'terminus-review-packet-bot@users.noreply.github.com'
          git add ".terminus/reviews/$TASK/$PREFIX" "$WORKFLOW"
          git diff --cached --check
          git commit -m 'Add repeated-Q4 COBOL adjudication packet'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
