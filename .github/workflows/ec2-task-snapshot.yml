name: EC2 Task Snapshot Diagnostic

on:
  push:
    branches: [diagnostic/ec2-ledger-integrity-20260820]
    paths: ['.github/workflows/ec2-task-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          git rev-parse HEAD > /tmp/main-head.txt
      - name: Upload EC2 task and governing task-local designs
        uses: actions/upload-artifact@v4
        with:
          name: ec2-current-task-${{ github.run_id }}
          path: |
            ec2-artifact-policy-enforcement
            .terminus/designs/ec2-artifact-policy-enforcement.json
            .terminus/designs/ec2-artifact-policy-enforcement-test-map.json
            /tmp/main-head.txt
          include-hidden-files: true
