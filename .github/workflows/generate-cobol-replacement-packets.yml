name: Generate COBOL Replacement Review Packets

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/generate-cobol-replacement-packets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen task commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git log -1 --format=%H -- cobol-comp3-python-equiv)"
          test "$actual" = "02a558aba2ada944ce3a3131baa0d6847c39f909"
          test -z "$(git status --porcelain -- cobol-comp3-python-equiv)"
      - name: Generate replacement Q4 packet
        run: >-
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv spec-test-contract
          --state FROZEN_CANDIDATE
          --change "Replacement review after post-de9b remediation: operator workflow reachability, CLI/operations/pipeline integration, verifier contract remediation, durable controls fix, cleanup, and fresh deterministic gates. Historical de9b Q4/Q6 are stale acceptance evidence."
      - name: Generate replacement Q6 packet
        run: >-
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv production-logic
          --state FROZEN_CANDIDATE
          --change "Replacement review after post-de9b remediation: operator workflow reachability, CLI/operations/pipeline integration, verifier contract remediation, durable controls fix, cleanup, and fresh deterministic gates. Historical de9b Q4/Q6 are stale acceptance evidence."
      - name: Commit packets and remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-cobol-replacement-packets.yml
          git config user.name 'Terminus Creation Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add .terminus/reviews/cobol-comp3-python-equiv/02a558ab .github/workflows/generate-cobol-replacement-packets.yml
          git commit -m 'Freeze COBOL candidate and generate replacement Q4 Q6 packets'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
