name: Recover COBOL strict rebuild

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild-recovery
    paths:
      - '.github/workflows/recover-cobol-strict.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover complete tar members
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64, os, zlib
          from pathlib import Path

          root = Path('.')
          parts = [root / f'.terminus/tmp/cobol-rebuild.part{i:02d}' for i in range(1, 6)]
          staged = b''.join(p.read_bytes() for p in parts)
          raw64 = b''.join(staged.split())
          raw64 = raw64[: len(raw64) // 4 * 4]
          compressed = base64.b64decode(raw64)
          if compressed[:2] != b'\x1f\x8b':
              raise SystemExit('staged payload is not gzip')
          inflater = zlib.decompressobj(-zlib.MAX_WBITS)
          tar_bytes = inflater.decompress(compressed[10:]) + inflater.flush()
          print(f'staged={len(staged)} normalized_base64={len(raw64)} compressed={len(compressed)} tar_bytes={len(tar_bytes)} eof={inflater.eof}')

          def octal(field: bytes) -> int:
              text = field.rstrip(b'\0 ').lstrip(b' ')
              return int(text or b'0', 8)

          pos = 0
          recovered = []
          incomplete = None
          while pos + 512 <= len(tar_bytes):
              header = tar_bytes[pos:pos+512]
              if header == b'\0' * 512:
                  break
              name = header[0:100].split(b'\0', 1)[0].decode('utf-8')
              prefix = header[345:500].split(b'\0', 1)[0].decode('utf-8')
              if prefix:
                  name = prefix + '/' + name
              size = octal(header[124:136])
              mode = octal(header[100:108])
              kind = header[156:157] or b'0'
              start = pos + 512
              end = start + size
              next_pos = start + ((size + 511) // 512) * 512
              if end > len(tar_bytes):
                  incomplete = name
                  break
              if kind in (b'0', b'\0'):
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tar_bytes[start:end])
                  os.chmod(target, mode & 0o777)
                  recovered.append(name)
              elif kind == b'5':
                  (root / name).mkdir(parents=True, exist_ok=True)
              pos = next_pos

          print(f'recovered={len(recovered)} incomplete={incomplete!r}')
          for name in recovered:
              print('RECOVERED', name)
          report = root / '.terminus/tmp/recovery-report.txt'
          report.write_text(
              f'staged={len(staged)}\nnormalized_base64={len(raw64)}\ncompressed={len(compressed)}\n'
              f'tar_bytes={len(tar_bytes)}\neof={inflater.eof}\nrecovered={len(recovered)}\nincomplete={incomplete}\n'
              + ''.join(f'recovered_path={name}\n' for name in recovered),
              encoding='utf-8',
          )
          PY
      - name: Commit recovered files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terminus Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add cobol-comp3-python-equiv .terminus/designs/cobol-comp3-python-equiv*.json .terminus/research/cobol-comp3-python-equiv-strict-rebuild.md .terminus/tmp/recovery-report.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No recovered files to commit'
          else
            git commit -m 'Recover strict COBOL rebuild staged files'
            git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild-recovery
          fi
