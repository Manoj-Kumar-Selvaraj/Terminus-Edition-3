name: Generate Fresh JetStream C3EE Q4 Q6 Packets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  packets:
    if: github.event.pull_request.head.ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Generate exact-commit Q4 and Q6 packets
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py jetstream-regional-stream-continuity spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change "Second Q4 remediation complete; refrozen at c3ee2778 with 40 tests, exactly 30 F2P + 10 P2P, Oracle 40/40 and NOP exactly 30 F2P fail + 10 P2P pass"
          python3 .terminus/new_review_packet.py jetstream-regional-stream-continuity production-logic \
            --state FROZEN_CANDIDATE \
            --change "Refrozen at c3ee2778 after verifier/reference-solution coverage remediation; solver-visible production runtime/configuration remains unchanged, exact task-commit provenance moved"
          find .terminus/reviews/jetstream-regional-stream-continuity/c3ee2778 -name '*.packet.json' -type f -print -exec cat {} \;
      - name: Upload immutable generated packets
        uses: actions/upload-artifact@v4
        with:
          name: jetstream-q4-q6-c3ee-${{ github.run_id }}
          path: .terminus/reviews/jetstream-regional-stream-continuity/c3ee2778/*.packet.json
          if-no-files-found: error
          retention-days: 14
