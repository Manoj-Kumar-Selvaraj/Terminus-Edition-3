name: Terminus Quality Request Adapter

on:
  push:
    branches:
      - 'terminus-quality-request/**'
    paths:
      - '.terminus/quality-requests/*.json'

permissions:
  contents: write

jobs:
  q4:
    name: Execute final Q4 spec-test contract review
    uses: ./.github/workflows/terminus-quality-executor.yml
    with:
      task: route-control-plane
      role_key: spec-test-contract
      state: FROZEN_CANDIDATE
      change: "Final Q4 attempt after behavioral Ansible precedence, executable dashboard CAS, destructive management-path safety remediation, and fresh hosted deterministic Oracle=1/NOP=0 evidence."
      source_ref: 002e8924a8fc0f604ac8ed109c0e030d066c4838
      publish_result: false
    secrets: inherit
