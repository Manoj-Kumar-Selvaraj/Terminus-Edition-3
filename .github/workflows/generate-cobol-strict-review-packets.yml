name: Generate COBOL strict review packets

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/generate-cobol-strict-review-packets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate fresh Q4 and Q6 packets
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv spec-test-contract \
            --state PRE_LLMAJ --change 'Fresh large_system_strict rebuild; no historical compact-task review is semantically reusable.'
          python3 .terminus/new_review_packet.py cobol-comp3-python-equiv production-logic \
            --state PRE_LLMAJ --change 'Fresh large_system_strict rebuild; no historical compact-task review is semantically reusable.'
      - name: Pre-dispatch invocation guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          expected='de9b508bda9d2d9db75343f83efa15e3c7ec2750'
          packets=sorted((root/'.terminus/reviews/cobol-comp3-python-equiv'/expected[:8]).glob('*.packet.json'))
          current=[p for p in packets if json.loads(p.read_text()).get('task_commit')==expected]
          roles={json.loads(p.read_text())['role']:p for p in current}
          required={'Spec-Test Contract Reviewer','Production Logic Auditor'}
          assert set(roles)==required, (set(roles), required)
          for role,p in roles.items():
              d=json.loads(p.read_text())
              assert d['task_commit']==expected
              out=root/d['review_output_path']
              assert not out.exists(), f'output already exists: {out}'
              assert d['schema_version']=='3.0'
              print(f'{role}: packet={p} review_id={d["review_id"]} output={d["review_output_path"]}')
              if d.get('review_scope_hash'):
                  print(f'{role}: review_scope_hash={d["review_scope_hash"]}')
              print(f'{role}: role_contract_hash={d["role_contract_hash"]}')
          print('REVIEW_INVOCATION_READY')
          PY
      - name: Commit immutable packets and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-cobol-strict-review-packets.yml
          git config user.name 'Terminus Creation Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add .terminus/reviews/cobol-comp3-python-equiv .github/workflows/generate-cobol-strict-review-packets.yml
          git commit -m 'Generate fresh Q4 and Q6 packets for strict COBOL rebuild'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
