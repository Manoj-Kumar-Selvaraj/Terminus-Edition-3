name: JetStream Q4 Fourth-Cycle Remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Apply packet-bound Q4 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import textwrap
          from pathlib import Path

          TASK = Path('jetstream-regional-stream-continuity')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:160]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_top_function(path: Path, name: str, replacement: str) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              node = next(
                  (
                      item
                      for item in tree.body
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and item.name == name
                  ),
                  None,
              )
              if node is None:
                  raise SystemExit(f'function {name} not found in {path}')
              replacement = textwrap.dedent(replacement).lstrip()
              if not replacement.endswith('\n'):
                  replacement += '\n'
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1 : node.end_lineno] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding='utf-8')

          def replace_class_method(
              path: Path, class_name: str, name: str, replacement: str
          ) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              class_node = next(
                  (
                      item
                      for item in tree.body
                      if isinstance(item, ast.ClassDef) and item.name == class_name
                  ),
                  None,
              )
              if class_node is None:
                  raise SystemExit(f'class {class_name} not found in {path}')
              node = next(
                  (
                      item
                      for item in class_node.body
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and item.name == name
                  ),
                  None,
              )
              if node is None:
                  raise SystemExit(f'method {class_name}.{name} not found in {path}')
              replacement = textwrap.indent(
                  textwrap.dedent(replacement).lstrip(), ' ' * 4
              )
              if not replacement.endswith('\n'):
                  replacement += '\n'
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1 : node.end_lineno] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding='utf-8')

          # Q4-F001 and Q4-F006: make the already-visible contract precise at the
          # confirmed watermark and at the post-publish fencing mutation boundary.
          contract = TASK / 'environment/continuity/docs/continuity-contract.md'
          replace_once(
              contract,
              '''The overall system is `CONVERGED` only when the archive is complete through the confirmed watermark and every enabled required consumer has an application checkpoint through that same watermark.\n''',
              '''For a confirmed `(region, generation)`, the confirmed watermark is the generation registry's `last_observed_sequence`. Archive completeness through that watermark requires the highest contiguous archived origin sequence to reach it. The overall system is `CONVERGED` only when the archive is complete through that confirmed watermark and every enabled required consumer has an application checkpoint through the same value.\n''',
          )
          replace_once(
              contract,
              '''Replay execution validates the current owner and fence epoch before execution and again while applying replay items. Lease renewal and release also require the current token. Planning a replay or approving a generation is an explicit durable control-plane change, but those planning/approval actions are not themselves defined as lease-protected replay execution.\n''',
              '''Replay execution validates the current owner and fence epoch before execution and again while applying replay items. When an external replay publish returns, the worker revalidates the same token before writing replay-item state or terminal replay-plan state. If the token became stale while the publish was in flight, the publish acknowledgement may remain as journal/publication evidence, but the stale worker stops with a fencing error and does not write replay-item or terminal plan state after that acknowledgement. Lease renewal and release also require the current token. Planning a replay or approving a generation is an explicit durable control-plane change, but those planning/approval actions are not themselves defined as lease-protected replay execution.\n''',
          )

          tests = TASK / 'tests/test_continuity.py'

          # Q4-F002: retain the documented wrong-stream behavioral boundary and
          # remove the private publish-attempt outcome vocabulary assertion.
          replace_top_function(
              tests,
              'test_f2p_publish_ack_transitions_journal_once',
              r'''
              def test_f2p_publish_ack_transitions_journal_once(engine: ContinuityEngine) -> None:
                  """Only an acknowledgement for the expected physical stream may publish a journal row."""
                  event = sample_event(engine, sequence=5985)
                  expected_stream = str(engine.store.region("east")["physical_stream"])
                  publisher = RecordingPublisher(engine.store)
                  ack = asyncio.run(engine.publish_event(event.identity.event_id, publisher))
                  assert publisher.calls[0]["journal_state_during_publish"] == "PUBLISHING"
                  assert publisher.calls[0]["message_id"] == event.identity.event_id
                  assert ack.stream == expected_stream
                  assert engine.store.journal_state(event.identity.event_id).value == "PUBLISHED"

                  wrong_event = sample_event(engine, sequence=5984)
                  wrong_stream = str(engine.store.region("west")["physical_stream"])
                  wrong_publisher = RecordingPublisher(engine.store, ack_stream=wrong_stream)
                  with pytest.raises(ContractError):
                      asyncio.run(engine.publish_event(wrong_event.identity.event_id, wrong_publisher))
                  assert wrong_publisher.calls[0]["journal_state_during_publish"] == "PUBLISHING"
                  assert wrong_publisher.calls[0]["expected_stream"] == expected_stream
                  assert wrong_publisher.calls[0]["message_id"] == wrong_event.identity.event_id
                  assert engine.store.journal_state(wrong_event.identity.event_id).value == "RETRY"
              ''',
          )

          # Q4-F003: exercise both source ownership and a model-valid checksum
          # mismatch without constructing an invalid EventIdentity.
          replace_top_function(
              tests,
              'test_f2p_archive_metadata_preserves_origin_identity',
              r'''
              def test_f2p_archive_metadata_preserves_origin_identity(
                  engine: ContinuityEngine,
              ) -> None:
                  """Model-valid source/checksum mismatches are reported at reconciliation."""
                  complete_archive(engine, "east")
                  source_event = sample_event(engine, sequence=120)
                  checksum_event = sample_event(engine, sequence=121)
                  engine.store.execute(
                      "UPDATE archive_index SET source_domain='edge-west' WHERE event_id=?",
                      (source_event.identity.event_id,),
                  )
                  engine.store.execute(
                      "UPDATE archive_index SET payload_sha256=? WHERE event_id=?",
                      ("0" * 64, checksum_event.identity.event_id),
                  )
                  summary = engine.reconcile_region("east", 1)
                  assert summary.metadata_mismatch_count == 2
                  assert summary.highest_contiguous_archive_origin_sequence == 6000
                  assert summary.converged is False
                  blocking_ids = {
                      finding.event_id
                      for finding in summary.blocking_findings
                      if finding.event_id is not None
                  }
                  assert {
                      source_event.identity.event_id,
                      checksum_event.identity.event_id,
                  } <= blocking_ids
              ''',
          )

          # Close the narrow REQ-007 matrix gap at the same existing failure test.
          replace_top_function(
              tests,
              'test_f2p_checkpoint_does_not_advance_before_effect_commit',
              r'''
              def test_f2p_checkpoint_does_not_advance_before_effect_commit(
                  engine: ContinuityEngine,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  """A failed effect commit cannot leave either application checkpoint ahead."""
                  event = sample_event(engine, sequence=5698)
                  engine.store.execute(
                      "DELETE FROM processing_effects WHERE consumer_name='telemetry-indexer' AND event_id=?",
                      (event.identity.event_id,),
                  )
                  before = engine.store.checkpoint("telemetry-indexer", "east", 1)
                  assert before is not None

                  def fail_commit(*args: Any, **kwargs: Any) -> Any:
                      raise RuntimeError("simulated effect store failure")

                  monkeypatch.setattr(engine.store, "commit_effect", fail_commit)
                  with pytest.raises(RuntimeError):
                      asyncio.run(
                          engine.process_delivery(
                              FakeDelivery(event, delivery_count=1),
                              worker_id="fault-worker",
                              fence_epoch=1,
                          )
                      )
                  after = engine.store.checkpoint("telemetry-indexer", "east", 1)
                  assert after is not None
                  assert after.last_effect_sequence == before.last_effect_sequence
                  assert after.last_ack_sequence == before.last_ack_sequence
              ''',
          )

          # Q4-F004: require the separate durable poison/quarantine evidence row.
          replace_top_function(
              tests,
              'test_f2p_poison_event_is_quarantined_without_completion',
              r'''
              def test_f2p_poison_event_is_quarantined_without_completion(
                  engine: ContinuityEngine,
              ) -> None:
                  """Quarantine persists audit evidence without completing a business effect."""
                  event = sample_event(engine, sequence=5680)
                  consumer = "safety-state-projector"
                  engine.store.execute(
                      "DELETE FROM poison_events WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  )
                  engine.store.execute(
                      "DELETE FROM processing_effects WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  )
                  engine.store.execute(
                      "DELETE FROM effect_dispatches WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  )
                  before = engine.store.checkpoint(consumer, "east", 1)
                  assert before is not None
                  result = asyncio.run(
                      engine.process_delivery(
                          FakeDelivery(event, consumer_name=consumer, delivery_count=5),
                          worker_id="safety-worker",
                          fence_epoch=1,
                          poison_predicate=lambda _: True,
                      )
                  )
                  after = engine.store.checkpoint(consumer, "east", 1)
                  effect = engine.store.effect(consumer, event.identity.event_id)
                  poison = engine.store.execute(
                      "SELECT disposition,delivery_count FROM poison_events WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  ).fetchone()
                  assert after is not None
                  assert result.status == "QUARANTINED"
                  assert effect is not None and effect.status is EffectStatus.QUARANTINED
                  assert poison is not None
                  assert poison["disposition"] == "QUARANTINED"
                  assert int(poison["delivery_count"]) >= 5
                  assert dispatch_count(engine, consumer, event.identity.event_id) == 0
                  assert after.last_effect_sequence == before.last_effect_sequence
                  assert after.last_ack_sequence == before.last_ack_sequence
              ''',
          )

          # Q4-F001: isolate hub aggregate position from origin authority without
          # fabricating a sparse confirmed watermark that contradicts the contract.
          replace_top_function(
              tests,
              'test_f2p_reconcile_ignores_hub_sequence_equivalence',
              r'''
              def test_f2p_reconcile_ignores_hub_sequence_equivalence(
                  engine: ContinuityEngine,
              ) -> None:
                  """Hub delivery positions do not replace the confirmed origin watermark."""
                  complete_archive(engine, "east")
                  for consumer in engine.store.required_consumers():
                      set_checkpoint(engine, consumer, "east", effect=6000)
                  engine.store.execute(
                      "UPDATE archive_index SET hub_stream_sequence=30000+origin_sequence "
                      "WHERE region='east' AND generation=1"
                  )

                  generation = engine.store.confirmed_generation("east")
                  assert generation is not None
                  assert generation.last_observed_sequence == 6000
                  summary = engine.reconcile_region("east", 1)
                  assert summary.journal_event_count == 6000
                  assert summary.archive_event_count == 6000
                  assert summary.missing_count == 0
                  assert summary.unexpected_count == 0
                  assert summary.metadata_mismatch_count == 0
                  assert summary.consumer_lag_count == 0
                  assert summary.highest_contiguous_archive_origin_sequence == 6000
                  assert summary.required_consumer_progress == {
                      consumer: 6000 for consumer in engine.store.required_consumers()
                  }
                  assert summary.converged is True
              ''',
          )

          # Q4-F006: stale in-flight publisher may preserve publication evidence,
          # but may not write replay-item/terminal state after its epoch rotates.
          replace_top_function(
              tests,
              'test_f2p_stale_recovery_worker_is_fenced',
              r'''
              def test_f2p_stale_recovery_worker_is_fenced(engine: ContinuityEngine) -> None:
                  """Replay fences stale workers at entry and before post-publish recovery mutations."""
                  now = datetime.now(UTC)
                  first = engine.acquire_recovery_lease(
                      region="east",
                      owner_id="worker-a",
                      ttl_seconds=300,
                      at=now,
                  )
                  current = engine.store.write_lease(
                      region="east",
                      owner_id="worker-a",
                      fence_epoch=first.fence_epoch + 1,
                      acquired_at=now,
                      renewed_at=now + timedelta(seconds=1),
                      expires_at=now + timedelta(minutes=5),
                  )
                  assert current.fence_epoch > first.fence_epoch

                  entry_event = "evt-east-g01-005999"
                  entry_plan = engine.store.insert_replay_plan(
                      plan_id="stale-fence-entry",
                      replay_range=ReplayRange("east", 1, 5999, 5999),
                      status=ReplayStatus.APPROVED,
                      reason="verify stale execution fencing at entry",
                      created_by="verifier",
                      event_ids=[entry_event],
                      approved_by="shift-lead",
                      approved_at=now,
                  )
                  with pytest.raises(FencingError):
                      asyncio.run(
                          engine.execute_replay_plan(
                              entry_plan.plan_id,
                              owner_id="worker-a",
                              fence_epoch=first.fence_epoch,
                              publisher=RecordingPublisher(engine.store),
                          )
                      )
                  after_entry = engine.store.replay_plan(entry_plan.plan_id)
                  assert after_entry is not None and after_entry.status is ReplayStatus.APPROVED

                  west_lease = engine.acquire_recovery_lease(
                      region="west",
                      owner_id="worker-mid-plan",
                      ttl_seconds=300,
                      at=now,
                  )
                  mid_ids = ["evt-west-g01-005998", "evt-west-g01-005999"]
                  for event_id in mid_ids:
                      engine.store.execute("DELETE FROM archive_index WHERE event_id=?", (event_id,))
                  mid_plan = engine.store.insert_replay_plan(
                      plan_id="stale-fence-mid-plan",
                      replay_range=ReplayRange("west", 1, 5998, 5999),
                      status=ReplayStatus.APPROVED,
                      reason="verify fence after an in-flight replay publication",
                      created_by="verifier",
                      event_ids=mid_ids,
                      approved_by="shift-lead",
                      approved_at=now,
                  )

                  class FenceRotatingPublisher(RecordingPublisher):
                      async def publish(
                          self,
                          event: EventEnvelope,
                          *,
                          message_id: str,
                          expected_stream: str,
                      ) -> PublishAck:
                          ack = await super().publish(
                              event,
                              message_id=message_id,
                              expected_stream=expected_stream,
                          )
                          if len(self.calls) == 1:
                              lease = engine.store.current_lease("west")
                              assert lease is not None
                              rotated_at = datetime.now(UTC)
                              engine.store.write_lease(
                                  region="west",
                                  owner_id=lease.owner_id,
                                  fence_epoch=lease.fence_epoch + 1,
                                  acquired_at=lease.acquired_at,
                                  renewed_at=rotated_at,
                                  expires_at=rotated_at + timedelta(minutes=5),
                              )
                          return ack

                  publisher = FenceRotatingPublisher(engine.store)
                  with pytest.raises(FencingError):
                      asyncio.run(
                          engine.execute_replay_plan(
                              mid_plan.plan_id,
                              owner_id=west_lease.owner_id,
                              fence_epoch=west_lease.fence_epoch,
                              publisher=publisher,
                          )
                      )
                  items = {
                      item.event_id: item
                      for item in engine.store.replay_items(mid_plan.plan_id)
                  }
                  after_plan = engine.store.replay_plan(mid_plan.plan_id)
                  assert len(publisher.calls) == 1
                  assert items[mid_ids[0]].state == "PENDING"
                  assert items[mid_ids[1]].state == "PENDING"
                  assert after_plan is not None and after_plan.status is ReplayStatus.RUNNING
                  assert engine.store.journal_state(mid_ids[0]).value == "PUBLISHED"
              ''',
          )

          # Q4-F005: same-payload preservation now crosses the durable effect
          # dedupe/dispatch boundary while remaining a P2P on the starter.
          replace_top_function(
              tests,
              'test_p2p_distinct_same_payload_events_remain_distinct',
              r'''
              def test_p2p_distinct_same_payload_events_remain_distinct(
                  engine: ContinuityEngine,
              ) -> None:
                  """Distinct stable identities survive a real durable effect boundary even with equal payloads."""
                  first = sample_event(engine, sequence=100)
                  second = sample_event(engine, sequence=101)
                  payload = {"reading": 77, "quality": "GOOD"}
                  digest = sha256_text(canonical_json(payload))
                  a = EventEnvelope(
                      identity=first.identity,
                      device_id=first.device_id,
                      site_id=first.site_id,
                      event_type=first.event_type,
                      event_time=first.event_time,
                      accepted_at=first.accepted_at,
                      payload=payload,
                      payload_sha256=digest,
                      payload_bytes=64,
                      priority=first.priority,
                  )
                  b = EventEnvelope(
                      identity=second.identity,
                      device_id=second.device_id,
                      site_id=second.site_id,
                      event_type=second.event_type,
                      event_time=second.event_time,
                      accepted_at=second.accepted_at,
                      payload=payload,
                      payload_sha256=digest,
                      payload_bytes=64,
                      priority=second.priority,
                  )
                  consumer = "telemetry-indexer"
                  for event in (a, b):
                      engine.store.execute(
                          "DELETE FROM processing_effects WHERE consumer_name=? AND event_id=?",
                          (consumer, event.identity.event_id),
                      )
                      engine.store.execute(
                          "DELETE FROM effect_dispatches WHERE consumer_name=? AND event_id=?",
                          (consumer, event.identity.event_id),
                      )
                      result = asyncio.run(
                          engine.process_delivery(
                              FakeDelivery(event, consumer_name=consumer),
                              worker_id=f"same-payload-{event.identity.origin_sequence}",
                              fence_epoch=1,
                          )
                      )
                      assert result.status == "COMMITTED"

                  assert a.payload_sha256 == b.payload_sha256
                  assert a.identity.event_id != b.identity.event_id
                  assert dispatch_count(engine, consumer, a.identity.event_id) == 1
                  assert dispatch_count(engine, consumer, b.identity.event_id) == 1
                  effect_a = engine.store.effect(consumer, a.identity.event_id)
                  effect_b = engine.store.effect(consumer, b.identity.event_id)
                  assert effect_a is not None and effect_a.status is EffectStatus.COMMITTED
                  assert effect_b is not None and effect_b.status is EffectStatus.COMMITTED
                  assert effect_a.identity.event_id != effect_b.identity.event_id
              ''',
          )

          coverage = TASK / 'tests/test_contract_coverage.py'
          replace_once(coverage, 'import hashlib\n', 'import asyncio\nimport hashlib\n')
          replace_once(
              coverage,
              'from continuity.store import ContinuityStore  # noqa: E402\n',
              '''from continuity.runtime import (  # noqa: E402\n    JetStreamAdmin,\n    LabProcessManager,\n    NatsConnectionPool,\n    endpoints_from_engine,\n)\nfrom continuity.store import ContinuityStore  # noqa: E402\n''',
          )

          # Q4-F007/F008: invoke the real verify entrypoint on an isolated durable
          # copy, independently derive all material health dimensions, and preserve
          # the exact captured archived controller log.
          log_path = TASK / 'environment/continuity/log/archive/inc-2026-0808-17-controller.log'
          log_digest = hashlib.sha256(log_path.read_bytes()).hexdigest()
          report_replacement = r'''
          def test_f2p_final_health_and_reconciliation_reports_are_materialized(
              tmp_path: Path,
          ) -> None:
              """Verify emits independently truthful reports and preserves captured incident evidence."""
              runtime_root = _operator_root(tmp_path)
              completed = subprocess.run(
                  [
                      str(ROOT / "bin/continuityctl"),
                      "verify",
                      "--root",
                      str(runtime_root),
                      "--compact",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=45,
              )
              assert completed.returncode in {0, 2}, completed.stderr

              health_path = runtime_root / "out/health.json"
              reconciliation_path = runtime_root / "out/reconciliation.json"
              assert health_path.is_file()
              assert reconciliation_path.is_file()
              health = json.loads(health_path.read_text(encoding="utf-8"))
              reconciliation = json.loads(reconciliation_path.read_text(encoding="utf-8"))
              config = json.loads(
                  (runtime_root / "config/continuity.json").read_text(encoding="utf-8")
              )

              def contiguous_floor(values: list[int]) -> int:
                  present = set(values)
                  floor = 0
                  while floor + 1 in present:
                      floor += 1
                  return floor

              topology = config["topology"]
              edge_streams = topology["edge_streams"]
              hub_archive = topology["hub_archive"]
              sources = {item["region"]: item for item in topology["sources"]}
              physical_names = [
                  hub_archive["name"],
                  edge_streams["east"]["name"],
                  edge_streams["west"]["name"],
              ]
              expected_topology_ok = (
                  len(physical_names) == len(set(physical_names))
                  and not hub_archive.get("subjects")
                  and all(
                      edge_streams[region]["name"]
                      == config["regions"][region]["stream_name"]
                      and edge_streams[region]["domain"]
                      == config["regions"][region]["domain"]
                      and sources[region]["origin"]["name"]
                      == edge_streams[region]["name"]
                      and sources[region]["origin"]["domain"]
                      == edge_streams[region]["domain"]
                      for region in ("east", "west")
                  )
                  and str(topology["derived_subject_prefix"]).startswith(
                      "telemetry.derived"
                  )
                  and not str(topology["derived_subject_prefix"]).startswith(
                      "telemetry.raw"
                  )
              )

              recovery = config["recovery"]
              required_horizon = (
                  int(recovery["maximum_disconnect_seconds"])
                  + int(recovery["maximum_replay_seconds"])
                  + int(recovery["safety_margin_seconds"])
              )
              expected_retention_ok = (
                  all(
                      int(config["regions"][region]["stream_policy"]["max_age_seconds"])
                      >= required_horizon
                      for region in ("east", "west")
                  )
                  and int(config["hub_stream_policy"]["max_age_seconds"])
                  >= required_horizon
              )

              connection = sqlite3.connect(runtime_root / "state/continuity.db")
              connection.row_factory = sqlite3.Row
              try:
                  required_consumers = [
                      str(row["consumer_name"])
                      for row in connection.execute(
                          "SELECT consumer_name FROM consumer_registry WHERE required=1 AND enabled=1 ORDER BY consumer_name"
                      ).fetchall()
                  ]
                  active_plans = int(
                      connection.execute(
                          "SELECT COUNT(*) FROM replay_plans WHERE status IN ('APPROVED','RUNNING')"
                      ).fetchone()[0]
                  )
                  expected_recovery_ok = active_plans == 0
                  expected_generations_ok = True
                  expected_publication_ok = (
                      int(
                          connection.execute(
                              "SELECT COUNT(*) FROM event_journal WHERE publish_state IN ('PUBLISHING','RETRY','HELD')"
                          ).fetchone()[0]
                      )
                      == 0
                  )
                  expected_consumers_ok = True
                  expected_region_convergence: dict[str, bool] = {}

                  assert set(reconciliation["regions"]) == {"east", "west"}
                  for region in ("east", "west"):
                      confirmed = connection.execute(
                          "SELECT generation,last_observed_sequence FROM origin_generations "
                          "WHERE region=? AND status='CONFIRMED' ORDER BY generation",
                          (region,),
                      ).fetchall()
                      pending_count = int(
                          connection.execute(
                              "SELECT COUNT(*) FROM origin_generations WHERE region=? AND status='PENDING_APPROVAL'",
                              (region,),
                          ).fetchone()[0]
                      )
                      if len(confirmed) != 1 or pending_count:
                          expected_generations_ok = False
                      assert confirmed, f"{region} must retain a confirmed generation"
                      generation = int(confirmed[-1]["generation"])
                      confirmed_watermark = int(
                          confirmed[-1]["last_observed_sequence"]
                      )
                      region_row = connection.execute(
                          "SELECT physical_stream,jetstream_domain FROM regions WHERE region=?",
                          (region,),
                      ).fetchone()
                      assert region_row is not None
                      expected_stream = str(region_row["physical_stream"])
                      expected_domain = str(region_row["jetstream_domain"])

                      journal_rows = connection.execute(
                          "SELECT event_id,origin_sequence,payload_sha256 FROM event_journal "
                          "WHERE region=? AND generation=?",
                          (region, generation),
                      ).fetchall()
                      archive_rows = connection.execute(
                          "SELECT event_id,origin_sequence,payload_sha256,source_stream,source_domain,duplicate_observation_count "
                          "FROM archive_index WHERE region=? AND generation=?",
                          (region, generation),
                      ).fetchall()
                      journal = {
                          str(row["event_id"]): (
                              int(row["origin_sequence"]),
                              str(row["payload_sha256"]).lower(),
                          )
                          for row in journal_rows
                      }
                      archive = {
                          str(row["event_id"]): (
                              int(row["origin_sequence"]),
                              str(row["payload_sha256"]).lower(),
                              str(row["source_stream"]),
                              str(row["source_domain"]),
                          )
                          for row in archive_rows
                      }
                      missing_ids = set(journal) - set(archive)
                      unexpected_ids = set(archive) - set(journal)
                      metadata_mismatch_count = sum(
                          1
                          for event_id in set(journal) & set(archive)
                          if journal[event_id][0] != archive[event_id][0]
                          or journal[event_id][1] != archive[event_id][1]
                          or archive[event_id][2] != expected_stream
                          or archive[event_id][3] != expected_domain
                      )
                      duplicate_count = sum(
                          int(row["duplicate_observation_count"])
                          for row in archive_rows
                      )
                      archive_floor = contiguous_floor(
                          [value[0] for value in archive.values()]
                      )

                      progress: dict[str, int] = {}
                      for consumer_name in required_consumers:
                          checkpoint = connection.execute(
                              "SELECT last_effect_sequence,last_ack_sequence,jetstream_ack_floor FROM consumer_checkpoints "
