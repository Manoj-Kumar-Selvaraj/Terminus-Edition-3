name: Terminus Edition 3 CI

on:
  pull_request:
    paths-ignore:
      - '.terminus/**'
      - '.github/**'
      - '.cursor/**'
      - '.smoke/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'terminus3.sh'
  push:
    branches: [main]
    paths-ignore:
      - '.terminus/**'
      - '.github/**'
      - '.cursor/**'
      - '.smoke/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'terminus3.sh'
  workflow_dispatch:
    inputs:
      task:
        description: Top-level task directory
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terminus-task-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_STB_VERSION: '2.4.3'

jobs:
  changed-tasks:
    name: Detect changed tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
      count: ${{ steps.tasks.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tasks
        name: Build task matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            candidates="$MANUAL_TASK"
          else
            base="$BASE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$HEAD_SHA")"
            fi
            candidates="$(git diff --name-only "$base" "$HEAD_SHA" | awk -F/ 'NF > 1 {print $1}' | sort -u)"
          fi

          tasks=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            [[ "$candidate" != /* && "$candidate" != *".."* && "$candidate" != */* ]] || {
              echo "::error::Invalid top-level task directory: $candidate"; exit 1;
            }
            if [[ -f "$candidate/task.toml" ]]; then
              tasks+=("$candidate")
            elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::No task.toml found in '$candidate'"; exit 1
            fi
          done <<< "$candidates"

          json="$(printf '%s\n' "${tasks[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "tasks=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#tasks[@]}" >> "$GITHUB_OUTPUT"
          echo "Selected tasks: $json" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate ${{ matrix.task }}
    needs: changed-tasks
    if: needs.changed-tasks.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changed-tasks.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: 'true'
      STB_VERSION: ${{ vars.STB_VERSION }}
      EVIDENCE_DIR: /tmp/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deterministic CI defaults
        run: |
          set -euo pipefail
          [[ -n "${STB_VERSION:-}" ]] || echo "STB_VERSION=$DEFAULT_STB_VERSION" >> "$GITHUB_ENV"

      - name: Preflight task package
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          bash -n ./terminus3.sh
          required=(
            "$TASK/task.toml"
            "$TASK/instruction.md"
            "$TASK/README.md"
            "$TASK/environment/Dockerfile"
            "$TASK/environment/.dockerignore"
            "$TASK/solution/solve.sh"
            "$TASK/tests/Dockerfile"
            "$TASK/tests/test.sh"
          )
          for path in "${required[@]}"; do
            [[ -e "$path" ]] || { echo "::error::Missing required path: $path"; exit 1; }
          done
          compgen -G "$TASK/tests/*.py" >/dev/null || { echo "::error::No Python verifier tests"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Ruff verifier tests
        run: uvx --from ruff==0.12.8 ruff check "${{ matrix.task }}/tests"

      - name: Validate declared complexity and authenticity for this task only
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          design=".terminus/designs/$TASK.json"
          if [[ -f "$design" ]]; then
            profile="$(python3 - "$design" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8')).get('profile', ''))
          PY
          )"
            case "$profile" in
              large_system|large_system_strict)
                python3 .terminus/validate_task_complexity.py "$TASK"
                ;;
            esac
          fi
          if [[ -f ".terminus/designs/$TASK-production.json" ]]; then
            python3 .terminus/validate_runtime_authenticity.py "$TASK"
            python3 .terminus/validate_business_module_diversity.py "$TASK"
          fi

      - name: Install deterministic STB/Harbor utility environment
        run: |
          set -euo pipefail
          docker info >/dev/null
          bash ./terminus3.sh install
          bash ./terminus3.sh version

      - name: Oracle must score 1
        env:
          TASK: ${{ matrix.task }}
          JOBS_DIR: /tmp/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/oracle
        run: |
          set -euo pipefail
          mkdir -p "$JOBS_DIR"
          bash ./terminus3.sh oracle "$TASK" 2>&1 | tee "$JOBS_DIR/command.log"
          mapfile -t rewards < <(find "$JOBS_DIR" -type f -name reward.txt -print)
          (( ${#rewards[@]} > 0 )) || { echo "::error::Oracle produced no reward.txt"; exit 1; }
          for file in "${rewards[@]}"; do
            reward="$(tr -d '[:space:]' < "$file")"
            [[ "$reward" == 1 || "$reward" == 1.0 ]] || {
              echo "::error file=$file::Oracle reward=$reward expected=1"; exit 1;
            }
          done

      - name: NOP must score 0
        env:
          TASK: ${{ matrix.task }}
          JOBS_DIR: /tmp/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/nop
        run: |
          set -euo pipefail
          mkdir -p "$JOBS_DIR"
          bash ./terminus3.sh nop "$TASK" 2>&1 | tee "$JOBS_DIR/command.log"
          mapfile -t rewards < <(find "$JOBS_DIR" -type f -name reward.txt -print)
          (( ${#rewards[@]} > 0 )) || { echo "::error::NOP produced no reward.txt"; exit 1; }
          for file in "${rewards[@]}"; do
            reward="$(tr -d '[:space:]' < "$file")"
            [[ "$reward" == 0 || "$reward" == 0.0 ]] || {
              echo "::error file=$file::NOP reward=$reward expected=0"; exit 1;
            }
          done

      - name: Summarize deterministic validation
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR"
          {
            echo '# Terminus deterministic validation'
            echo
            echo "- Task: ${{ matrix.task }}"
            echo "- Run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- Commit: ${{ github.sha }}"
            echo '- Model/Q/Harbor semantic execution: none'
          } > "$EVIDENCE_DIR/EVIDENCE.md"
          cat "$EVIDENCE_DIR/EVIDENCE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminus-deterministic-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
