name: Terminus Edition 3 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task:
        description: Top-level task directory
        required: true
        type: string
      mode:
        description: Run normal validation or the two five-trial difficulty suites
        required: true
        default: validate
        type: choice
        options:
          - validate
          - difficulty

permissions:
  contents: read

concurrency:
  group: terminus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required repository/org secret:
#   SNORKEL_API_KEY          Snorkel platform API key used by noninteractive stb login
# Optional secret:
#   STB_PORTKEY_PROJECT_ID   Required only when the account has multiple eligible projects
# Optional repository variable:
#   STB_VERSION              Exact known-good snorkelai-stb version. Once CI proves a version,
#                            set this variable so the internal Python auth API is reproducible.

jobs:
  changed-tasks:
    name: Detect changed tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
      count: ${{ steps.tasks.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tasks
        name: Build task matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            candidates="$MANUAL_TASK"
          else
            base="$BASE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$HEAD_SHA")"
            fi
            candidates="$(
              git diff --name-only "$base" "$HEAD_SHA" |
                awk -F/ 'NF > 1 { print $1 }' |
                sort -u
            )"
          fi

          tasks=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if [[ "$candidate" == /* || "$candidate" == *".."* || "$candidate" == */* ]]; then
              echo "::error::Invalid top-level task directory: $candidate"
              exit 1
            fi
            if [[ -f "$candidate/task.toml" ]]; then
              tasks+=("$candidate")
            elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::No task.toml found in top-level directory '$candidate'"
              exit 1
            fi
          done <<< "$candidates"

          json="$(printf '%s\n' "${tasks[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "tasks=$json" >> "$GITHUB_OUTPUT"
          echo "count=${#tasks[@]}" >> "$GITHUB_OUTPUT"
          echo "Selected tasks: $json" >> "$GITHUB_STEP_SUMMARY"

  untrusted-pr:
    name: Trusted credentials required
    needs: changed-tasks
    if: >-
      github.event_name == 'pull_request' &&
      needs.changed-tasks.outputs.count != '0' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Reject secret-dependent validation on fork PRs
        run: |
          echo "::error::Terminus validation needs SNORKEL_API_KEY and will not expose it to a fork pull request."
          echo "A maintainer must validate the task from a trusted branch or workflow_dispatch run."
          exit 1

  validate:
    name: Validate ${{ matrix.task }}
    needs: changed-tasks
    if: >-
      needs.changed-tasks.outputs.count != '0' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'validate') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changed-tasks.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "true"
      SNORKEL_API_KEY: ${{ secrets.SNORKEL_API_KEY }}
      STB_PORTKEY_PROJECT_ID: ${{ secrets.STB_PORTKEY_PROJECT_ID }}
      STB_VERSION: ${{ vars.STB_VERSION }}
      XDG_CONFIG_HOME: /tmp/stb-xdg-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate helper syntax
        shell: bash
        run: bash -n ./terminus3.sh

      - name: Validate task skeleton
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          required=(
            "$TASK/task.toml"
            "$TASK/instruction.md"
            "$TASK/README.md"
            "$TASK/environment"
            "$TASK/solution/solve.sh"
            "$TASK/tests/Dockerfile"
            "$TASK/tests/test.sh"
          )
          for path in "${required[@]}"; do
            [[ -e "$path" ]] || {
              echo "::error::Missing required task path: $path"
              exit 1
            }
          done
          compgen -G "$TASK/tests/*.py" >/dev/null || {
            echo "::error::No Python verifier tests found under $TASK/tests"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Ruff verifier tests
        shell: bash
        run: uvx --from ruff==0.12.8 ruff check "${{ matrix.task }}/tests"

      - name: Install stb and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          ./terminus3.sh install
          ./terminus3.sh version
          echo "stb version: $(stb --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Noninteractive stb login and AI key refresh
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SNORKEL_API_KEY:-}" ]]; then
            echo "::error::Missing repository/org secret SNORKEL_API_KEY"
            exit 1
          fi
          mkdir -p "$XDG_CONFIG_HOME/stb"
          ./terminus3.sh login --noninteractive
          ./terminus3.sh keys-refresh --noninteractive

      - name: Oracle must score 1
        shell: bash
        env:
          TASK: ${{ matrix.task }}
          JOBS_DIR: ${{ runner.temp }}/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/oracle
        run: |
          set -euo pipefail
          mkdir -p "$JOBS_DIR"
          ./terminus3.sh oracle "$TASK"

          mapfile -t rewards < <(find "$JOBS_DIR" -type f -name reward.txt -print)
          (( ${#rewards[@]} > 0 )) || {
            echo "::error::Oracle produced no reward.txt"
            exit 1
          }
          for reward_file in "${rewards[@]}"; do
            reward="$(tr -d '[:space:]' < "$reward_file")"
            [[ "$reward" == "1" || "$reward" == "1.0" ]] || {
              echo "::error file=$reward_file::Oracle reward was '$reward'; expected 1"
              exit 1
            }
          done

      - name: NOP must score 0
        shell: bash
        env:
          TASK: ${{ matrix.task }}
          JOBS_DIR: ${{ runner.temp }}/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/nop
        run: |
          set -euo pipefail
          mkdir -p "$JOBS_DIR"
          ./terminus3.sh nop "$TASK"

          mapfile -t rewards < <(find "$JOBS_DIR" -type f -name reward.txt -print)
          (( ${#rewards[@]} > 0 )) || {
            echo "::error::NOP produced no reward.txt"
            exit 1
          }
          for reward_file in "${rewards[@]}"; do
            reward="$(tr -d '[:space:]' < "$reward_file")"
            [[ "$reward" == "0" || "$reward" == "0.0" ]] || {
              echo "::error file=$reward_file::NOP reward was '$reward'; expected 0"
              exit 1
            }
          done

      - name: Run Harbor LLMaJ check
        shell: bash
        run: ./terminus3.sh check "${{ matrix.task }}"

      - name: Upload Harbor validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminus-validation-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminus-e3/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.task }}/
          if-no-files-found: ignore
          retention-days: 7

  difficulty:
    name: Difficulty ${{ matrix.label }} - ${{ inputs.task }}
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'difficulty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GPT-5.5 x5
            command: diff-gpt
          - label: Claude Opus 4.8 x5
            command: diff-claude
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: "true"
      SNORKEL_API_KEY: ${{ secrets.SNORKEL_API_KEY }}
      STB_PORTKEY_PROJECT_ID: ${{ secrets.STB_PORTKEY_PROJECT_ID }}
      STB_VERSION: ${{ vars.STB_VERSION }}
      XDG_CONFIG_HOME: /tmp/stb-xdg-diff-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.command }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate task selection and helper syntax
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          bash -n ./terminus3.sh
          if [[ "$TASK" == /* || "$TASK" == *".."* || "$TASK" == */* ]]; then
            echo "::error::Task must be a top-level directory name"
            exit 1
          fi
          [[ -f "$TASK/task.toml" ]] || {
            echo "::error::No task.toml found in '$TASK'"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Install stb and verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          ./terminus3.sh install
          ./terminus3.sh version
          echo "stb version: $(stb --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Noninteractive stb login and AI key refresh
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SNORKEL_API_KEY:-}" ]]; then
            echo "::error::Missing repository/org secret SNORKEL_API_KEY"
            exit 1
          fi
          mkdir -p "$XDG_CONFIG_HOME/stb"
          ./terminus3.sh login --noninteractive
          ./terminus3.sh keys-refresh --noninteractive

      - name: Run difficulty suite
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          JOBS_DIR: ${{ runner.temp }}/terminus-e3-difficulty/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.task }}/${{ matrix.command }}
        run: |
          set -euo pipefail
          mkdir -p "$JOBS_DIR"
          ./terminus3.sh "${{ matrix.command }}" "$TASK"
          echo "Difficulty jobs: $JOBS_DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload difficulty outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminus-difficulty-${{ matrix.command }}-${{ inputs.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminus-e3-difficulty/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.task }}/${{ matrix.command }}/
          if-no-files-found: ignore
          retention-days: 7
