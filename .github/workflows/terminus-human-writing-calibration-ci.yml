name: Terminus Human Writing Calibration CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-human-writing-calibration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned lint tool
        run: python -m pip install --quiet ruff==0.14.10
      - name: Compile human-writing subsystem
        run: python -m compileall -q .terminus/human_writing .terminus/retrieval
      - name: Lint human-writing subsystem
        run: ruff check .terminus/human_writing .terminus/retrieval/stage_overlay.py .terminus/retrieval/policy.py
      - name: Validate calibration contracts
        run: |
          python .terminus/human_writing/calibration_cli.py --root . validate
          python .terminus/human_writing/validate_calibration.py --root .
      - name: Run calibration regressions
        run: |
          python .terminus/human_writing/test_calibration.py
          python .terminus/human_writing/test_learning_loop.py
