name: EC2 Inline Driver

on:
  push:
    branches:
      - orchestrator/ec2-inline-driver-20260820
    paths:
      - '.github/workflows/ec2-inline-driver.yml'

permissions:
  contents: write

jobs:
  reauthorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reauthorize EC2 remediated stages under current control
        run: python3 .github/ec2_reauthorize_current.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-reauthorize-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ec2-reauthorize
          if-no-files-found: warn
