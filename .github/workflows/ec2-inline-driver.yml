name: EC2 Inline Driver

on:
  push:
    branches:
      - orchestrator/ec2-inline-driver-20260820
    paths:
      - '.github/workflows/ec2-inline-driver.yml'

permissions:
  contents: write

jobs:
  hwr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist run locator
        run: |
          set -euo pipefail
          mkdir -p .terminus/orchestrator-diagnostics
          printf '{"run_id":%s,"run_attempt":%s,"job":"hwr","event_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > ".terminus/orchestrator-diagnostics/ec2-hwr-$GITHUB_SHA.json"
          git config user.name 'terminus-inline-driver[bot]'
          git config user.email 'terminus-inline-driver[bot]@users.noreply.github.com'
          git add -- ".terminus/orchestrator-diagnostics/ec2-hwr-$GITHUB_SHA.json"
          git commit -m "Persist EC2 HWR locator $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Execute EC2-specific Human Writing Research
        run: python3 .github/ec2_hwr_current.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-hwr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ec2-hwr-current
          if-no-files-found: warn
