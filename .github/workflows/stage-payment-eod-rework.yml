name: Stage payment EOD large-system rework

on:
  push:
    branches: [main]
    paths:
      - ".terminus/staging/payment-eod-large-rework.ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply transparent task patch and create atomic rework commit
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".terminus/staging/payment-eod-large-rework"
          ready=".terminus/staging/payment-eod-large-rework.ready"
          patch_file="$(mktemp)"

          cat "$stage_dir"/part-*.patch > "$patch_file"
          git apply --check "$patch_file"

          rm -rf payment-eod-control-chain
          rm -f .terminus/designs/payment-eod-control-chain.json \
                .terminus/designs/payment-eod-control-chain-test-map.json \
                .terminus/research/payment-eod-control-chain.md
          git apply "$patch_file"

          python3 .terminus/validate_task_complexity.py payment-eod-control-chain
          python3 -m py_compile payment-eod-control-chain/tests/test_outputs.py
          bash -n payment-eod-control-chain/solution/solve.sh
          bash -n payment-eod-control-chain/environment/eod/bin/run_eod.sh
          for f in payment-eod-control-chain/environment/eod/lib/*.sh; do bash -n "$f"; done

          rm -rf "$stage_dir" "$ready" .github/workflows/stage-payment-eod-rework.yml

          git config user.name "terminus-ci"
          git config user.email "terminus-ci@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rework payment EOD as large-system task"
          git push origin HEAD:main
