name: Terminus EC2 Ledger Integrity Repair

on:
  push:
    branches:
      - orchestrator/ec2-ledger-integrity-repair-20260820
    paths:
      - '.github/workflows/terminus-ec2-ledger-integrity-repair.yml'

permissions:
  contents: write

concurrency:
  group: terminus-ec2-ledger-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct corrupt ledger metadata from immutable records
        id: repair
        shell: bash
        env:
          EXPECTED_MAIN: 5106b27ae6cc5257854f08c63bac4eca95685f36
          TASK: ec2-artifact-policy-enforcement
          TASK_COMMIT: 8836f886d7cfc7f2747264026da31d1dfa49c658
          CONTROL_COMMIT: 5106b27ae6cc5257854f08c63bac4eca95685f36
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          [[ "$current" == "$EXPECTED_MAIN" ]] || {
            echo "::error::main moved before ledger repair expected=$EXPECTED_MAIN current=$current"
            exit 1
          }

          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / '.terminus'))
          from execution.ledger import ExecutionLedger

          task = 'ec2-artifact-policy-enforcement'
          ledger = ExecutionLedger(root, task)
          ledger_path = ledger.ledger_path
          old_events = [
              json.loads(line)
              for line in ledger_path.read_text(encoding='utf-8').splitlines()
              if line
          ]
          if len(old_events) != 4:
              raise SystemExit(f'unexpected ledger length: {len(old_events)}')

          new_events = []
          rows = []
          for index, old in enumerate(old_events, start=1):
              if old.get('sequence') != index or old.get('task_id') != task:
                  raise SystemExit(f'ledger identity drift at sequence {index}')
              path = root / old['record_path']
              raw = path.read_bytes()
              value = json.loads(raw)
              canonical = ledger._canonical_json(value)
              if raw != canonical:
                  raise SystemExit(f'record is not already canonical: {old["record_path"]}')
              record_hash = ledger._sha256(raw)

              if value.get('record_id') != old.get('record_id'):
                  raise SystemExit(f'record_id drift at sequence {index}')
              if value.get('invocation_id') != old.get('invocation_id'):
                  raise SystemExit(f'invocation_id drift at sequence {index}')
              if value.get('stage_id') != old.get('stage_id'):
                  raise SystemExit(f'stage_id drift at sequence {index}')
              authority = value.get('authority', {})
              lineage = value.get('task_lineage', {})
              if authority.get('task_id') != task:
                  raise SystemExit(f'task_id drift in record at sequence {index}')
              if lineage.get('input_task_commit') != old.get('input_task_commit'):
                  raise SystemExit(f'input task lineage drift at sequence {index}')
              if lineage.get('output_task_commit') != old.get('output_task_commit'):
                  raise SystemExit(f'output task lineage drift at sequence {index}')
              if authority.get('control_plane_commit') != old.get('control_plane_commit'):
                  raise SystemExit(f'control-plane drift at sequence {index}')

              shadow_event = dict(old)
              shadow_event['record_hash'] = record_hash
              ledger._validate_historical_record(value, shadow_event)

              payload = {
                  'schema_version': ledger.schema_version,
                  'sequence': index,
                  'previous_event_id': new_events[-1]['event_id'] if new_events else None,
                  'record_id': value['record_id'],
                  'invocation_id': value['invocation_id'],
                  'stage_id': value['stage_id'],
                  'task_id': task,
                  'input_task_commit': lineage['input_task_commit'],
                  'output_task_commit': lineage['output_task_commit'],
                  'control_plane_commit': authority['control_plane_commit'],
                  'record_path': old['record_path'],
                  'record_hash': record_hash,
              }
              new = {'event_id': ledger._event_id(payload), **payload}
              new_events.append(new)

              changed = sorted(key for key in old if old.get(key) != new.get(key))
              rows.append({
                  'sequence': index,
                  'stage_id': old['stage_id'],
                  'old_record_hash': old['record_hash'],
                  'new_record_hash': record_hash,
                  'changed_fields': changed,
                  'old_event_id': old['event_id'],
                  'new_event_id': new['event_id'],
              })

          expected_changes = {
              1: [],
              2: [],
              3: ['event_id', 'record_hash'],
              4: ['event_id', 'previous_event_id'],
          }
          for row in rows:
              if row['changed_fields'] != expected_changes[row['sequence']]:
                  raise SystemExit(
                      f'ledger repair exceeds bounded metadata correction at sequence '
                      f'{row["sequence"]}: {row["changed_fields"]}'
                  )

          rendered = '\n'.join(ledger._compact_json(event) for event in new_events) + '\n'
          ledger_path.write_text(rendered, encoding='utf-8')

          # The canonical loader must accept the reconstructed chain, including
          # immutable historical invocation/record identities.
          loaded = ledger.load(validate_record_files=True)
          if [event['event_id'] for event in loaded] != [event['event_id'] for event in new_events]:
              raise SystemExit('canonical ledger reload changed reconstructed identity')

          diagnosis = {
              'task_id': task,
              'classification': 'BOUNDED_LEDGER_METADATA_RECONSTRUCTION',
              'rows': rows,
          }
          Path('/tmp/ec2-ledger-diagnosis.json').write_text(
              json.dumps(diagnosis, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(diagnosis, indent=2, sort_keys=True))
          PY

          cat > /tmp/ec2-inputs.json <<'JSON'
          {
            "CREATION_REQUEST": "Recover and continue the existing ec2-artifact-policy-enforcement task under current Terminus Edition-3 rules, preserving the task's EC2 artifact policy enforcement objective and reconciling the current creation profile and validators before further lifecycle work.",
            "REQUESTED_DOMAIN": "production Go EC2 software supply-chain and artifact policy enforcement"
          }
          JSON

          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK" \
            --task-commit "$TASK_COMMIT" \
            --control-plane-commit "$CONTROL_COMMIT" \
            --inputs-json /tmp/ec2-inputs.json \
            --output /tmp/ec2-continue.json

          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/ec2-continue.json', encoding='utf-8'))
          next_action = payload.get('next', {})
          invocation = payload.get('invocation', {})
          if next_action.get('action') not in {'INVOKE_STAGE', 'RETRY_STAGE'}:
              raise SystemExit(f'unexpected controller action after repair: {next_action}')
          if next_action.get('stage_id') != 'RULE_RESOLUTION':
              raise SystemExit(f'unexpected controller stage after repair: {next_action}')
          if invocation.get('readiness') != 'READY':
              raise SystemExit('RULE_RESOLUTION invocation is not READY after repair')
          print('controller_continue_ready', invocation.get('invocation_id'))
          PY

          changed="$(git diff --name-only)"
          [[ "$changed" == '.terminus/executions/ec2-artifact-policy-enforcement/ledger.jsonl' ]] || {
            echo "::error::Repair mutated unexpected paths: $changed"
            exit 1
          }

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_main" == "$EXPECTED_MAIN" ]] || {
            echo "::error::main moved during ledger repair expected=$EXPECTED_MAIN current=$remote_main"
            exit 1
          }

          git config user.name 'terminus-ledger-repair[bot]'
          git config user.email 'terminus-ledger-repair[bot]@users.noreply.github.com'
          git add -- .terminus/executions/ec2-artifact-policy-enforcement/ledger.jsonl
          git commit -m 'Repair ec2-artifact-policy-enforcement execution ledger integrity'
          git push origin HEAD:main

      - name: Persist repair diagnostics on request branch
        if: always()
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          REQUEST_BRANCH: orchestrator/ec2-ledger-integrity-repair-20260820
        run: |
          set -euo pipefail
          status_root="$RUNNER_TEMP/ec2-ledger-repair-status"
          git fetch origin "$REQUEST_BRANCH"
          git worktree add "$status_root" "origin/$REQUEST_BRANCH"
          mkdir -p "$status_root/.terminus/repair-run-status"
          python3 - "$status_root/.terminus/repair-run-status/ec2-artifact-policy-enforcement.json" <<'PY'
          import json, os, pathlib, sys
          diagnosis_path = pathlib.Path('/tmp/ec2-ledger-diagnosis.json')
          diagnosis = None
          if diagnosis_path.is_file():
              diagnosis = json.loads(diagnosis_path.read_text(encoding='utf-8'))
          payload = {
              'schema_version': '1.0',
              'task_id': 'ec2-artifact-policy-enforcement',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'repair_outcome': os.environ['REPAIR_OUTCOME'],
              'diagnosis': diagnosis,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cd "$status_root"
          git config user.name 'terminus-ledger-repair[bot]'
          git config user.email 'terminus-ledger-repair[bot]@users.noreply.github.com'
          git add -- .terminus/repair-run-status/ec2-artifact-policy-enforcement.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record EC2 ledger repair diagnostics'
            git push origin HEAD:"$REQUEST_BRANCH"
          fi
