name: Terminus EC2 Ledger Integrity Repair

on:
  push:
    branches:
      - orchestrator/ec2-ledger-integrity-repair-20260820
    paths:
      - '.github/workflows/terminus-ec2-ledger-integrity-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify every historical execution record
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / '.terminus'))
          from execution.invocation import StageInvocationBuilder
          from execution.ledger import ExecutionLedger
          from execution.record import ExecutionRecordBuilder

          task = 'ec2-artifact-policy-enforcement'
          ledger = ExecutionLedger(root, task)
          builder = ExecutionRecordBuilder(root)
          events = [json.loads(line) for line in ledger.ledger_path.read_text(encoding='utf-8').splitlines() if line]
          rows = []
          for event in events:
              raw = (root / event['record_path']).read_bytes()
              value = json.loads(raw)
              identity = dict(value)
              stored_record_id = identity.pop('record_id', None)
              computed_record_id = ExecutionRecordBuilder._record_id(identity)
              invocation = value.get('invocation_snapshot') or {}
              invocation_identity = dict(invocation)
              stored_invocation_id = invocation_identity.pop('invocation_id', None)
              computed_invocation_id = StageInvocationBuilder._invocation_id(invocation_identity) if invocation_identity else None
              actual_hash = ledger._sha256(raw)
              canonical_hash = ledger._sha256(ledger._canonical_json(value))

              current_validation = 'PASS'
              try:
                  builder.validate_persisted_record(value)
              except Exception as exc:
                  current_validation = f'{type(exc).__name__}: {exc}'

              shadow_event = dict(event)
              shadow_event['record_hash'] = actual_hash
              historical_validation = 'PASS'
              try:
                  ledger._validate_historical_record(value, shadow_event)
              except Exception as exc:
                  historical_validation = f'{type(exc).__name__}: {exc}'

              row = {
                  'sequence': event['sequence'],
                  'stage_id': event['stage_id'],
                  'invocation_id': event['invocation_id'],
                  'ledger_record_hash': event['record_hash'],
                  'actual_record_hash': actual_hash,
                  'canonical_record_hash': canonical_hash,
                  'stored_record_id': stored_record_id,
                  'computed_record_id': computed_record_id,
                  'record_id_valid': stored_record_id == computed_record_id,
                  'stored_invocation_id': stored_invocation_id,
                  'computed_invocation_id': computed_invocation_id,
                  'invocation_id_valid': stored_invocation_id == computed_invocation_id,
                  'current_validation': current_validation,
                  'historical_validation': historical_validation,
              }
              rows.append(row)
              print(json.dumps(row, sort_keys=True))

          diagnosis = {
              'task_id': task,
              'classification': 'HISTORICAL_RECORD_VALIDITY_CLASSIFICATION',
              'rows': rows,
          }
          Path('/tmp/ec2-ledger-diagnosis.json').write_text(json.dumps(diagnosis, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Persist repair diagnostics on request branch
        if: always()
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          REQUEST_BRANCH: orchestrator/ec2-ledger-integrity-repair-20260820
        run: |
          set -euo pipefail
          status_root="$RUNNER_TEMP/ec2-ledger-repair-status"
          git fetch origin "$REQUEST_BRANCH"
          git worktree add "$status_root" "origin/$REQUEST_BRANCH"
          mkdir -p "$status_root/.terminus/repair-run-status"
          python3 - "$status_root/.terminus/repair-run-status/ec2-artifact-policy-enforcement.json" <<'PY'
          import json, os, pathlib, sys
          diagnosis_path = pathlib.Path('/tmp/ec2-ledger-diagnosis.json')
          diagnosis = json.loads(diagnosis_path.read_text(encoding='utf-8')) if diagnosis_path.is_file() else None
          payload = {
              'schema_version': '1.0',
              'task_id': 'ec2-artifact-policy-enforcement',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'repair_outcome': os.environ['REPAIR_OUTCOME'],
              'diagnosis': diagnosis,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          cd "$status_root"
          git config user.name 'terminus-ledger-repair[bot]'
          git config user.email 'terminus-ledger-repair[bot]@users.noreply.github.com'
          git add -- .terminus/repair-run-status/ec2-artifact-policy-enforcement.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record EC2 ledger record validity diagnostics'
            git push origin HEAD:"$REQUEST_BRANCH"
          fi
