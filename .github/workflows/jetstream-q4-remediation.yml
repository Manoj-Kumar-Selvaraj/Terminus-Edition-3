name: JetStream Q4 Remediation

on:
  push:
    branches:
      - task/jetstream-quality-interlock

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Apply Q2 verifier repairs from Q4 findings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path(".")
          tests_path = root / "jetstream-regional-stream-continuity/tests/test_continuity.py"
          coverage_path = root / "jetstream-regional-stream-continuity/tests/test_contract_coverage.py"
          map_path = root / ".terminus/designs/jetstream-regional-stream-continuity-test-map.json"

          text = tests_path.read_text(encoding="utf-8")
          text = text.replace(
              '    assert topology.hub_archive.subjects == ()\n    assert engine.hub_stream_policy().allow_direct is False\n',
              '    assert topology.hub_archive.subjects == ()\n',
          )

          old_replay = '''def test_f2p_replay_plan_contains_only_missing_events(engine: ContinuityEngine) -> None:
              """Replay membership contains missing stable identities rather than the full origin range."""
              expected_missing = set(engine.missing_event_ids("east", 1))
              assert expected_missing
              decision = engine.plan_replay(
                  region="east",
                  generation=1,
                  created_by="verifier",
                  reason="east reconciliation gaps",
              )
              assert decision.plan is not None
              assert set(decision.plan.event_ids) == expected_missing
              assert set(decision.missing_event_ids) == expected_missing
          '''.replace("          ", "")
          new_replay = '''def test_f2p_replay_plan_contains_only_missing_events(engine: ContinuityEngine) -> None:
              """Replay planning selects exact missing identities and permits a later disjoint active gap."""
              complete_archive(engine, "east")
              first_missing = {"evt-east-g01-005800", "evt-east-g01-005801"}
              for event_id in first_missing:
                  engine.store.execute("DELETE FROM archive_index WHERE event_id=?", (event_id,))

              first = engine.plan_replay(
                  region="east",
                  generation=1,
                  created_by="verifier",
                  reason="first isolated reconciliation gap",
                  approve=True,
                  approved_by="shift-lead",
              )
              assert first.plan is not None
              assert set(first.plan.event_ids) == first_missing
              assert set(first.missing_event_ids) == first_missing
              assert first.plan.replay_range == ReplayRange("east", 1, 5800, 5801)

              complete_archive(engine, "east")
              second_missing = {"evt-east-g01-005900", "evt-east-g01-005901"}
              for event_id in second_missing:
                  engine.store.execute("DELETE FROM archive_index WHERE event_id=?", (event_id,))

              second = engine.plan_replay(
                  region="east",
                  generation=1,
                  created_by="verifier",
                  reason="second disjoint reconciliation gap",
                  approve=True,
                  approved_by="shift-lead",
              )
              assert second.plan is not None
              assert set(second.plan.event_ids) == second_missing
              assert set(second.missing_event_ids) == second_missing
              assert first.plan.replay_range.overlaps(second.plan.replay_range) is False
          '''.replace("          ", "")
          if old_replay in text:
              text = text.replace(old_replay, new_replay, 1)
          elif new_replay not in text:
              raise SystemExit("replay-plan test shape changed unexpectedly")

          old_fence = '''def test_f2p_stale_recovery_worker_is_fenced(engine: ContinuityEngine) -> None:
              """Lease reacquisition after expiry advances the fencing epoch and invalidates the old token."""
              t0 = datetime(2026, 8, 9, 3, 0, tzinfo=UTC)
              first = engine.acquire_recovery_lease(region="east", owner_id="worker-a", ttl_seconds=5, at=t0)
              second = engine.acquire_recovery_lease(
                  region="east",
                  owner_id="worker-b",
                  ttl_seconds=30,
                  at=t0 + timedelta(seconds=6),
              )
              assert second.fence_epoch > first.fence_epoch
              with pytest.raises(FencingError):
                  engine.assert_recovery_fence(
                      region="east",
                      owner_id="worker-a",
                      fence_epoch=first.fence_epoch,
                      at=t0 + timedelta(seconds=7),
                  )
          '''.replace("          ", "")
          new_fence = '''def test_f2p_stale_recovery_worker_is_fenced(engine: ContinuityEngine) -> None:
              """Replay execution rejects a stale epoch before changing plan state or publishing an item."""
              now = datetime.now(UTC)
              first = engine.acquire_recovery_lease(
                  region="east",
                  owner_id="worker-a",
                  ttl_seconds=300,
                  at=now,
              )
              current = engine.store.write_lease(
                  region="east",
                  owner_id="worker-a",
                  fence_epoch=first.fence_epoch + 1,
                  acquired_at=now,
                  renewed_at=now + timedelta(seconds=1),
                  expires_at=now + timedelta(minutes=5),
              )
              assert current.fence_epoch > first.fence_epoch

              event_id = "evt-east-g01-005999"
              plan = engine.store.insert_replay_plan(
                  plan_id="stale-fence-replay",
                  replay_range=ReplayRange("east", 1, 5999, 5999),
                  status=ReplayStatus.APPROVED,
                  reason="verify stale execution fencing",
                  created_by="verifier",
                  event_ids=[event_id],
                  approved_by="shift-lead",
                  approved_at=now,
              )
              publisher = RecordingPublisher(engine.store)
              with pytest.raises(FencingError):
                  asyncio.run(
                      engine.execute_replay_plan(
                          plan.plan_id,
                          owner_id="worker-a",
                          fence_epoch=first.fence_epoch,
                          publisher=publisher,
                      )
                  )
              assert publisher.calls == []
              after = engine.store.replay_plan(plan.plan_id)
              assert after is not None and after.status is ReplayStatus.APPROVED
          '''.replace("          ", "")
          if old_fence in text:
              text = text.replace(old_fence, new_fence, 1)
          elif new_fence not in text:
              raise SystemExit("stale-fence test shape changed unexpectedly")

          old_weak_p2p = '''def test_p2p_nonoverlapping_replay_ranges_can_coexist(engine: ContinuityEngine) -> None:
              """Separate replay ranges for the same confirmed generation remain independently schedulable."""
              first_ids = ["evt-east-g01-005800", "evt-east-g01-005801"]
              second_ids = ["evt-east-g01-005900", "evt-east-g01-005901"]
              first = engine.store.insert_replay_plan(
                  plan_id="p2p-east-a",
                  replay_range=ReplayRange("east", 1, 5800, 5801),
                  status=ReplayStatus.DRAFT,
                  reason="independent range a",
                  created_by="verifier",
                  event_ids=first_ids,
              )
              second = engine.store.insert_replay_plan(
                  plan_id="p2p-east-b",
                  replay_range=ReplayRange("east", 1, 5900, 5901),
                  status=ReplayStatus.DRAFT,
                  reason="independent range b",
                  created_by="verifier",
                  event_ids=second_ids,
              )
              assert first.replay_range.overlaps(second.replay_range) is False
          '''.replace("          ", "")
          if old_weak_p2p in text:
              text = text.replace(old_weak_p2p, "", 1)
          tests_path.write_text(text, encoding="utf-8")

          coverage = coverage_path.read_text(encoding="utf-8")
          coverage = coverage.replace(
              "import json\nimport shutil\n",
              "import hashlib\nimport json\nimport shutil\nimport subprocess\n",
              1,
          )

          helper_marker = "# ---- F2P: solver-visible contract gaps ---------------------------------------------------\n"
          helpers = '''def _operator_root(tmp_path: Path) -> Path:
              root = tmp_path / "operator-runtime"
              (root / "state").mkdir(parents=True)
              (root / "config").mkdir(parents=True)
              (root / "out").mkdir(parents=True)
              shutil.copy2(ROOT / "state/continuity.db", root / "state/continuity.db")
              shutil.copy2(ROOT / "config/continuity.json", root / "config/continuity.json")
              return root


          def _protected_state_digest(database: Path) -> str:
              tables = (
                  "event_journal",
                  "archive_index",
                  "origin_generations",
                  "processing_effects",
                  "consumer_checkpoints",
                  "replay_plans",
                  "replay_plan_items",
                  "recovery_leases",
                  "retention_watermarks",
              )
              connection = sqlite3.connect(database)
              try:
                  digest = hashlib.sha256()
                  for table in tables:
                      rows = connection.execute(f'SELECT * FROM "{table}" ORDER BY rowid').fetchall()
                      digest.update(table.encode("utf-8"))
                      digest.update(json.dumps(rows, separators=(",", ":"), default=str).encode("utf-8"))
                  return digest.hexdigest()
              finally:
                  connection.close()


          '''.replace("          ", "")
          if helpers not in coverage:
              if helper_marker not in coverage:
                  raise SystemExit("coverage helper insertion marker missing")
              coverage = coverage.replace(helper_marker, helpers + helper_marker, 1)

          old_report = '''def test_f2p_final_health_and_reconciliation_reports_are_materialized() -> None:
              """The submitted repair leaves the requested operator JSON reports in the runtime output directory."""
              health_path = ROOT / "out/health.json"
              reconciliation_path = ROOT / "out/reconciliation.json"

              assert health_path.is_file(), "solution must materialize /app/continuity/out/health.json"
              assert reconciliation_path.is_file(), (
                  "solution must materialize /app/continuity/out/reconciliation.json"
              )

              health = json.loads(health_path.read_text(encoding="utf-8"))
              reconciliation = json.loads(reconciliation_path.read_text(encoding="utf-8"))

              assert isinstance(health, dict)
              assert "healthy" in health and "details" in health
              assert isinstance(reconciliation, dict)
              assert "converged" in reconciliation and "regions" in reconciliation
              assert set(reconciliation["regions"]) == {"east", "west"}
          '''.replace("          ", "")
          new_report = '''def test_f2p_final_health_and_reconciliation_reports_are_materialized(tmp_path: Path) -> None:
              """Final reports match independently recomputed durable state and preserve captured incident evidence."""
              health_path = ROOT / "out/health.json"
              reconciliation_path = ROOT / "out/reconciliation.json"

              assert health_path.is_file(), "solution must materialize /app/continuity/out/health.json"
              assert reconciliation_path.is_file(), (
                  "solution must materialize /app/continuity/out/reconciliation.json"
              )

              health = json.loads(health_path.read_text(encoding="utf-8"))
              reconciliation = json.loads(reconciliation_path.read_text(encoding="utf-8"))
              expected_database = tmp_path / "expected-report-state.db"
              shutil.copy2(ROOT / "state/continuity.db", expected_database)
              expected_engine = ContinuityEngine.from_json_file(
                  ContinuityStore(expected_database),
                  ROOT / "config/continuity.json",
              )
              expected_health = expected_engine.inspect_health().as_dict()
              expected_regions = {
                  region: summary.as_dict()
                  for region, summary in expected_engine.reconcile_all().items()
              }

              for key in (
                  "healthy",
                  "topology_ok",
                  "generations_ok",
                  "publication_ok",
                  "archive_ok",
                  "consumers_ok",
                  "retention_ok",
                  "recovery_ok",
              ):
                  assert health[key] == expected_health[key]

              assert set(reconciliation["regions"]) == {"east", "west"}
              assert reconciliation["converged"] == all(
                  summary["converged"] for summary in expected_regions.values()
              )
              contract_fields = (
                  "status",
                  "journal_event_count",
                  "archive_event_count",
                  "missing_count",
                  "unexpected_count",
                  "duplicate_count",
                  "metadata_mismatch_count",
                  "consumer_lag_count",
                  "checksum",
                  "findings",
                  "converged",
              )
              for region, expected in expected_regions.items():
                  actual = reconciliation["regions"][region]
                  for field in contract_fields:
                      assert actual[field] == expected[field]

              stream_state = json.loads((ROOT / "ops/stream-state.json").read_text(encoding="utf-8"))
              assert stream_state["incident_id"] == "INC-JS-2026-0808-17"
              assert stream_state["captured_at"] == "2026-08-08T17:18:10Z"
              assert stream_state["domains"]["hub"]["messages"] == 11395
              assert stream_state["domains"]["hub"]["sources"][1]["domain"] == "edge-east"
              handoff = (ROOT / "ops/shift-handoff.txt").read_text(encoding="utf-8")
              assert "three west identities and two east identities" in handoff
              archive_log = ROOT / "log/archive"
              assert archive_log.is_dir() and any(path.is_file() for path in archive_log.iterdir())
          '''.replace("          ", "")
          if old_report in coverage:
              coverage = coverage.replace(old_report, new_report, 1)
          elif new_report not in coverage:
              raise SystemExit("report test shape changed unexpectedly")

          p2p_marker = "# ---- P2P: already-correct detailed contract behavior ------------------------------------\n"
          new_p2p = '''def test_p2p_diagnostic_cli_commands_do_not_mutate_recovery_state(tmp_path: Path) -> None:
              """Inspect, reconcile and verify may record observations but do not mutate replay/retention state."""
              runtime_root = _operator_root(tmp_path)
              database = runtime_root / "state/continuity.db"
              before = _protected_state_digest(database)

              for command in ("inspect", "reconcile", "verify"):
                  completed = subprocess.run(
                      [
                          str(ROOT / "bin/continuityctl"),
                          command,
                          "--root",
                          str(runtime_root),
                          "--compact",
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=45,
                  )
                  assert completed.returncode in {0, 2}, completed.stderr
                  assert _protected_state_digest(database) == before


          def test_p2p_stale_lease_release_is_rejected(contract_engine: ContinuityEngine) -> None:
              """The exposed lease release operation cannot release a newer lease with an old epoch."""
              now = datetime.now(UTC)
              current = contract_engine.store.write_lease(
                  region="east",
                  owner_id="release-worker",
                  fence_epoch=7,
                  acquired_at=now,
                  renewed_at=now,
                  expires_at=now + timedelta(minutes=5),
              )
              with pytest.raises(FencingError):
                  contract_engine.store.release_lease(
                      "east",
                      owner_id="release-worker",
                      fence_epoch=6,
                      at=now + timedelta(seconds=1),
                  )
              after = contract_engine.store.current_lease("east")
              assert after is not None
              assert after.fence_epoch == current.fence_epoch


          '''.replace("          ", "")
          if new_p2p not in coverage:
              if p2p_marker not in coverage:
                  raise SystemExit("P2P insertion marker missing")
              coverage = coverage.replace(p2p_marker, p2p_marker + "\n\n" + new_p2p, 1)
          coverage_path.write_text(coverage, encoding="utf-8")

          mapping = json.loads(map_path.read_text(encoding="utf-8"))
          mapping["requirements"]["REQ-25"] = (
              "continuityctl inspect, reconcile and verify may record diagnostic reconciliation observations "
              "but must not apply replay, retention or equivalent recovery-state mutations."
          )
          mapping["tests"] = [
              row
              for row in mapping["tests"]
              if row[0] != "test_p2p_nonoverlapping_replay_ranges_can_coexist"
          ]
          existing_names = {row[0] for row in mapping["tests"]}
          additions = [
              ["test_p2p_diagnostic_cli_commands_do_not_mutate_recovery_state", "P2P", "REQ-25"],
              ["test_p2p_stale_lease_release_is_rejected", "P2P", "REQ-20"],
          ]
          for row in additions:
              if row[0] not in existing_names:
                  mapping["tests"].append(row)
          map_path.write_text(json.dumps(mapping, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "Terminus CI Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- jetstream-regional-stream-continuity/tests/test_continuity.py \
            jetstream-regional-stream-continuity/tests/test_contract_coverage.py \
            .terminus/designs/jetstream-regional-stream-continuity-test-map.json; then
            echo "Q4 remediation already applied."
            exit 0
          fi
          git add jetstream-regional-stream-continuity/tests/test_continuity.py \
            jetstream-regional-stream-continuity/tests/test_contract_coverage.py \
            .terminus/designs/jetstream-regional-stream-continuity-test-map.json
          git commit -m "Repair JetStream verifier after Q4 review"
          git push origin HEAD:task/jetstream-quality-interlock
