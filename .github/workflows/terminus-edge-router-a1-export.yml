name: Terminus Edge Router A1 Export

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-a1-export.yml'

permissions:
  contents: read

env:
  TASK_ID: edge-router-runtime
  TASK_SNAPSHOT: 6c91b9aca662fa192c144d55c8aee0e693adcc0d
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad
  A1_INVOCATION_ID: inv_79d4551ca8b96875e1f37dc7cea565949e1ade639e32fa1b5de68d5a081bf0d8

jobs:
  export-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce successful controller record
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/terminus-edge-router-a1-record.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def script_for(step_name):
              marker = f'      - name: {step_name}'
              start = lines.index(marker)
              run_line = None
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith('      - name: '):
                      break
                  if lines[i] == '        run: |':
                      run_line = i
                      break
              if run_line is None:
                  raise SystemExit(f'run block missing for {step_name}')
              body = []
              for line in lines[run_line + 1:]:
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  else:
                      body.append('')
              return '\n'.join(body) + '\n'

          for step in ('Rebuild exact A1 invocation', 'Build corrected A1 stage result', 'Record A1 through canonical recorder'):
              subprocess.run(['bash', '-e'], input=script_for(step), text=True, check=True)
          PY

      - name: Emit exact generated bytes
        run: |
          echo '===A1_RECORD_B64_BEGIN==='
          base64 -w0 ".terminus/executions/edge-router-runtime/${A1_INVOCATION_ID}.result.json"
          echo
          echo '===A1_RECORD_B64_END==='
          echo '===LEDGER_B64_BEGIN==='
          base64 -w0 '.terminus/executions/edge-router-runtime/ledger.jsonl'
          echo
          echo '===LEDGER_B64_END==='
