name: Terminus reviewer exhaustiveness upgrade

on:
  push:
    branches:
      - task/jetstream-quality-interlock
    paths:
      - .github/workflows/terminus-reviewer-exhaustiveness-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Invoke Terminus reviewer exhaustiveness upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Apply reviewer exhaustiveness and scope-freshness upgrade
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              write(path, text.replace(old, new, 1))

          def replace_section(path: str, start_heading: str, next_heading: str, replacement: str) -> None:
              text = read(path)
              pattern = re.compile(
                  rf'(?ms)^{re.escape(start_heading)}\s*$.*?(?=^{re.escape(next_heading)}\s*$)'
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected one section {start_heading!r}, found {len(matches)}')
              write(path, text[:matches[0].start()] + replacement.rstrip() + '\n\n' + text[matches[0].end():])

          # ------------------------------------------------------------------
          # Policy versions and Q4/Q6 role contracts
          # ------------------------------------------------------------------
          replace_once(
              '.terminus/agents/QUALITY_AGENT_PROMPTS.md',
              'Quality-agent prompt policy version: `1.0`',
              'Quality-agent prompt policy version: `1.1`',
          )

          q4_prompt = r'''## Q4 — Spec-Test Contract Reviewer

### Mission
Independently certify complete bidirectional alignment between the solver-visible specification and verifier semantics. Q4 is a breadth review, not a first-defect detector.

### Independence
Do not read Q1/Q2/Q3 conclusions or Verifier Author coverage claims until your own matrix is frozen. Read the actual solver-visible contract and verifier independently. A cold reviewer must not use a previous Q4 result to decide what to inspect.

### Exhaustive required method
1. Freeze a complete inventory of every material solver-visible requirement before deciding verdict.
2. Freeze a complete inventory of every substantive verifier behavior, including stable output/schema fields and externally observable integration boundaries.
3. Map every material requirement -> one or more meaningful behavioral assertions; mark complete, partial, vacuous or absent coverage.
4. Map every substantive verifier behavior -> a discoverable solver-visible requirement; identify phantom implementation choices, hidden labels and private return-value contracts.
5. Inspect every delegated/reference document named by the instruction and every stable public interface the verifier grades.
6. Inspect all F2P and P2P boundaries for behavioral ownership, preservation intent, external-boundary bypasses, circular oracles and vacuous preservation tests.
7. Inspect ambiguity that changes accepted behavior, authority, ordering, units, timestamps, identity, restart/idempotency, failure handling or path scope.
8. Inspect instruction/contract shape for hidden-test dump or compressed-rubric leakage created while closing gaps.
9. Perform a second adversarial omission sweep after the first matrix is complete: search for unasserted SHALL/MUST/stable-interface obligations and verifier assertions not represented in the frozen reverse matrix.
10. Return all material findings discovered across the complete allowed scope in this one result. Finding one reason for `REVISE` is never permission to stop the review.

### Exhaustiveness rule
A Q4 result is a completeness claim over the evidence the packet allows. Before returning `PASS` or `REVISE`, the reviewer must complete the forward matrix, reverse matrix, delegated-contract walk, F2P/P2P boundary walk, output-interface walk and second omission sweep. If any required evidence cannot be inspected far enough to complete those walks, return `INSUFFICIENT_EVIDENCE` and name the missing evidence instead of returning a partial `REVISE`.

### Materiality
- `BLOCKER` and `HIGH` findings are always blocking.
- `MEDIUM` is blocking only when the defect can change solver pass/fail, externally observable correctness, safety/durability, or compliance with a documented stable public interface.
- `LOW` is advisory and does not block Quality Interlock unless an authoritative rule explicitly makes that condition mandatory.
- Cosmetic completeness, preferred implementation, incidental serialization and non-contractual internal vocabulary are not promoted to blocking findings merely because they can be asserted.

### Verdict rules
- any material phantom test -> `REVISE`;
- any material untested requirement -> `REVISE`;
- any grading-relevant ambiguity -> `REVISE`;
- any blocking finding ID -> `REVISE`;
- `PASS` requires the exhaustive walk to be complete and `BLOCKING_FINDING_IDS` to be empty;
- advisory findings may accompany `PASS` only when their non-blocking materiality is explicit.

### Role output
```text
REQUIREMENT_TEST_MATRIX:
PHANTOM_TEST_CONTRACTS:
UNTESTED_REQUIREMENTS:
AMBIGUITIES:
DELEGATED_CONTRACT_CHECK:
SPEC_DUMP_RISK: LOW | MEDIUM | HIGH
BIDIRECTIONAL_ALIGNMENT: PASS | FAIL
BLOCKING_FINDING_IDS:
ADVISORY_FINDING_IDS:
EXHAUSTIVENESS:
  REQUIREMENTS_ENUMERATED: COMPLETE | INCOMPLETE
  VERIFIER_BEHAVIORS_ENUMERATED: COMPLETE | INCOMPLETE
  FORWARD_MATRIX_COMPLETE: YES | NO
  REVERSE_MATRIX_COMPLETE: YES | NO
  DELEGATED_CONTRACTS_COMPLETE: YES | NO
  P2P_BOUNDARIES_COMPLETE: YES | NO
  F2P_BOUNDARIES_COMPLETE: YES | NO
  OUTPUT_INTERFACES_COMPLETE: YES | NO
  SECOND_PASS_OMISSION_SWEEP: PASS | INCOMPLETE
  UNINSPECTED_SCOPE:
```
'''
          replace_section(
              '.terminus/agents/QUALITY_AGENT_PROMPTS.md',
              '## Q4 — Spec-Test Contract Reviewer',
              '## Q5 — Oracle & Runtime Repair Specialist',
              q4_prompt,
          )

          q6_scope_text = r'''### Scope-preserved reuse
The packet for Q6 carries a top-level `review_scope_hash` over the Q6 production evidence surface. Copy that exact field unchanged into the top-level review result. The current scope is deliberately conservative: task `task.toml` plus the complete solver-visible `environment/` tree. A later task commit may reuse a Q6 PASS only when the current recomputed scope hash is byte-for-byte identical, the packet/result hash matches, the Q6 role contract is still current, and no Q6 evidence-surface file changed. Tests-only, solution-only or instruction-only edits do not by themselves require another Q6 run. Any change under the Q6 scope invalidates reuse.

'''
          replace_once(
              '.terminus/agents/QUALITY_AGENT_PROMPTS.md',
              '### Role output\n```text\nCORE_LOGIC_DEPTH: HIGH | MEDIUM | LOW',
              q6_scope_text + '### Role output\n```text\nCORE_LOGIC_DEPTH: HIGH | MEDIUM | LOW',
          )

          # Registry: exhaustive Q4 + scoped Q6 freshness.
          replace_once(
              '.terminus/agents/QUALITY_AGENT_REGISTRY.md',
              'Quality-agent registry version: `1.0`',
              'Quality-agent registry version: `1.1`',
          )
          replace_once(
              '.terminus/agents/QUALITY_AGENT_REGISTRY.md',
              '- A task change stales any quality review whose evidence surface changed.',
              '- A task change stales any quality review whose evidence surface changed. Exact task-commit binding remains the default; Q6 is the only scope-reusable quality role and may remain current across a tests/spec-only task commit when its recorded production-scope hash is unchanged and all other provenance remains current.',
          )

          q4_registry = r'''## Q4 — Spec-Test Contract Reviewer

**Type:** independent read-only semantic reviewer.

**Decision right:** is the complete grading contract bidirectionally aligned and unambiguous after an exhaustive walk of the entire allowed scope?

It independently rebuilds the requirement/test matrix rather than trusting Q1–Q3 or Verifier Author notes. Q4 is not allowed to stop after the first blocking defect merely because the verdict is already known.

Mandatory exhaustive checks:
1. Inventory every material solver-visible requirement.
2. Inventory every substantive verifier behavior.
3. Complete requirement -> verifier coverage for the full inventory.
4. Complete verifier behavior -> discoverable requirement for the full inventory.
5. Walk every delegated solver-visible contract and stable graded output interface.
6. Walk all F2P/P2P behavioral boundaries, including external integrations, preservation intent, circular oracles and bypass risk.
7. Walk all grading-relevant ambiguity and authority boundaries.
8. Perform a second adversarial omission sweep after the first matrix is frozen.
9. Report all blocking findings from the complete review in the same result.

A reviewer that cannot complete the exhaustive walk because evidence is unavailable returns `INSUFFICIENT_EVIDENCE`, not a partial `REVISE`.

Materiality is explicit: `BLOCKER/HIGH` always block; `MEDIUM` blocks only when it can change solver pass/fail, observable correctness, safety/durability or a documented stable public interface; `LOW` is advisory unless an authoritative rule makes it mandatory. `PASS` requires no blocking findings and a complete exhaustiveness block.

A single material phantom test, material untested requirement, or grading-relevant ambiguity is still `REVISE`; exhaustiveness makes the review more complete, not easier.
'''
          replace_section(
              '.terminus/agents/QUALITY_AGENT_REGISTRY.md',
              '## Q4 — Spec-Test Contract Reviewer',
              '## Q5 — Oracle & Runtime Repair Specialist',
              q4_registry,
          )
          replace_once(
              '.terminus/agents/QUALITY_AGENT_REGISTRY.md',
              'Verdict is independent of Complexity Governor and production-authenticity validator output.\n\n## Q7 — Task Format Enforcer',
              'Verdict is independent of Complexity Governor and production-authenticity validator output.\n\nQ6 uses a conservative production evidence-scope hash over task `task.toml` plus the full solver-visible `environment/` tree. Once a Q6 PASS is produced under the current scoped-freshness contract, a later task commit may retain it only when that scope hash is unchanged and packet/result/role-contract provenance remains current. Any production-scope change makes Q6 stale.\n\n## Q7 — Task Format Enforcer',
          )
          replace_once(
              '.terminus/agents/QUALITY_AGENT_REGISTRY.md',
              '- Q6 `PASS`, confidence >= MEDIUM, evidence `SUFFICIENT`;',
              '- Q6 `PASS`, confidence >= MEDIUM, evidence `SUFFICIENT`, either on the exact task commit or retained by the Protocol-defined unchanged Q6 production-scope hash;',
          )

          # ------------------------------------------------------------------
          # Protocol 2.2: scope-based Q6 freshness + no-drip Q4 adjudication.
          # ------------------------------------------------------------------
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              'Policy version: `2.1`',
              'Policy version: `2.2`',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              'TASK_COMMIT: <git-derived task commit>\nSTATE:',
              'TASK_COMMIT: <git-derived task commit>\nREVIEW_SCOPE_HASH: <optional role-scoped evidence hash; currently required for Q6>\nSTATE:',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              'A current review is bound to both **task state** and **role contract**.\n\nTask binding is the exact `task_commit`. Role binding is the exact `role_contract_hash` generated from the policy/calibration inputs relevant to that role. This avoids two opposite errors: preserving a review after its governing role contract changed, and invalidating unrelated roles merely because some other role\'s prompt changed.',
              'A current review is bound to both **task evidence state** and **role contract**.\n\nExact `task_commit` binding remains the default. Role binding is the exact `role_contract_hash` generated from the policy/calibration inputs relevant to that role. One narrow exception exists for explicitly scope-reusable roles: currently only Q6 Production Logic Auditor. Q6 packets/results carry `review_scope_hash`, computed over task `task.toml` plus the full solver-visible `environment/` tree. A Q6 PASS may remain current across a later task commit only when the recomputed current scope hash exactly matches the packet/result hash and the Q6 role contract is still current. Q4 is never scope-reusable because tests and solver-visible contracts are its evidence surface. This avoids both preserving a review after relevant evidence changed and invalidating Q6 merely because an unrelated verifier-only file changed.',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              '| `tests` | Verifier, difficulty, Oracle/NOP evidence; Instruction alignment if requirements changed |',
              '| `tests` | Verifier, Q4, difficulty, Oracle/NOP evidence; Instruction alignment if requirements changed. Q6 may remain current only through an unchanged recorded Q6 production-scope hash. |',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              '| starter/environment | Task Architect, Verifier, Originality, Oracle/NOP, difficulty |',
              '| starter/environment | Task Architect, Verifier, Q4, Q6, Originality, Oracle/NOP, difficulty; any `environment/` change invalidates Q6 scope reuse |',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              'ROLE_CONTRACT_HASH:\nCONTEXT_PACKET:',
              'ROLE_CONTRACT_HASH:\nREVIEW_SCOPE_HASH: <required only for scope-reusable roles; copy exactly from packet>\nCONTEXT_PACKET:',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              '- role-contract hash;\n- packet `review_output_path`;',
              '- role-contract hash;\n- review-scope hash for scope-reusable roles;\n- packet `review_output_path`;',
          )
          replace_once(
              '.terminus/agents/PROTOCOL.md',
              'The adjudicator receives frozen reports only after the independent reviewers complete, plus controlling rules/evidence, and no desired verdict.\n\n## 12. Circuit breakers',
              'The adjudicator receives frozen reports only after the independent reviewers complete, plus controlling rules/evidence, and no desired verdict.\n\n### Latent reviewer omission / no-drip rule\n\nAn exhaustive Q4 result is a completeness claim over the evidence it inspected. After one Orchestrator-authorized consolidated repair/refreeze cycle, a later Q4 finding must be classified against the task diff before starting another normal repair cycle. If the finding rests entirely on evidence that was unchanged and fully reviewable in the previous exhaustive Q4 scope, classify it `LATENT_REVIEWER_OMISSION` and route it to Adjudication. Do not silently waive the finding: the Adjudicator may uphold it and require repair, but the pipeline must not enter another blind Q4 patch loop without that disposition. A finding introduced by, or materially touching, the repair diff is a legitimate regression/new-scope finding and may route normally.\n\n`.terminus/classify_review_delta.py` provides a deterministic first-pass classification from evidence refs and changed task paths; semantic equivalence still belongs to the Orchestrator/Adjudicator.\n\n## 12. Circuit breakers',
          )
          old_circuit = '''Stop blind iteration when:\n\n- the same infrastructure failure occurs twice without new evidence;\n- the same semantic finding survives two attempted fixes;\n- three consecutive task changes fail to advance a gate;\n- reviewer disagreement cannot be resolved from available evidence;\n- credentials/quota/network make the next expensive run predictably futile.\n\nRecord `BLOCKED`, the evidence, and the required strategy change before retrying.'''
          new_circuit = '''Stop blind iteration when:\n\n- the same infrastructure failure occurs twice without new evidence;\n- the same semantic finding survives two attempted fixes;\n- an exhaustive Q4 `REVISE` has already received one consolidated normal repair/refreeze cycle and the next Q4 raises a finding on unchanged previously reviewable scope; classify that finding `LATENT_REVIEWER_OMISSION` and adjudicate before another repair;\n- three consecutive task changes fail to advance a gate;\n- reviewer disagreement cannot be resolved from available evidence;\n- credentials/quota/network make the next expensive run predictably futile.\n\nFor Q4, the default normal budget after an exhaustive result is one consolidated repair/refreeze cycle, not an open-ended sequence of narrow patches. Newly introduced regressions may still be repaired; latent unchanged-scope findings require Adjudicator disposition first.\n\nRecord `BLOCKED`, the evidence, and the required strategy change before retrying.'''
          replace_once('.terminus/agents/PROTOCOL.md', old_circuit, new_circuit)

          # ------------------------------------------------------------------
          # Agent-system top-level language: Q4 exact, Q6 scope-preservable.
          # ------------------------------------------------------------------
          replace_once(
              '.terminus/AGENT_SYSTEM.md',
              'Agent-system policy version: `2.3`',
              'Agent-system policy version: `2.4`',
          )
          replace_once(
              '.terminus/AGENT_SYSTEM.md',
              '- A PASS is evidence for one role and one task/role-contract version, not a permanent property of a task.',
              '- A PASS is evidence for one role, one role-contract version, and one validated evidence surface. Exact task-commit binding is the default; only roles explicitly declared scope-reusable by Protocol may survive an unrelated task change with an identical recorded scope hash.',
          )
          replace_once(
              '.terminus/AGENT_SYSTEM.md',
              'After deterministic freeze, **Q4 and Q6 must independently PASS with sufficient evidence on the exact task commit before normal Pre-LLMaJ begins**.',
              'After deterministic freeze, **Q4 must independently PASS with sufficient evidence on the exact task commit; Q6 must independently PASS with sufficient evidence either on that exact task commit or under the Protocol-defined unchanged Q6 production-scope hash before normal Pre-LLMaJ begins**.',
          )
          replace_once(
              '.terminus/AGENT_SYSTEM.md',
              '- exact `task_commit`;\n- control-plane commit at invocation;',
              '- exact `task_commit`;\n- role-scoped evidence hash when the role is explicitly scope-reusable (currently Q6);\n- control-plane commit at invocation;',
          )

          # ------------------------------------------------------------------
          # Shared provenance helper: conservative Q6 scope hash.
          # ------------------------------------------------------------------
          replace_once(
              '.terminus/review_contract.py',
              '    "Spec-Test Contract Reviewer": "1.0",\n    "Production Logic Auditor": "1.0",',
              '    "Spec-Test Contract Reviewer": "1.1",\n    "Production Logic Auditor": "1.1",',
          )
          scope_helpers = r'''

SCOPE_REUSABLE_ROLES = {"Production Logic Auditor"}


def review_scope_paths(root: Path, task: str, role: str) -> list[Path]:
    """Return the conservative task evidence surface eligible for scoped reuse."""
    if role not in SCOPE_REUSABLE_ROLES:
        return []
    task_root = (root / task).resolve()
    paths: list[Path] = []
    task_toml = task_root / "task.toml"
    if task_toml.is_file():
        paths.append(task_toml)
    environment = task_root / "environment"
    if environment.is_dir():
        for candidate in environment.rglob("*"):
            if not candidate.is_file():
                continue
            resolved = candidate.resolve()
            try:
                resolved.relative_to(task_root)
            except ValueError as exc:
                raise ValueError(f"scope path escapes task root: {candidate}") from exc
            paths.append(resolved)
    return sorted(set(paths), key=lambda path: path.relative_to(root.resolve()).as_posix())


def review_scope_hash(root: Path, task: str, role: str) -> str:
    """Hash the role-specific task evidence surface; empty means exact-commit-only."""
    paths = review_scope_paths(root, task, role)
    if not paths:
        return ""
    root = root.resolve()
    h = hashlib.sha256()
    h.update(f"scope-v1\nrole={role}\ntask={task}\n".encode("utf-8"))
    for path in paths:
        rel = path.relative_to(root).as_posix()
        data = path.read_bytes()
        h.update(f"\n--- {rel} {len(data)} ---\n".encode("utf-8"))
        h.update(data)
    return h.hexdigest()
'''
          replace_once(
              '.terminus/review_contract.py',
              '\ndef governing_policy_dirty(root: Path, role: str) -> bool:\n',
              scope_helpers + '\n\ndef governing_policy_dirty(root: Path, role: str) -> bool:\n',
          )

          # Packet generator records Q6 scope hash.
          replace_once(
              '.terminus/new_review_packet.py',
              '    role_contract_hash,\n    task_tree_dirty,',
              '    role_contract_hash,\n    review_scope_hash,\n    task_tree_dirty,',
          )
          replace_once(
              '.terminus/new_review_packet.py',
              '    return {\n        "schema_version": "3.0",',
              '    packet = {\n        "schema_version": "3.0",',
          )
          replace_once(
              '.terminus/new_review_packet.py',
              '        "review_output_path": output_path,\n    }\n\n\ndef main',
              '        "review_output_path": output_path,\n    }\n    scope_hash = review_scope_hash(ROOT, task, role)\n    if scope_hash:\n        packet["review_scope_hash"] = scope_hash\n    return packet\n\n\ndef main',
          )

          # ------------------------------------------------------------------
          # Schemas: optional generally, mandatory for Q6; Q4 exhaustiveness shape.
          # ------------------------------------------------------------------
          context_path = ROOT / '.terminus/agents/schemas/context_packet.schema.json'
          context = json.loads(context_path.read_text(encoding='utf-8'))
          context['properties']['review_scope_hash'] = {'type': 'string', 'minLength': 16}
          context.setdefault('allOf', []).append({
              'if': {'properties': {'role': {'const': 'Production Logic Auditor'}}},
              'then': {'required': ['review_scope_hash']},
          })
          context_path.write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')

          result_path = ROOT / '.terminus/agents/schemas/review_result.schema.json'
          result = json.loads(result_path.read_text(encoding='utf-8'))
          result['properties']['review_scope_hash'] = {'type': 'string', 'minLength': 16}
          result.setdefault('allOf', []).append({
              'if': {'properties': {'role': {'const': 'Production Logic Auditor'}}},
              'then': {'required': ['review_scope_hash']},
          })
          q4_exhaustiveness = {
              'type': 'object',
              'required': [
                  'REQUIREMENTS_ENUMERATED',
                  'VERIFIER_BEHAVIORS_ENUMERATED',
                  'FORWARD_MATRIX_COMPLETE',
                  'REVERSE_MATRIX_COMPLETE',
                  'DELEGATED_CONTRACTS_COMPLETE',
                  'P2P_BOUNDARIES_COMPLETE',
                  'F2P_BOUNDARIES_COMPLETE',
                  'OUTPUT_INTERFACES_COMPLETE',
                  'SECOND_PASS_OMISSION_SWEEP',
                  'UNINSPECTED_SCOPE',
              ],
              'properties': {
                  'REQUIREMENTS_ENUMERATED': {'enum': ['COMPLETE', 'INCOMPLETE']},
                  'VERIFIER_BEHAVIORS_ENUMERATED': {'enum': ['COMPLETE', 'INCOMPLETE']},
                  'FORWARD_MATRIX_COMPLETE': {'enum': ['YES', 'NO']},
                  'REVERSE_MATRIX_COMPLETE': {'enum': ['YES', 'NO']},
                  'DELEGATED_CONTRACTS_COMPLETE': {'enum': ['YES', 'NO']},
                  'P2P_BOUNDARIES_COMPLETE': {'enum': ['YES', 'NO']},
                  'F2P_BOUNDARIES_COMPLETE': {'enum': ['YES', 'NO']},
                  'OUTPUT_INTERFACES_COMPLETE': {'enum': ['YES', 'NO']},
                  'SECOND_PASS_OMISSION_SWEEP': {'enum': ['PASS', 'INCOMPLETE']},
                  'UNINSPECTED_SCOPE': {'type': 'array', 'items': {'type': 'string'}},
              },
          }
          result['allOf'].append({
              'if': {'properties': {'role': {'const': 'Spec-Test Contract Reviewer'}}},
              'then': {
                  'properties': {
                      'role_output': {
                          'type': 'object',
                          'required': [
                              'REQUIREMENT_TEST_MATRIX',
                              'PHANTOM_TEST_CONTRACTS',
                              'UNTESTED_REQUIREMENTS',
                              'AMBIGUITIES',
                              'DELEGATED_CONTRACT_CHECK',
                              'SPEC_DUMP_RISK',
                              'BIDIRECTIONAL_ALIGNMENT',
                              'BLOCKING_FINDING_IDS',
                              'ADVISORY_FINDING_IDS',
                              'EXHAUSTIVENESS',
                          ],
                          'properties': {
                              'BLOCKING_FINDING_IDS': {'type': 'array', 'items': {'type': 'string'}},
                              'ADVISORY_FINDING_IDS': {'type': 'array', 'items': {'type': 'string'}},
                              'EXHAUSTIVENESS': q4_exhaustiveness,
                          },
                      },
                  },
              },
          })
          result_path.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')

          # ------------------------------------------------------------------
          # Freshness validator: Q4/Q6 session gates, Q6 scope reuse, Q4 PASS completeness.
          # ------------------------------------------------------------------
          replace_once(
              '.terminus/validate_review_freshness.py',
              '    role_contract_hash,\n    task_tree_dirty,',
              '    role_contract_hash,\n    review_scope_hash,\n    task_tree_dirty,',
          )
          replace_once(
              '.terminus/validate_review_freshness.py',
              '    "pre-llmaj specialist panel": GateSpec(None, frozenset(AGGREGATE_READY), "aggregate"),\n}',
              '    "pre-llmaj specialist panel": GateSpec(None, frozenset(AGGREGATE_READY), "aggregate"),\n    "q4 spec-test contract reviewer": GateSpec("Spec-Test Contract Reviewer", frozenset(SPECIALIST_READY)),\n    "q6 production logic auditor": GateSpec("Production Logic Auditor", frozenset(SPECIALIST_READY)),\n}',
          )
          replace_once(
              '.terminus/validate_review_freshness.py',
              '        "comprehensive reviewer",\n        "documentation reviewer",',
              '        "comprehensive reviewer",\n        "q4 spec-test contract reviewer",\n        "q6 production logic auditor",\n        "documentation reviewer",',
          )
          old_task_binding = '''    if data["task_commit"] != truth_commit:\n        report.staleness(\n            f"{rel}: reviews task commit {data['task_commit'][:12]}, current task commit is {truth_commit[:12]}"\n        )'''
          new_task_binding = '''    if data["task_commit"] != truth_commit:\n        recorded_scope = str(data.get("review_scope_hash", ""))\n        current_scope = review_scope_hash(ROOT, task, expected_role)\n        if (\n            expected_role == "Production Logic Auditor"\n            and recorded_scope\n            and current_scope\n            and recorded_scope == current_scope\n        ):\n            report.warn(\n                f"{rel}: reusing Q6 across task commit {data['task_commit'][:12]} -> {truth_commit[:12]} "\n                "because the validated production review_scope_hash is unchanged"\n            )\n        else:\n            report.staleness(\n                f"{rel}: reviews task commit {data['task_commit'][:12]}, current task commit is {truth_commit[:12]}"\n            )'''
          replace_once('.terminus/validate_review_freshness.py', old_task_binding, new_task_binding)
          replace_once(
              '.terminus/validate_review_freshness.py',
              '    if packet["review_output_path"] != str(rel):',
              '''    if expected_role == "Production Logic Auditor":\n        recorded_scope = str(data.get("review_scope_hash", ""))\n        packet_scope = str(packet.get("review_scope_hash", ""))\n        current_scope = review_scope_hash(ROOT, task, expected_role)\n        if not recorded_scope or recorded_scope != packet_scope:\n            report.error(f"{rel}: Q6 review_scope_hash must match its packet")\n        elif recorded_scope != current_scope:\n            report.staleness(\n                f"{rel}: Q6 production scope changed ({recorded_scope[:12]} != {current_scope[:12]})"\n            )\n\n    if packet["review_output_path"] != str(rel):''',
          )
