name: EC2 Post Runtime Resolver

on:
  push:
    branches: [diagnostic/ec2-ledger-integrity-20260820]
    paths: ['.github/workflows/ec2-post-runtime-resolve.yml']

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist locator
        shell: bash
        run: |
          set -euo pipefail
          path=".terminus/diagnostic-run-locators/ec2-post-runtime-${GITHUB_SHA}.json"
          mkdir -p "$(dirname "$path")"
          printf '{"run_id":%s,"event_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$path"
          git config user.name 'terminus-diagnostic-locator[bot]'
          git config user.email 'terminus-diagnostic-locator[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m "Track EC2 snapshot run $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Checkout current main and prepare snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          mkdir -p /tmp/ec2-snapshot/.terminus/designs
          cp -a ec2-artifact-policy-enforcement /tmp/ec2-snapshot/
          cp -a .terminus/designs/ec2-artifact-policy-enforcement.json /tmp/ec2-snapshot/.terminus/designs/
          cp -a .terminus/designs/ec2-artifact-policy-enforcement-test-map.json /tmp/ec2-snapshot/.terminus/designs/
          git rev-parse HEAD > /tmp/ec2-snapshot/main-head.txt
      - name: Upload current task snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ec2-task-snapshot-${{ github.run_id }}
          path: /tmp/ec2-snapshot
          include-hidden-files: true
