name: Recover strict rebuild xz prefix

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/recover-strict-xz-prefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and commit exact complete tar members
        shell: bash
        run: |
          set -euo pipefail
          cat .terminus/tmp/xz/x{00..44} | base64 -d > /tmp/prefix.xz
          set +e
          xz -dc /tmp/prefix.xz > /tmp/prefix.tar 2>/tmp/xz.err
          xz_rc=$?
          set -e
          echo "xz_rc=$xz_rc"
          test "$xz_rc" -ne 0
          grep -q 'Unexpected end of input' /tmp/xz.err
          rm -rf /tmp/recovered
          mkdir -p /tmp/recovered
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('/tmp/prefix.tar').read_bytes()
          out=Path('/tmp/recovered')
          pos=0; recovered=[]
          while pos+512 <= len(raw):
              hdr=raw[pos:pos+512]
              if hdr == b'\0'*512:
                  break
              stored=hdr[148:156].rstrip(b'\0 ').strip()
              try: want=int(stored or b'0',8)
              except ValueError: break
              chk=bytearray(hdr); chk[148:156]=b'        '
              if sum(chk) != want: break
              prefix=hdr[345:500].rstrip(b'\0')
              name=(prefix+b'/' if prefix else b'')+hdr[0:100].rstrip(b'\0')
              try: name=name.decode()
              except UnicodeDecodeError: break
              try: size=int(hdr[124:136].rstrip(b'\0 ').strip() or b'0',8)
              except ValueError: break
              data_start=pos+512; data_end=data_start+size
              if data_end > len(raw): break
              if hdr[156:157] in (b'0',b'\0'):
                  p=out/name; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw[data_start:data_end]); recovered.append(name)
              pos=data_start+((size+511)//512)*512
          print('RECOVERED_COUNT',len(recovered))
          if len(recovered) != 142:
              raise SystemExit(f'expected 142 complete members, got {len(recovered)}')
          Path('/tmp/recovered-list.txt').write_text('\n'.join(recovered)+'\n')
          PY
          grep -q '^cobol-comp3-python-equiv/environment/equiv/src/pipeline.py$' /tmp/recovered-list.txt
          grep -q '^cobol-comp3-python-equiv/solution/fixed/pipeline.py$' /tmp/recovered-list.txt
          grep -q '^cobol-comp3-python-equiv/tests/test.sh$' /tmp/recovered-list.txt

          rm -rf cobol-comp3-python-equiv
          rm -f .terminus/designs/cobol-comp3-python-equiv.json \
                .terminus/designs/cobol-comp3-python-equiv-production.json \
                .terminus/designs/cobol-comp3-python-equiv-test-map.json \
                .terminus/research/cobol-comp3-python-equiv-strict-rebuild.md
          cp -a /tmp/recovered/. .
          rm -rf cobol-comp3-python-equiv/tests/.pytest_cache

          rm -rf .terminus/tmp/xz
          rm -f .terminus/tmp/strict-current.tar.gz \
                .terminus/tmp/strict-rebuild.bundle.b64 \
                .terminus/tmp/strict-rebuild-v2.part*
          rm -f .github/workflows/publish-cobol-strict-rebuild.yml
          rm -f .github/workflows/recover-strict-xz-prefix.yml

          git config user.name 'Terminus Creation Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Recover strict COBOL inventory cutover production tree'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
