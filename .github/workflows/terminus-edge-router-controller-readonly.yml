name: Terminus Edge Router Controller Readonly

on:
  push:
    branches:
      - task/edge-router-runtime
    paths:
      - '.github/workflows/terminus-edge-router-controller-readonly.yml'

permissions:
  contents: read

env:
  TASK_ID: edge-router-runtime
  CONTROL_PLANE_COMMIT: fa2a409e86c4676bd3039df3e4e8339708454fad

jobs:
  materialize-controller-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Rule Resolution invocation
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "CREATION_REQUEST": "Create a production-grade real-time non-Python HTTP edge-routing and traffic-management task in Go.",
              "REQUESTED_DOMAIN": "production Go HTTP edge-routing and traffic-management runtime",
              "REQUESTED_PROFILE": "large_system_strict",
              "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image"
          }
          json.dump(payload, open('/tmp/rule-inputs.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$GITHUB_SHA" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/rule-inputs.json \
            --output /tmp/rule-next.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/rule-next.json', encoding='utf-8'))
          invocation = payload.get('invocation')
          if not isinstance(invocation, dict):
              raise SystemExit('controller did not produce an invocation')
          if invocation.get('stage', {}).get('stage_id') != 'RULE_RESOLUTION':
              raise SystemExit('expected RULE_RESOLUTION')
          if invocation.get('readiness') != 'READY':
              raise SystemExit('RULE_RESOLUTION is not READY')
          json.dump(invocation, open('/tmp/rule-invocation.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY

      - name: Record Rule Resolution locally through canonical recorder
        run: |
          python3 - <<'PY'
          import json, os
          invocation = json.load(open('/tmp/rule-invocation.json', encoding='utf-8'))
          cp = os.environ['CONTROL_PLANE_COMMIT']
          result = {
              "schema_version": "1.0",
              "invocation_id": invocation["invocation_id"],
              "output_task_commit": os.environ["GITHUB_SHA"],
              "status": "RULES_RESOLVED",
              "outputs": {
                  "CONTROL_PLANE_COMMIT": cp,
                  "RULE_SOURCES": [
                      "TERMINUS_3_AI_INSTRUCTIONS.md",
                      ".terminus/AGENT_SYSTEM.md",
                      ".terminus/agents/CREATION_CONTROLLER.md",
                      ".terminus/agents/CREATION_PIPELINE.md",
                      ".terminus/agents/PRODUCTION_AUTHENTICITY.md",
                      ".terminus/reviewers/REVIEWER_CHECKLIST.md",
                      ".terminus/agents/stage_contracts.json"
                  ],
                  "ACTIVE_VALIDATORS": [
                      ".terminus/validate_agent_system.py",
                      ".terminus/validate_stage_contracts.py",
                      ".terminus/validate_task_complexity.py",
                      ".terminus/validate_runtime_authenticity.py",
                      ".terminus/validate_review_freshness.py",
                      ".terminus/validate_quality_interlock.py",
                      "Terminus Edition 3 CI",
                      "Terminus Creator Complexity Gate",
                      "Terminus Production Authenticity Gate"
                  ],
                  "CREATION_PROFILE": "large_system_strict",
                  "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image",
                  "KNOWN_POLICY_CONFLICTS": []
              },
              "evidence_refs": [{"kind": "COMMIT", "ref": "commit:" + cp}]
          }
          json.dump(result, open('/tmp/rule-result.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py record \
            --invocation /tmp/rule-invocation.json \
            --result /tmp/rule-result.json \
            --output /tmp/rule-record-response.json

      - name: Build bounded A1 invocation from recorded state
        run: |
          python3 - <<'PY'
          import json, os
          cp = os.environ['CONTROL_PLANE_COMMIT']
          context = {
              "CONTROL_PLANE_COMMIT": cp,
              "RULE_SOURCES": [
                  "TERMINUS_3_AI_INSTRUCTIONS.md",
                  ".terminus/AGENT_SYSTEM.md",
                  ".terminus/agents/CREATION_CONTROLLER.md",
                  ".terminus/agents/CREATION_PIPELINE.md",
                  ".terminus/agents/PRODUCTION_AUTHENTICITY.md",
                  ".terminus/reviewers/REVIEWER_CHECKLIST.md",
                  ".terminus/agents/stage_contracts.json"
              ],
              "ACTIVE_VALIDATORS": [
                  ".terminus/validate_agent_system.py",
                  ".terminus/validate_stage_contracts.py",
                  ".terminus/validate_task_complexity.py",
                  ".terminus/validate_runtime_authenticity.py",
                  ".terminus/validate_review_freshness.py",
                  ".terminus/validate_quality_interlock.py",
                  "Terminus Edition 3 CI",
                  "Terminus Creator Complexity Gate",
                  "Terminus Production Authenticity Gate"
              ],
              "CREATION_PROFILE": "large_system_strict",
              "NETWORK_ENVIRONMENT_CONSTRAINTS": "network_mode public; separate verifier; digest-pinned canonical Go runtime; no privileged Docker/capability/socket shortcuts; tmux and asciinema required in agent image",
              "KNOWN_POLICY_CONFLICTS": []
          }
          inputs = {
              "CREATION_RULE_CONTEXT": context,
              "REQUESTED_DOMAIN": "production Go HTTP edge-routing and traffic-management runtime"
          }
          json.dump(inputs, open('/tmp/a1-inputs.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          python3 .terminus/execution/controller_cli.py continue \
            --task-id "$TASK_ID" \
            --task-commit "$GITHUB_SHA" \
            --control-plane-commit "$CONTROL_PLANE_COMMIT" \
            --inputs-json /tmp/a1-inputs.json \
            --output /tmp/a1-next.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/a1-next.json', encoding='utf-8'))
          invocation = payload.get('invocation')
          if not isinstance(invocation, dict):
              raise SystemExit('controller did not produce A1 invocation')
          if invocation.get('stage', {}).get('stage_id') != 'WORK_PACKAGE_RESEARCH':
              raise SystemExit('expected WORK_PACKAGE_RESEARCH')
          if invocation.get('readiness') != 'READY':
              raise SystemExit('WORK_PACKAGE_RESEARCH is not READY')
          json.dump(invocation, open('/tmp/a1-invocation.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print('A1 invocation:', invocation['invocation_id'])
          PY

      - name: Stage generated evidence for artifact
        run: |
          mkdir -p /tmp/controller-artifact
          cp /tmp/rule-inputs.json /tmp/controller-artifact/
          cp /tmp/rule-next.json /tmp/controller-artifact/
          cp /tmp/rule-invocation.json /tmp/controller-artifact/
          cp /tmp/rule-result.json /tmp/controller-artifact/
          cp /tmp/rule-record-response.json /tmp/controller-artifact/
          cp /tmp/a1-inputs.json /tmp/controller-artifact/
          cp /tmp/a1-next.json /tmp/controller-artifact/
          cp /tmp/a1-invocation.json /tmp/controller-artifact/
          cp -R .terminus/executions/edge-router-runtime /tmp/controller-artifact/executions

      - name: Upload generated controller evidence
        uses: actions/upload-artifact@v4
        with:
          name: edge-router-controller-readonly
          path: /tmp/controller-artifact
          retention-days: 7
