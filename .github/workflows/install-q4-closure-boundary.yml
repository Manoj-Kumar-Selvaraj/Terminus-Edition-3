name: Install Q4 closure boundary

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - .github/workflows/install-q4-closure-boundary.yml
      - .terminus/install_q4_closure_redesign.py

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0

      - name: Verify exact blocked candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "bb2e042c45873da3f3d78836d915ddb6446debf2"
          test -f .terminus/reviews/cobol-comp3-python-equiv/bb2e042c/cobol-comp3-python-equiv-bb2e042c-spec-test-contract-852fc1b28a.json
          test -f .terminus/reviews/cobol-comp3-python-equiv/59dcf214/cobol-comp3-python-equiv-59dcf214-adjudication-516e0ca6b1.json
          test "$(git status --porcelain -- cobol-comp3-python-equiv)" = ""

      - name: Capture existing Q4 Q6 role contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/role-hashes-before
          from pathlib import Path
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / '.terminus'))
          from review_contract import role_contract_hash
          print('Q4=' + role_contract_hash(root, 'Spec-Test Contract Reviewer'))
          print('Q6=' + role_contract_hash(root, 'Production Logic Auditor'))
          PY
          cat /tmp/role-hashes-before

      - name: Apply redesign in runner
        shell: bash
        run: |
          set -euo pipefail
          python .terminus/install_q4_closure_redesign.py
          python -m py_compile .terminus/q4_closure.py .terminus/new_q4_closure_packet.py
          git diff --check
          if git diff --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: task scope changed during control-plane redesign' >&2
            exit 1
          fi

      - name: Prove ordinary Q4 Q6 role contracts unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/role-hashes-after
          from pathlib import Path
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / '.terminus'))
          from review_contract import role_contract_hash
          print('Q4=' + role_contract_hash(root, 'Spec-Test Contract Reviewer'))
          print('Q6=' + role_contract_hash(root, 'Production Logic Auditor'))
          PY
          cat /tmp/role-hashes-after
          diff -u /tmp/role-hashes-before /tmp/role-hashes-after

      - name: Run control-plane regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            .terminus/tests/test_q4_closure.py \
            .terminus/tests/test_quality_agent_system.py \
            .terminus/tests/test_stage_acceptance_projection.py \
            .terminus/tests/test_acceptance_projection_integrity.py \
            .terminus/tests/test_execution_record.py
          python .terminus/validate_agent_system.py
          python .terminus/validate_stage_contracts.py
          python .terminus/validate_execution_record_pass_b.py
          test "$(git log -1 --format=%H -- cobol-comp3-python-equiv)" = "bb2e042c45873da3f3d78836d915ddb6446debf2"

      - name: Commit validated redesign and remove installer
        shell: bash
        run: |
          set -euo pipefail
          rm .terminus/install_q4_closure_redesign.py
          rm .github/workflows/install-q4-closure-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .terminus .github/workflows/install-q4-closure-boundary.yml
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^cobol-comp3-python-equiv/'; then
            echo 'ERROR: task scope staged unexpectedly' >&2
            exit 1
          fi
          git commit -m 'control: add adjudicated Q4 closure boundary'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
