          text = path.read_text()
          marker = '''# ---------------------------------------------------------------------------\n# P2P: stable interfaces not implicated by the incident\n# ---------------------------------------------------------------------------\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one P2P marker, found {text.count(marker)}')

