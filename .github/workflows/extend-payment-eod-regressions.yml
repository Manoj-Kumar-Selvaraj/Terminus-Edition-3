name: Extend payment EOD regression coverage

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add missing requirement regression cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

