name: Terminus Creator Complexity Gate

on:
  pull_request:
    paths:
      - "**/.ci-validation-trigger"
      - "**/environment/**"
      - "**/tests/**"
      - ".terminus/designs/**"
      - ".terminus/maintenance/**"
      - ".terminus/validate_task_complexity.py"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_PROMPTS.md"
  push:
    branches: [main]
    paths:
      - "**/environment/**"
      - "**/tests/**"
      - ".terminus/designs/**"
      - ".terminus/validate_task_complexity.py"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_PROMPTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-system-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all large-system task designs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .terminus/validate_task_complexity.py

          found=0
          shopt -s nullglob
          for manifest in .terminus/designs/*.json; do
            task="$(basename "$manifest" .json)"
            [[ "$task" == *-test-map ]] && continue
            [[ -f "$task/task.toml" ]] || continue
            profile="$(python3 - "$manifest" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding='utf-8')).get('profile', ''))
          PY
          )"
            [[ "$profile" == "large_system" ]] || continue
            found=1
            echo "==> large-system complexity gate: $task"
            python3 .terminus/validate_task_complexity.py "$task"
          done

          if (( found == 0 )); then
            echo "No large_system task manifests found."
          fi

  payment-eod-coverage-maintenance:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/payment-eod-coverage-maint'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply pending payment EOD coverage maintenance
        shell: bash
        run: |
          set -euo pipefail
          script=.terminus/maintenance/extend_payment_eod_regressions.py
          if [[ ! -f "$script" ]]; then
            echo "No pending payment EOD coverage maintenance."
            exit 0
          fi

          python3 "$script"
          python3 .terminus/validate_task_complexity.py payment-eod-control-chain
          python3 -m pip install --quiet ruff==0.12.8
          ruff check payment-eod-control-chain/tests

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$script"
          if [[ -f .github/workflows/extend-payment-eod-regressions.yml ]]; then
            git rm .github/workflows/extend-payment-eod-regressions.yml
          fi
          git add payment-eod-control-chain/tests/test_outputs.py \
                  .terminus/designs/payment-eod-control-chain-test-map.json \
                  .terminus/designs/payment-eod-control-chain.json
          git diff --cached --check
          git commit -m "Complete payment EOD verifier requirement coverage"
          git push origin HEAD:main
