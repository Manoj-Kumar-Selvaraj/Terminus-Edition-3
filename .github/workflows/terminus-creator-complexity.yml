name: Terminus Creator Complexity Gate

on:
  workflow_dispatch:
    inputs:
      task:
        description: Optional top-level task to validate after regression tests
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  large-system-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned complexity test tools
        run: python3 -m pip install --quiet pytest==8.4.1
      - name: Complexity gate regression suite
        run: |
          python3 -m pytest \
            .terminus/tests/test_task_complexity.py \
            .terminus/tests/test_defect_topology.py \
            .terminus/tests/test_environment_complexity.py \
            -q
      - name: Validate requested task only
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          [[ -n "$TASK" ]] || { echo 'No task requested; regression suite only.'; exit 0; }
          [[ "$TASK" != /* && "$TASK" != *".."* && "$TASK" != */* ]] || {
            echo '::error::task must be one safe top-level directory'; exit 1;
          }
          [[ -f "$TASK/task.toml" ]] || { echo "::error::No task.toml for $TASK"; exit 1; }
          manifest=".terminus/designs/$TASK.json"
          [[ -f "$manifest" ]] || { echo "::error::No design manifest for $TASK"; exit 1; }
          profile="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])) .get("profile", ""))' "$manifest")"
          case "$profile" in
            large_system|large_system_strict)
              python3 .terminus/validate_task_complexity.py "$TASK"
              ;;
            *)
              echo "Task $TASK does not declare a large-system profile; no complexity gate applies."
              ;;
          esac
