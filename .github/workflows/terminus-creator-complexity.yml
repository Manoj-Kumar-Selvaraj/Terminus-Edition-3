name: Terminus Creator Complexity Gate
# A2 ENVIRONMENT_BUILD exact-validator trigger; validation branch only.

on:
  pull_request:
    paths:
      - "**/.ci-validation-trigger"
      - "**/environment/**"
      - "**/tests/**"
      - ".terminus/designs/**"
      - ".terminus/validate_task_complexity.py"
      - ".terminus/tests/test_task_complexity.py"
      - ".terminus/agents/CREATION_CONTROLLER.md"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_AGENT_REGISTRY.md"
      - ".terminus/agents/CREATOR_PROMPTS.md"
      - ".github/workflows/terminus-creator-complexity.yml"
  push:
    branches: [main]
    paths:
      - "**/environment/**"
      - "**/tests/**"
      - ".terminus/designs/**"
      - ".terminus/validate_task_complexity.py"
      - ".terminus/tests/test_task_complexity.py"
      - ".terminus/agents/CREATION_CONTROLLER.md"
      - ".terminus/agents/CREATION_PIPELINE.md"
      - ".terminus/agents/CREATOR_AGENT_REGISTRY.md"
      - ".terminus/agents/CREATOR_PROMPTS.md"
      - ".github/workflows/terminus-creator-complexity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-system-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned complexity test tools
        run: python3 -m pip install --quiet pytest==8.4.1

      - name: Complexity gate regression suite
        run: python3 -m pytest .terminus/tests/test_task_complexity.py -q

      - name: Validate all declared large-system profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .terminus/validate_task_complexity.py

          found=0
          shopt -s nullglob
          for manifest in .terminus/designs/*.json; do
            task="$(basename "$manifest" .json)"
            [[ "$task" == *-test-map ]] && continue
            [[ -f "$task/task.toml" ]] || continue
            profile="$(python3 - "$manifest" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding='utf-8')).get('profile', ''))
          PY
          )"
            case "$profile" in
              large_system|large_system_strict)
                found=1
                echo "==> creator complexity gate: $task ($profile)"
                python3 .terminus/validate_task_complexity.py "$task"
                ;;
            esac
          done

          if (( found == 0 )); then
            echo "No large-system task manifests found."
          fi
