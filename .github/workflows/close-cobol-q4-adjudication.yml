name: Close COBOL Q4 adjudication
on:
  push:
    paths:
      - '.github/workflows/close-cobol-q4-adjudication.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply adjudicated closure and validate Oracle/NOP
        shell: bash
        run: |
          set -euo pipefail
          TASK='cobol-comp3-python-equiv'
          EXPECTED='9ce15848421135eaa83c356c26a0661ec795532f'
          WORKFLOW='.github/workflows/close-cobol-q4-adjudication.yml'
          actual="$(git log -1 --format=%H -- "$TASK")"
          echo "Git-derived task commit before repair: $actual"
          [[ "$actual" == "$EXPECTED" ]] || { echo "::error::STALE task commit"; exit 1; }

          python3 <<'PY'
          from pathlib import Path
          import re

          task = Path('cobol-comp3-python-equiv')
          instruction_path = task / 'instruction.md'
          tests_path = task / 'tests' / 'test_outputs.py'
          fixed_operations_path = task / 'solution' / 'fixed' / 'operations.py'

          instruction = instruction_path.read_text(encoding='utf-8')
          replacements = {
              '- Validate movement shape, reason/type compatibility, item status/policy, warehouse status/capability, available quantity, and weighted inventory valuation before accepting a movement.':
              '- Validate movement shape, reason/type compatibility, item status/policy, warehouse status/capability, available quantity, and weighted inventory valuation before accepting a movement. Reason/type compatibility is normative: `PO` and `RETURN` are valid for `RECEIPT`; `SALE` for `ISSUE`; `MOVE` for `TRANSFER`; `COUNT`, `DAMAGE`, and `RETURN` for `ADJUSTMENT`; other combinations are invalid.',
              '- Reconciliation must block publication when any documented legacy control, transfer-balance safety control, or detailed settlement invariant fails.':
              '- Reconciliation must block publication when any documented legacy control, transfer-balance safety control, or detailed settlement invariant fails. Detailed settlement requires every accepted movement to have at least one inventory effect, forbids duplicate effects of the same effect kind for one movement, and forbids inventory positions with negative quantity or value below `-0.01`; transfer effects also remain subject to the documented zero-net quantity/value safety rule.',
              '- `preflight` must consume the real source/layout, schema health, catalog, input integrity, and historical production baseline rather than treating seeded history as decorative data.':
              '- `preflight` must consume the real source/layout, schema health, catalog, input integrity, historical production baseline, and recovery state rather than treating them as decorative data. An empty active item/warehouse catalog or a recovery state that cannot safely continue is not a passing preflight.',
              '- `archive` must verify reports/publication, export controls and deltas, bind lineage/integrity evidence, write a verified archive, and record the archive event.':
              '- `archive` must verify reports/publication, export controls and deltas, bind lineage/integrity evidence, write a verified archive, and record the archive event. Retention reporting covers report, publication, audit, and quarantine evidence with positive day horizons, and archiving must not delete or mutate the live report/publication set.',
          }
          for old, new in replacements.items():
              if old not in instruction:
                  raise SystemExit(f'missing instruction anchor: {old}')
              instruction = instruction.replace(old, new, 1)
          instruction_path.write_text(instruction, encoding='utf-8')

          tests = tests_path.read_text(encoding='utf-8')

          def replace_func(text: str, name: str, body: str) -> str:
              pattern = re.compile(rf'(?ms)^def {re.escape(name)}\(.*?(?=^def |\Z)')
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'cannot locate function {name}')
              return text[:match.start()] + body.rstrip() + '\n\n' + text[match.end():]

          helper_block = r'''
          def write_alternate_layout(tmp_path: Path) -> Path:
              alternate = json.loads(DEFAULT_LAYOUT.read_text(encoding="utf-8"))
              alternate["layout_id"] = "ALT-CALLER-LAYOUT"
              alternate["version"] = 91
              alternate["fields"].append({"name": "CALLER-TRAILER", "picture": "X(1)"})
              path = tmp_path / "alternate-layout.json"
              path.write_text(json.dumps(alternate), encoding="utf-8")
              return path


          def visible_generation_dirs(root: Path) -> list[Path]:
              if not root.exists():
                  return []
              return sorted(
                  path for path in root.iterdir()
                  if path.is_dir() and not path.name.startswith(".")
              )


          def nested_mappings(value: object):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from nested_mappings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from nested_mappings(child)


          def find_publication_manifest(target: Path, generation_id_value: str) -> Path:
              files = [path for path in target.iterdir() if path.is_file()]
              digests = {path: file_digest(path) for path in files}
              for candidate in files:
                  if candidate.suffix.lower() != ".json":
                      continue
                  try:
                      payload = json.loads(candidate.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  rendered = json.dumps(payload, sort_keys=True, default=str)
                  if generation_id_value not in rendered:
                      continue
                  if any(
                      digest in rendered
                      for path, digest in digests.items()
                      if path != candidate
                  ):
                      return candidate
              pytest.fail("publication lacks independently discoverable generation/integrity manifest")


          def persisted_reject_code(
              tmp_path: Path,
              raw: bytes,
              prepare: Callable[[sqlite3.Connection], None] | None = None,
          ) -> str:
              db = fresh_db(tmp_path)
              seed_inventory(db, warehouse_count=2, item_count=2)
              if prepare is not None:
                  prepare(db)
              db.commit()
              db.close()
              db_path = tmp_path / "state.db"
              source = tmp_path / "source.dat"
              source.write_bytes(raw)
              controls = tmp_path / "legacy.controls"
              write_controls(
                  controls,
                  processed="1",
                  accepted="0",
                  rejected="1",
                  effects="0",
                  quantity="0",
                  value="0",
              )
              report_dir = tmp_path / "ops" / "reports"
              result = cli(
                  "run",
                  *run_arguments(
                      db_path,
                      source,
                      DEFAULT_LAYOUT,
                      controls,
                      report_dir,
                      tmp_path / "published",
                  ),
              )
              assert result.returncode == 0
              db = connect(db_path)
              row = db.execute("SELECT code FROM rejects ORDER BY id").fetchone()
              db.close()
              assert row is not None
              persisted = str(row[0])
              csv_blob = "\n".join(
                  path.read_text(encoding="utf-8")
                  for path in report_dir.rglob("*.csv")
              )
              assert persisted in csv_blob
              return persisted


          def assert_publication_contract(
              target: Path,
              generation_id_value: str,
              expected_files: dict[str, Path],
          ) -> None:
              assert target.is_dir()
              manifest = find_publication_manifest(target, generation_id_value)
              manifest_text = manifest.read_text(encoding="utf-8")
              assert generation_id_value in manifest_text
              published_files = [
                  path for path in target.iterdir()
                  if path.is_file() and path != manifest
              ]
              for source in expected_files.values():
                  assert any(path.read_bytes() == source.read_bytes() for path in published_files)
                  assert file_digest(source) in manifest_text
          '''
          tests = replace_func(tests, 'assert_publication_contract', helper_block)

          tests = replace_func(tests, 'test_f2p_caller_supplied_layout_path_is_honored', r'''
          def test_f2p_caller_supplied_layout_path_is_honored(tmp_path: Path) -> None:
              layout_path = write_alternate_layout(tmp_path)
              db = fresh_db(tmp_path)
              seed_inventory(db, warehouse_count=2, item_count=2)
              apply_sql(db, SEED)
              db.close()
              db_path = tmp_path / "state.db"
              source = tmp_path / "caller-source.dat"
              source.write_bytes(reference_receipt_record() + b"Z")
              second_source = tmp_path / "caller-source-2.dat"
              second_source.write_bytes(reference_record(movement_id="MOVE00000002") + b"Z")
              controls = tmp_path / "legacy.controls"
              write_controls(controls)
              report_dir = tmp_path / "ops" / "reports"
              publish_dir = tmp_path / "published"

              described = cli("describe-layout", "--layout", layout_path)
              baseline_description = cli("describe-layout", "--layout", DEFAULT_LAYOUT)
              assert described.returncode == baseline_description.returncode == 0
              assert parse_stdout(described) != parse_stdout(baseline_description)

              identified = cli(
                  "identity",
                  "--source", source,
                  "--layout", layout_path,
                  "--business-date", "20260815",
              )
              other_layout = cli(
                  "identity",
                  "--source", source,
                  "--layout", DEFAULT_LAYOUT,
                  "--business-date", "20260815",
              )
              other_source = cli(
                  "identity",
                  "--source", second_source,
                  "--layout", layout_path,
                  "--business-date", "20260815",
              )
              assert identified.returncode == other_layout.returncode == other_source.returncode == 0
              assert parse_stdout(identified) != parse_stdout(other_layout)
              assert parse_stdout(identified) != parse_stdout(other_source)

              preflight = cli(
                  "preflight",
                  *run_arguments(db_path, source, layout_path, controls, report_dir, publish_dir),
                  "--schema", SCHEMA,
                  "--seed", SEED,
              )
              assert preflight.returncode == 0
              assert parse_stdout(preflight).get("passed") is True

              empty_catalog_db = tmp_path / "empty-catalog.db"
              shutil.copyfile(db_path, empty_catalog_db)
              catalog_db = connect(empty_catalog_db)
              catalog_db.execute("DELETE FROM inventory_positions")
              catalog_db.execute("DELETE FROM items")
              catalog_db.execute("DELETE FROM warehouses")
              catalog_db.commit()
              catalog_db.close()
              unhealthy_catalog = cli(
                  "preflight",
                  *run_arguments(
                      empty_catalog_db, source, layout_path, controls, report_dir, publish_dir
                  ),
                  "--schema", SCHEMA,
                  "--seed", SEED,
              )
              assert unhealthy_catalog.returncode == 2
              assert parse_stdout(unhealthy_catalog).get("passed") is False

              blocked_recovery_db = tmp_path / "blocked-recovery.db"
              shutil.copyfile(db_path, blocked_recovery_db)
              recovery_db = connect(blocked_recovery_db)
              gid = build_identity(source, layout_path, "20260815").generation_id
              recovery_db.execute(
                  "INSERT INTO runs(generation_id,state) VALUES(?,?)",
                  (gid, "PROCESSING"),
              )
              recovery_db.execute(
                  "INSERT INTO checkpoints"
                  "(generation_id,last_sequence,byte_offset,source_fingerprint,updated_at)"
                  " VALUES(?,?,?,?,?)",
                  (gid, 1, 0, "mismatched:fingerprint", "now"),
              )
              recovery_db.commit()
              recovery_db.close()
              blocked_recovery = cli(
                  "preflight",
                  *run_arguments(
                      blocked_recovery_db, source, layout_path, controls, report_dir, publish_dir
                  ),
                  "--schema", SCHEMA,
                  "--seed", SEED,
              )
              assert blocked_recovery.returncode == 2
              assert parse_stdout(blocked_recovery).get("passed") is False

              missing_layout = cli("describe-layout", "--layout", tmp_path / "missing-layout.json")
              assert missing_layout.returncode == 2
              assert missing_layout.stdout == ""
              assert isinstance(parse_stderr(missing_layout).get("error"), dict)

              run = cli(
                  "run",
                  *run_arguments(db_path, source, layout_path, controls, report_dir, publish_dir),
              )
              assert run.returncode == 0
              run_db = connect(db_path)
              assert run_db.execute("SELECT COUNT(*) FROM processed_movements").fetchone()[0] == 1
              run_db.close()
              assert len(visible_generation_dirs(publish_dir)) == 1
          ''')

          tests = replace_func(tests, 'test_f2p_pipeline_restart_does_not_reapply_last_movement', r'''
          def test_f2p_pipeline_restart_does_not_reapply_last_movement(tmp_path: Path) -> None:
              db = fresh_db(tmp_path)
              seed_inventory(db, warehouse_count=2, item_count=2)
              source = tmp_path / "source.dat"
              source.write_bytes(reference_receipt_record())
              controls = tmp_path / "legacy.controls"
              write_controls(controls)
              publish_root = tmp_path / "published"
              cfg = PipelineConfig(
                  source,
                  DEFAULT_LAYOUT,
                  "20260815",
                  controls,
                  tmp_path / "reports",
                  publish_root,
              )
              process(db, cfg)
              gid = db.execute("SELECT generation_id FROM runs").fetchone()[0]
              assert (publish_root / gid).is_dir()
              process(db, cfg)
              assert db.execute(
                  "SELECT COUNT(*) FROM processed_movements WHERE generation_id=?",
                  (gid,),
              ).fetchone()[0] == 1
              assert db.execute(
                  "SELECT COUNT(*) FROM inventory_effects WHERE generation_id=?",
                  (gid,),
              ).fetchone()[0] == 1
              assert (publish_root / gid).is_dir()
          ''')

          tests = replace_func(tests, 'test_f2p_zero_quantity_is_rejected', r'''
          def test_f2p_zero_quantity_is_rejected(tmp_path: Path) -> None:
              assert persisted_reject_code(
                  tmp_path,
                  reference_record(quantity="0.000"),
              ) == "QUANTITY"
              assert validate_shape(movement(reason="SALE"))
          ''')

          tests = replace_func(tests, 'test_f2p_same_warehouse_transfer_is_rejected', r'''
          def test_f2p_same_warehouse_transfer_is_rejected(tmp_path: Path) -> None:
              assert persisted_reject_code(
                  tmp_path,
                  reference_record(
                      type_code="T",
                      source="W01",
                      destination="W01",
                      reason="MOVE",
                  ),
              ) == "TRANSFER_LOOP"
          ''')

          tests = replace_func(tests, 'test_f2p_inactive_item_is_rejected', r'''
          def test_f2p_inactive_item_is_rejected(tmp_path: Path) -> None:
              def disable_item(db: sqlite3.Connection) -> None:
                  db.execute("UPDATE items SET active=0 WHERE item_id='SKU00001'")

              assert persisted_reject_code(
                  tmp_path,
                  reference_receipt_record(),
                  disable_item,
              ) == "ITEM_INACTIVE"
          ''')

          tests = replace_func(tests, 'test_f2p_inactive_warehouse_is_rejected', r'''
          def test_f2p_inactive_warehouse_is_rejected(tmp_path: Path) -> None:
              def disable_warehouse(db: sqlite3.Connection) -> None:
                  db.execute("UPDATE warehouses SET active=0 WHERE warehouse_id='W01'")

              assert persisted_reject_code(
                  tmp_path,
                  reference_receipt_record(),
                  disable_warehouse,
              ) == "WAREHOUSE_INACTIVE"

              receipt_disabled = WarehousePolicy("W01", True, allow_receipts=False)
              assert validate_warehouses(
                  movement(),
                  {"W01": receipt_disabled},
              )
              transfer = movement(
                  movement_type=MovementType.TRANSFER,
                  source="W01",
                  destination="W02",
                  reason="MOVE",
              )
              transfer_policies = {
                  "W01": WarehousePolicy("W01", True, allow_transfers=False),
                  "W02": WarehousePolicy("W02", True),
              }
              assert validate_warehouses(transfer, transfer_policies)
          ''')

          # Remove private pipeline-state grading while preserving the stable reject assertion.
          private_state = '    summary = process(\n        db,\n        PipelineConfig(\n            source,\n            DEFAULT_LAYOUT,\n            "20260815",\n            controls,\n            tmp_path / "reports",\n            tmp_path / "published",\n        ),\n    )\n    assert summary.state.value == "HELD"\n'
          replacement_state = '    process(\n        db,\n        PipelineConfig(\n            source,\n            DEFAULT_LAYOUT,\n            "20260815",\n            controls,\n            tmp_path / "reports",\n            tmp_path / "published",\n        ),\n    )\n'
          if private_state not in tests:
              raise SystemExit('private HELD state anchor not found')
          tests = tests.replace(private_state, replacement_state, 1)

          tests = replace_func(tests, 'test_f2p_failed_reconciliation_cannot_publish', r'''
          def test_f2p_failed_reconciliation_cannot_publish(tmp_path: Path) -> None:
              mismatch_root = tmp_path / "legacy-mismatch"
              mismatch_root.mkdir()
              db = fresh_db(mismatch_root)
              seed_inventory(db, warehouse_count=2, item_count=2)
              db.close()
              source = mismatch_root / "source.dat"
              source.write_bytes(reference_receipt_record())
              controls = mismatch_root / "legacy.controls"
              write_controls(controls, effects="2")
              report_dir = mismatch_root / "ops" / "reports"
              publish_dir = mismatch_root / "published"
              result = cli(
                  "run",
                  *run_arguments(
                      mismatch_root / "state.db",
                      source,
                      DEFAULT_LAYOUT,
                      controls,
                      report_dir,
                      publish_dir,
                  ),
              )
              assert result.returncode == 2
              assert visible_generation_dirs(publish_dir) == []
              mismatch_db = connect(mismatch_root / "state.db")
              gid = mismatch_db.execute("SELECT generation_id FROM runs").fetchone()[0]
              mismatch_db.close()
              assert all(
                  gid not in path.read_text(encoding="utf-8")
                  for path in mismatch_root.rglob("*.jsonl")
              )

              detail_root = tmp_path / "detail-mismatch"
              detail_root.mkdir()
              detail_db = fresh_db(detail_root)
              seed_inventory(detail_db, warehouse_count=2, item_count=2)
              detail_db.execute(
                  "CREATE TRIGGER delete_effect_after_insert "
                  "AFTER INSERT ON inventory_effects BEGIN "
                  "DELETE FROM inventory_effects WHERE id=NEW.id; END"
              )
              detail_db.commit()
              detail_db.close()
              detail_source = detail_root / "source.dat"
              detail_source.write_bytes(reference_receipt_record())
              detail_controls = detail_root / "legacy.controls"
              write_controls(
                  detail_controls,
                  processed="1",
                  accepted="1",
                  rejected="0",
                  effects="0",
                  quantity="0",
                  value="0",
              )
              detail_publish = detail_root / "published"
              detailed = cli(
                  "run",
                  *run_arguments(
                      detail_root / "state.db",
                      detail_source,
                      DEFAULT_LAYOUT,
                      detail_controls,
                      detail_root / "ops" / "reports",
                      detail_publish,
                  ),
              )
              assert detailed.returncode == 2
              assert visible_generation_dirs(detail_publish) == []
              detail_db = connect(detail_root / "state.db")
              detail_gid = detail_db.execute("SELECT generation_id FROM runs").fetchone()[0]
              assert detail_db.execute(
                  "SELECT COUNT(*) FROM processed_movements "
                  "WHERE generation_id=? AND status='ACCEPTED'",
                  (detail_gid,),
              ).fetchone()[0] == 1
              assert detail_db.execute(
                  "SELECT COUNT(*) FROM inventory_effects WHERE generation_id=?",
                  (detail_gid,),
              ).fetchone()[0] == 0
              detail_db.close()
          ''')

          tests = replace_func(tests, 'test_f2p_repeat_publication_of_same_generation_is_idempotent', r'''
          def test_f2p_repeat_publication_of_same_generation_is_idempotent(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              report = tmp_path / "summary.json"
              extra = tmp_path / "effects.csv"
              report.write_text('{"ok":true}\n', encoding="utf-8")
              extra.write_text("movement_id\nM1\n", encoding="utf-8")
              files = {"summary": report, "effects": extra}
              destination = tmp_path / "published"

              first = atomic_publish("g", files, passing_reconciliation(), destination)
              assert_publication_contract(first, "g", files)
              second = atomic_publish("g", files, passing_reconciliation(), destination)
              assert second == first
              assert_publication_contract(second, "g", files)

              manifest = find_publication_manifest(first, "g")
              published_copy = next(
                  path for path in first.iterdir()
                  if path.is_file() and path != manifest and path.read_bytes() == report.read_bytes()
              )
              published_copy.write_text("corrupt\n", encoding="utf-8")
              must_reject(
                  lambda: atomic_publish(
                      "g",
                      files,
                      passing_reconciliation(),
                      destination,
                  )
              )

              atomic_destination = tmp_path / "atomic-published"
              atomic_target = atomic_destination / "g2"

              def fail_promotion(*args, **kwargs):
                  raise OSError("injected atomic promotion failure")

              monkeypatch.setattr("src.publication.os.replace", fail_promotion)
              must_reject(
                  lambda: atomic_publish(
                      "g2",
                      files,
                      passing_reconciliation("g2"),
                      atomic_destination,
                  )
              )
              assert not atomic_target.exists()
              assert visible_generation_dirs(atomic_destination) == []
          ''')

          tests = replace_func(tests, 'test_p2p_active_receipt_policy_remains_valid', r'''
          def test_p2p_active_receipt_policy_remains_valid() -> None:
              valid = [
                  movement(reason="PO"),
                  movement(reason="RETURN"),
                  movement(
                      movement_type=MovementType.ISSUE,
                      source="W01",
                      destination=None,
                      reason="SALE",
                  ),
                  movement(
                      movement_type=MovementType.TRANSFER,
                      source="W01",
                      destination="W02",
                      reason="MOVE",
                  ),
                  movement(
                      movement_type=MovementType.ADJUSTMENT,
                      source="W01",
                      destination=None,
                      reason="COUNT",
                  ),
                  movement(
                      movement_type=MovementType.ADJUSTMENT,
                      source="W01",
                      destination=None,
                      reason="DAMAGE",
                  ),
                  movement(
                      movement_type=MovementType.ADJUSTMENT,
                      source="W01",
                      destination=None,
                      reason="RETURN",
                  ),
              ]
              assert all(validate_shape(candidate) == [] for candidate in valid)

              invalid = [
                  movement(reason="SALE"),
                  movement(
                      movement_type=MovementType.ISSUE,
                      source="W01",
                      destination=None,
                      reason="PO",
                  ),
                  movement(
                      movement_type=MovementType.TRANSFER,
                      source="W01",
                      destination="W02",
                      reason="RETURN",
                  ),
                  movement(
                      movement_type=MovementType.ADJUSTMENT,
                      source="W01",
                      destination=None,
                      reason="PO",
                  ),
              ]
              assert all(validate_shape(candidate) for candidate in invalid)

              m = movement()
              assert validate_item(m, ItemPolicy("SKU00001", True)) == []
              assert validate_warehouses(m, {"W01": WarehousePolicy("W01", True)}) == []
          ''')

          tests = replace_func(tests, 'test_p2p_cli_success_and_failure_json_contract', r'''
          def test_p2p_cli_success_and_failure_json_contract(tmp_path: Path) -> None:
              described = cli("describe-layout", "--layout", DEFAULT_LAYOUT)
              assert described.returncode == 0
              assert described.stderr == ""
              default_payload = parse_stdout(described)

              alternate_layout = write_alternate_layout(tmp_path)
              alternate = cli("describe-layout", "--layout", alternate_layout)
              assert alternate.returncode == 0
              assert parse_stdout(alternate) != default_payload

              source = tmp_path / "source.dat"
              other_source = tmp_path / "other-source.dat"
              source.write_bytes(reference_receipt_record())
              other_source.write_bytes(reference_record(movement_id="MOVE00000002"))
              identified = cli(
                  "identity",
                  "--source", source,
                  "--layout", DEFAULT_LAYOUT,
                  "--business-date", "20260815",
              )
              identified_other = cli(
                  "identity",
                  "--source", other_source,
                  "--layout", DEFAULT_LAYOUT,
                  "--business-date", "20260815",
              )
              assert identified.returncode == identified_other.returncode == 0
              assert parse_stdout(identified) != parse_stdout(identified_other)

              init_db_path = tmp_path / "initialized.db"
              initialized = cli(
                  "init-db",
                  "--db", init_db_path,
                  "--schema", SCHEMA,
                  "--seed", SEED,
              )
              assert initialized.returncode == 0
              assert initialized.stderr == ""
              parse_stdout(initialized)
              db = connect(init_db_path)
              tables = {
                  row[0]
                  for row in db.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              db.close()
              assert {"processed_movements", "rejects", "checkpoints"} <= tables
          ''')

          tests = replace_func(tests, 'test_p2p_preflight_uses_historical_baseline', r'''
          def test_p2p_preflight_uses_historical_baseline(tmp_path: Path) -> None:
              db = fresh_db(tmp_path)
              seed_inventory(db, warehouse_count=2, item_count=2)
              apply_sql(db, SEED)
              db.close()
              db_path = tmp_path / "state.db"
              source = tmp_path / "source.dat"
              source.write_bytes(reference_receipt_record())
              controls = tmp_path / "legacy.controls"
              write_controls(controls)
              report_dir = tmp_path / "ops" / "reports"
              publish_dir = tmp_path / "published"

              first = cli(
                  "preflight",
                  *run_arguments(
                      db_path, source, DEFAULT_LAYOUT, controls, report_dir, publish_dir
                  ),
