name: Chat Inline Stage Adapter

on:
  push:
    branches:
      - 'terminus-controller-request/**'
    paths:
      - '.terminus/chat-exec/*.json'

permissions:
  contents: write

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute chat stage transport
        run: python3 .github/chat_inline_stage_adapter.py
      - name: Upload adapter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-inline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-inline
          if-no-files-found: warn
