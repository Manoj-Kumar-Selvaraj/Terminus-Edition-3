name: Chat Inline Stage Adapter

on:
  push:
    branches:
      - 'terminus-controller-request/**'
    paths:
      - '.terminus/chat-exec/*.json'

permissions:
  contents: write

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist run locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .terminus/chat-run-locators
          printf '{"run_id":%s,"run_attempt":%s,"event_sha":"%s","branch":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF_NAME" > ".terminus/chat-run-locators/$GITHUB_SHA.json"
          git config user.name 'terminus-chat-adapter[bot]'
          git config user.email 'terminus-chat-adapter[bot]@users.noreply.github.com'
          git add -- ".terminus/chat-run-locators/$GITHUB_SHA.json"
          git commit -m "Persist chat run locator $GITHUB_RUN_ID"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Execute deterministic invocation probe
        run: python3 .github/ec2_deterministic_probe.py
