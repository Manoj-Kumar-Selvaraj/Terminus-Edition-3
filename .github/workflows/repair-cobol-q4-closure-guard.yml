name: Narrow COBOL Q4 closure guard
on:
  push:
    paths:
      - '.github/workflows/repair-cobol-q4-closure-guard.yml'
permissions:
  contents: write
jobs:
  repair-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove over-broad guard and self-clean
        shell: bash
        run: |
          set -euo pipefail
          TARGET='.github/workflows/close-cobol-q4-adjudication.yml'
          SELF='.github/workflows/repair-cobol-q4-closure-guard.yml'
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/close-cobol-q4-adjudication.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?ms)^          # Q4-006: only the documented passed/error envelopes may be structurally graded\.\n"
              r".*?^          tests_path\.write_text\(tests, encoding='utf-8'\)\n"
          )
          replacement = "          tests_path.write_text(tests, encoding='utf-8')\n"
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one guard block, replaced {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          rm -f "$SELF"
          git config user.name 'terminus-q4-guard-bot'
          git config user.email 'terminus-q4-guard-bot@users.noreply.github.com'
          git add "$TARGET" "$SELF"
          git diff --cached --check
          git commit -m 'Narrow COBOL Q4 closure safety guard'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
