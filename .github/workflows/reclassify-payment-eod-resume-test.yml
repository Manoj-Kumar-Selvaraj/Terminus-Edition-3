name: Reclassify payment EOD stable resume regression

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reclassify already-correct internal resume case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          test_path = Path('payment-eod-control-chain/tests/test_outputs.py')
          text = test_path.read_text()
          old = 'def test_f2p_resume_internal_keeps_the_existing_posting_without_reapplying_balances():'
          new = 'def test_p2p_resume_internal_keeps_the_existing_posting_without_reapplying_balances():'
          if text.count(old) != 1:
              raise SystemExit(f'expected one verifier function to rename, found {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1))

          map_path = Path('.terminus/designs/payment-eod-control-chain-test-map.json')
          data = json.loads(map_path.read_text())
          old_name = 'test_f2p_resume_internal_keeps_the_existing_posting_without_reapplying_balances'
          new_name = 'test_p2p_resume_internal_keeps_the_existing_posting_without_reapplying_balances'
          matches = 0
          for item in data['tests']:
              if item[0] == old_name:
                  item[0] = new_name
                  item[1] = 'P2P'
                  matches += 1
          if matches != 1:
              raise SystemExit(f'expected one test-map entry, found {matches}')
          data['empirical_status'] = 'RECLASSIFIED_PENDING_ORACLE_NOP_REVALIDATION'
          map_path.write_text(json.dumps(data, indent=2) + '\n')

          design_path = Path('.terminus/designs/payment-eod-control-chain.json')
          design = json.loads(design_path.read_text())
          design['status'] = 'deterministic_reclassification_pending_oracle_nop'
          design_path.write_text(json.dumps(design, indent=2) + '\n')
          PY

          python3 .terminus/validate_task_complexity.py payment-eod-control-chain
          python3 -m pip install --quiet ruff==0.12.8
          ruff check payment-eod-control-chain/tests

      - name: Commit clean reclassification and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reclassify-payment-eod-resume-test.yml
          git add payment-eod-control-chain/tests/test_outputs.py \
                  .terminus/designs/payment-eod-control-chain-test-map.json \
                  .terminus/designs/payment-eod-control-chain.json
          git diff --cached --check
          git commit -m "Reclassify stable payment EOD resume regression"
          git push origin HEAD:main
