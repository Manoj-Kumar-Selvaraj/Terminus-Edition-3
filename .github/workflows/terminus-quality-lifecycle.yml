name: Terminus Quality Lifecycle

on:
  workflow_dispatch:
    inputs:
      task:
        description: Top-level task directory
        required: true
        type: string
      stage:
        description: Current lifecycle quality stage
        required: true
        type: choice
        options:
          - QUALITY_INTERLOCK
          - MODEL_DIAGNOSTIC_GPT
          - MODEL_DIAGNOSTIC_CLAUDE
      publish_results:
        description: Persist generated packets/results and canonical stage record
        required: true
        default: true
        type: boolean
      execute_optional_q8:
        description: Explicitly execute the optional model-backed Q8 perspective; false records a deterministic no-budget skip
        required: true
        default: false
        type: boolean
      change:
        description: Optional change-since-last-review text recorded in generated packets
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      stage:
        required: true
        type: string
      publish_results:
        required: false
        default: true
        type: boolean
      execute_optional_q8:
        required: false
        default: false
        type: boolean
      change:
        required: false
        default: ""
        type: string
    secrets:
      CURSOR_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      STB_AI_API_KEY:
        required: false

permissions:
  contents: write

concurrency:
  group: terminus-quality-lifecycle-${{ github.repository }}-${{ github.ref }}-${{ inputs.task }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.validate.outputs.task }}
      stage: ${{ steps.validate.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: validate
        name: Validate lifecycle quality dispatch
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          STAGE: ${{ inputs.stage }}
          EXECUTE_OPTIONAL_Q8: ${{ inputs.execute_optional_q8 }}
        run: |
          set -euo pipefail
          [[ -n "$TASK" && "$TASK" != /* && "$TASK" != *".."* && "$TASK" != */* ]] || {
            echo "::error::task must be one safe top-level directory"
            exit 1
          }
          [[ -f "$TASK/task.toml" ]] || { echo "::error::No task.toml at $TASK/task.toml"; exit 1; }
          case "$STAGE" in
            QUALITY_INTERLOCK|MODEL_DIAGNOSTIC_GPT|MODEL_DIAGNOSTIC_CLAUDE) ;;
            *) echo "::error::Unsupported lifecycle quality stage: $STAGE"; exit 1 ;;
          esac
          [[ -z "$(git status --porcelain -- "$TASK")" ]] || {
            echo "::error::Task tree must be committed before quality lifecycle execution"
            exit 1
          }
          if [[ "$STAGE" == QUALITY_INTERLOCK && "$EXECUTE_OPTIONAL_Q8" == true ]]; then
            echo "::error::execute_optional_q8 applies only to Q8 diagnostic stages"
            exit 1
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Quality lifecycle dispatch: \`$STAGE\` for \`$TASK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Optional Q8 model execution: \`$EXECUTE_OPTIONAL_Q8\`" >> "$GITHUB_STEP_SUMMARY"

  q4:
    needs: preflight
    if: inputs.stage == 'QUALITY_INTERLOCK'
    uses: ./.github/workflows/terminus-quality-executor.yml
    with:
      task: ${{ inputs.task }}
      role_key: spec-test-contract
      state: FROZEN_CANDIDATE
      change: ${{ inputs.change }}
      publish_result: false
    secrets: inherit

  q6:
    needs: preflight
    if: inputs.stage == 'QUALITY_INTERLOCK'
    uses: ./.github/workflows/terminus-quality-executor.yml
    with:
      task: ${{ inputs.task }}
      role_key: production-logic
      state: FROZEN_CANDIDATE
      change: ${{ inputs.change }}
      publish_result: false
    secrets: inherit

  q8_gpt:
    needs: preflight
    if: inputs.stage == 'MODEL_DIAGNOSTIC_GPT' && inputs.execute_optional_q8
    uses: ./.github/workflows/terminus-quality-executor.yml
    with:
      task: ${{ inputs.task }}
      role_key: difficulty-sim-gpt
      state: MODEL_DIAGNOSTIC_GPT
      change: ${{ inputs.change }}
      publish_result: false
    secrets: inherit

  q8_claude:
    needs: preflight
    if: inputs.stage == 'MODEL_DIAGNOSTIC_CLAUDE' && inputs.execute_optional_q8
    uses: ./.github/workflows/terminus-quality-executor.yml
    with:
      task: ${{ inputs.task }}
      role_key: difficulty-sim-claude
      state: MODEL_DIAGNOSTIC_CLAUDE
      change: ${{ inputs.change }}
      publish_result: false
    secrets: inherit

  collect_interlock:
    needs: [preflight, q4, q6]
    if: always() && inputs.stage == 'QUALITY_INTERLOCK'
    runs-on: ubuntu-latest
    outputs:
      freshness_rc: ${{ steps.gate.outputs.freshness_rc }}
      interlock_rc: ${{ steps.gate.outputs.interlock_rc }}
      paths: ${{ steps.restore.outputs.paths }}
      evidence_commit: ${{ steps.persist.outputs.evidence_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require both bounded Q executions
        shell: bash
        env:
          Q4_JOB: ${{ needs.q4.result }}
          Q6_JOB: ${{ needs.q6.result }}
        run: |
          set -euo pipefail
          [[ "$Q4_JOB" == success ]] || { echo "::error::Q4 executor did not complete successfully: $Q4_JOB"; exit 1; }
          [[ "$Q6_JOB" == success ]] || { echo "::error::Q6 executor did not complete successfully: $Q6_JOB"; exit 1; }

      - name: Restore generated packets and validated reviews
        id: restore
        shell: bash
        env:
          Q4_PACKET_PATH: ${{ needs.q4.outputs.packet_path }}
          Q4_REVIEW_PATH: ${{ needs.q4.outputs.review_path }}
          Q4_PACKET_B64: ${{ needs.q4.outputs.packet_b64 }}
          Q4_REVIEW_B64: ${{ needs.q4.outputs.review_b64 }}
          Q6_PACKET_PATH: ${{ needs.q6.outputs.packet_path }}
          Q6_REVIEW_PATH: ${{ needs.q6.outputs.review_path }}
          Q6_PACKET_B64: ${{ needs.q6.outputs.packet_b64 }}
          Q6_REVIEW_B64: ${{ needs.q6.outputs.review_b64 }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python3 - "$TASK" "$Q4_PACKET_PATH" "$Q4_REVIEW_PATH" "$Q6_PACKET_PATH" "$Q6_REVIEW_PATH" <<'PY'
          import pathlib, sys
          task = sys.argv[1]
          expected = pathlib.PurePosixPath('.terminus/reviews') / task
          for raw in sys.argv[2:]:
              p = pathlib.PurePosixPath(raw)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit(f'unsafe lifecycle artifact path: {raw}')
              if tuple(p.parts[:3]) != tuple(expected.parts):
                  raise SystemExit(f'artifact outside task review namespace: {raw}')
          PY
          for path in "$Q4_PACKET_PATH" "$Q4_REVIEW_PATH" "$Q6_PACKET_PATH" "$Q6_REVIEW_PATH"; do
            mkdir -p "$(dirname "$path")"
          done
          printf '%s' "$Q4_PACKET_B64" | base64 -d > "$Q4_PACKET_PATH"
          printf '%s' "$Q4_REVIEW_B64" | base64 -d > "$Q4_REVIEW_PATH"
          printf '%s' "$Q6_PACKET_B64" | base64 -d > "$Q6_PACKET_PATH"
          printf '%s' "$Q6_REVIEW_B64" | base64 -d > "$Q6_REVIEW_PATH"
          echo "paths=$Q4_PACKET_PATH $Q4_REVIEW_PATH $Q6_PACKET_PATH $Q6_REVIEW_PATH" >> "$GITHUB_OUTPUT"

      - name: Evaluate deterministic quality interlock
        id: gate
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -uo pipefail
          set +e
          python3 .terminus/validate_review_freshness.py --task "$TASK"
          freshness_rc=$?
          python3 .terminus/validate_quality_interlock.py --task "$TASK"
          interlock_rc=$?
          set -e
          echo "freshness_rc=$freshness_rc" >> "$GITHUB_OUTPUT"
          echo "interlock_rc=$interlock_rc" >> "$GITHUB_OUTPUT"
          echo "Q4: \`${{ needs.q4.outputs.verdict }}\` (${{ needs.q4.outputs.budget_used }}/${{ needs.q4.outputs.budget_limit }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Q6: \`${{ needs.q6.outputs.verdict }}\` (${{ needs.q6.outputs.budget_used }}/${{ needs.q6.outputs.budget_limit }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Freshness validator rc: \`$freshness_rc\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality interlock validator rc: \`$interlock_rc\`" >> "$GITHUB_STEP_SUMMARY"
          [[ "$freshness_rc" == 0 ]] || { echo "::error::Fresh review binding validation failed"; exit 1; }

      - name: Persist quality-interlock review evidence
        id: persist
        if: inputs.publish_results
        shell: bash
        run: |
          set -euo pipefail
          read -r -a paths <<< "${{ steps.restore.outputs.paths }}"
          unexpected="$(git status --porcelain | awk '{print $2}' | while read -r path; do
            allowed=false
            for candidate in "${paths[@]}"; do
              [[ "$path" == "$candidate" ]] && allowed=true
            done
            [[ "$allowed" == true ]] || echo "$path"
          done)"
          [[ -z "$unexpected" ]] || { echo "::error::Unexpected lifecycle mutations: $unexpected"; exit 1; }
          git config user.name "terminus-quality-lifecycle[bot]"
          git config user.email "terminus-quality-lifecycle[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Quality review evidence already persisted."
          else
            git commit -m "Persist quality interlock reviews"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          evidence_commit="$(git rev-parse HEAD)"
          echo "evidence_commit=$evidence_commit" >> "$GITHUB_OUTPUT"

  record_interlock:
    needs: [preflight, q4, q6, collect_interlock]
    if: always() && inputs.stage == 'QUALITY_INTERLOCK' && needs.collect_interlock.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.collect_interlock.outputs.evidence_commit }}

      - name: Restore exact reviews for canonical stage recording
        shell: bash
        env:
          Q4_PACKET_PATH: ${{ needs.q4.outputs.packet_path }}
          Q4_REVIEW_PATH: ${{ needs.q4.outputs.review_path }}
          Q4_PACKET_B64: ${{ needs.q4.outputs.packet_b64 }}
          Q4_REVIEW_B64: ${{ needs.q4.outputs.review_b64 }}
          Q6_PACKET_PATH: ${{ needs.q6.outputs.packet_path }}
          Q6_REVIEW_PATH: ${{ needs.q6.outputs.review_path }}
          Q6_PACKET_B64: ${{ needs.q6.outputs.packet_b64 }}
          Q6_REVIEW_B64: ${{ needs.q6.outputs.review_b64 }}
        run: |
          set -euo pipefail
          for path in "$Q4_PACKET_PATH" "$Q4_REVIEW_PATH" "$Q6_PACKET_PATH" "$Q6_REVIEW_PATH"; do
            mkdir -p "$(dirname "$path")"
          done
          printf '%s' "$Q4_PACKET_B64" | base64 -d > "$Q4_PACKET_PATH"
          printf '%s' "$Q4_REVIEW_B64" | base64 -d > "$Q4_REVIEW_PATH"
          printf '%s' "$Q6_PACKET_B64" | base64 -d > "$Q6_PACKET_PATH"
          printf '%s' "$Q6_REVIEW_B64" | base64 -d > "$Q6_REVIEW_PATH"

      - name: Build canonical QUALITY_INTERLOCK invocation/result
        if: inputs.publish_results
        shell: bash
        env:
          Q4_PACKET_PATH: ${{ needs.q4.outputs.packet_path }}
          Q4_REVIEW_PATH: ${{ needs.q4.outputs.review_path }}
          Q6_PACKET_PATH: ${{ needs.q6.outputs.packet_path }}
          Q6_REVIEW_PATH: ${{ needs.q6.outputs.review_path }}
          EVIDENCE_COMMIT: ${{ needs.collect_interlock.outputs.evidence_commit }}
          INVOCATION: /tmp/quality-interlock.invocation.json
          RESULT: /tmp/quality-interlock.result.json
        run: |
          set -euo pipefail
          python3 .terminus/execution/quality_lifecycle_record.py \
            --stage QUALITY_INTERLOCK \
            --run-id "$GITHUB_RUN_ID" \
            --evidence-commit "$EVIDENCE_COMMIT" \
            --q4-packet "$Q4_PACKET_PATH" \
            --q4-review "$Q4_REVIEW_PATH" \
            --q6-packet "$Q6_PACKET_PATH" \
            --q6-review "$Q6_REVIEW_PATH" \
            --invocation-output "$INVOCATION" \
            --result-output "$RESULT"
          python3 .terminus/execution/controller_cli.py record \
            --invocation "$INVOCATION" \
            --result "$RESULT" \
            --output /tmp/quality-interlock.record.json

      - name: Persist canonical QUALITY_INTERLOCK ledger
        if: inputs.publish_results
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE "^\.terminus/(executions|workflows)/$TASK(/|$)" || true)"
          [[ -z "$unexpected" ]] || { echo "::error::Unexpected canonical-record mutations: $unexpected"; exit 1; }
          git config user.name "terminus-quality-lifecycle[bot]"
          git config user.email "terminus-quality-lifecycle[bot]@users.noreply.github.com"
          git add -- ".terminus/executions/$TASK"
          if git diff --cached --quiet; then
            echo "QUALITY_INTERLOCK execution record already persisted."
          else
            git commit -m "Record QUALITY_INTERLOCK lifecycle result"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce recorded quality-interlock outcome
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish_results }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" != true ]]; then
            echo "Dry-run lifecycle execution completed; no ledger/state mutation requested."
            exit 0
          fi
          status="$(python3 -c 'import json; print(json.load(open("/tmp/quality-interlock.result.json"))["status"])')"
          echo "Canonical QUALITY_INTERLOCK status: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == QUALITY_INTERLOCK_PASS ]] || {
            echo "::error::QUALITY_INTERLOCK recorded $status; remediation is required"
            exit 1
          }

  collect_q8_gpt:
    needs: [preflight, q8_gpt]
    if: always() && inputs.stage == 'MODEL_DIAGNOSTIC_GPT' && inputs.execute_optional_q8
    uses: ./.github/workflows/terminus-quality-lifecycle-collect.yml
    with:
      task: ${{ inputs.task }}
      stage: MODEL_DIAGNOSTIC_GPT
      packet_path: ${{ needs.q8_gpt.outputs.packet_path }}
      review_path: ${{ needs.q8_gpt.outputs.review_path }}
      packet_b64: ${{ needs.q8_gpt.outputs.packet_b64 }}
      review_b64: ${{ needs.q8_gpt.outputs.review_b64 }}
      executor_result: ${{ needs.q8_gpt.result }}
      verdict: ${{ needs.q8_gpt.outputs.verdict }}
      budget_stage: ${{ needs.q8_gpt.outputs.budget_stage }}
      budget_used: ${{ needs.q8_gpt.outputs.budget_used }}
      budget_limit: ${{ needs.q8_gpt.outputs.budget_limit }}
      publish_results: ${{ inputs.publish_results }}
    secrets: inherit

  collect_q8_claude:
    needs: [preflight, q8_claude]
    if: always() && inputs.stage == 'MODEL_DIAGNOSTIC_CLAUDE' && inputs.execute_optional_q8
    uses: ./.github/workflows/terminus-quality-lifecycle-collect.yml
    with:
      task: ${{ inputs.task }}
      stage: MODEL_DIAGNOSTIC_CLAUDE
      packet_path: ${{ needs.q8_claude.outputs.packet_path }}
      review_path: ${{ needs.q8_claude.outputs.review_path }}
      packet_b64: ${{ needs.q8_claude.outputs.packet_b64 }}
      review_b64: ${{ needs.q8_claude.outputs.review_b64 }}
      executor_result: ${{ needs.q8_claude.result }}
      verdict: ${{ needs.q8_claude.outputs.verdict }}
      budget_stage: ${{ needs.q8_claude.outputs.budget_stage }}
      budget_used: ${{ needs.q8_claude.outputs.budget_used }}
      budget_limit: ${{ needs.q8_claude.outputs.budget_limit }}
      publish_results: ${{ inputs.publish_results }}
    secrets: inherit

  skip_optional_q8:
    needs: preflight
    if: >-
      always() && needs.preflight.result == 'success' &&
      (inputs.stage == 'MODEL_DIAGNOSTIC_GPT' || inputs.stage == 'MODEL_DIAGNOSTIC_CLAUDE') &&
      !inputs.execute_optional_q8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deterministic no-budget Q8 skip
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          STAGE: ${{ inputs.stage }}
          PUBLISH: ${{ inputs.publish_results }}
        run: |
          set -euo pipefail
          task_commit="$(git log -1 --format=%H -- "$TASK")"
          [[ -n "$task_commit" ]] || { echo "::error::Cannot resolve task commit for $TASK"; exit 1; }
          python3 .terminus/execution/controller_cli.py control-plane --head HEAD --output /tmp/control-plane.json
          control_commit="$(python3 -c 'import json; print(json.load(open("/tmp/control-plane.json"))["control_plane_commit"])')"

          case "$STAGE" in
            MODEL_DIAGNOSTIC_GPT)
              perspective="GPT_PERSPECTIVE"
              question="In a cold GPT/Codex-style diagnostic solve, what happens?"
              ;;
            MODEL_DIAGNOSTIC_CLAUDE)
              perspective="CLAUDE_PERSPECTIVE"
              question="In a cold Claude/Claude-Code-style diagnostic solve, what happens?"
              ;;
            *) echo "::error::Unsupported optional Q8 stage: $STAGE"; exit 1 ;;
          esac

          review_id="$TASK-${task_commit:0:8}-${STAGE,,}-default-skip-$GITHUB_RUN_ID"
          python3 - "$TASK" "$task_commit" "$control_commit" "$review_id" "$perspective" "$question" <<'PY'
          import json, sys
          task, task_commit, control_commit, review_id, perspective, question = sys.argv[1:]
          packet = {
              "schema_version": "3.0",
              "role": "Model Perspective Difficulty Simulator",
              "review_id": review_id,
              "task": task,
              "task_commit": task_commit,
              "control_plane_commit": control_commit,
              "question": question,
          }
          review = {
              "schema_version": "3.0",
              "role": "Model Perspective Difficulty Simulator",
              "review_id": review_id,
              "task": task,
              "task_commit": task_commit,
              "control_plane_commit": control_commit,
              "verdict": "PASS",
              "confidence": "MEDIUM",
              "evidence_status": "SUFFICIENT",
              "summary": "Optional Q8 diagnostic not requested; no model execution occurred.",
              "evidence": [],
              "findings": [],
              "missing_evidence": [],
              "change_scope": [],
              "do_not_change": ["Do not treat this skip as official model evidence."],
              "next_gate": "continue default lifecycle",
              "role_output": {
                  "PERSPECTIVE": perspective,
                  "EXECUTION": "SIMULATION_NOT_EXECUTED",
                  "DIAGNOSTIC_SUMMARY": "Optional diagnostic skipped by default Q4/Q6-only quality policy.",
                  "PREDICTED_OFFICIAL_SIGNAL": "NOT_EVALUATED",
              },
          }
          json.dump(packet, open('/tmp/q8-skip.packet.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          json.dump(review, open('/tmp/q8-skip.review.json', 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY

          python3 .terminus/execution/quality_lifecycle_record.py \
            --stage "$STAGE" \
            --run-id "$GITHUB_RUN_ID" \
            --packet /tmp/q8-skip.packet.json \
            --review /tmp/q8-skip.review.json \
            --invocation-output /tmp/q8-skip.invocation.json \
            --result-output /tmp/q8-skip.result.json

          status="$(python3 -c 'import json; print(json.load(open("/tmp/q8-skip.result.json"))["status"])')"
          [[ "$status" == SIMULATION_NOT_EXECUTED ]] || {
            echo "::error::Default Q8 skip did not produce SIMULATION_NOT_EXECUTED"
            exit 1
          }

          if [[ "$PUBLISH" == true ]]; then
            python3 .terminus/execution/controller_cli.py record \
              --invocation /tmp/q8-skip.invocation.json \
              --result /tmp/q8-skip.result.json \
              --output /tmp/q8-skip.record.json
          fi

      - name: Persist canonical optional-Q8 skip ledger
        if: inputs.publish_results
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE "^\.terminus/(executions|workflows)/$TASK(/|$)" || true)"
          [[ -z "$unexpected" ]] || { echo "::error::Unexpected optional-Q8 skip mutations: $unexpected"; exit 1; }
          git config user.name "terminus-quality-lifecycle[bot]"
          git config user.email "terminus-quality-lifecycle[bot]@users.noreply.github.com"
          git add -- ".terminus/executions/$TASK"
          git diff --cached --quiet && {
            echo "::error::Optional-Q8 skip produced no canonical execution record"
            exit 1
          }
          git commit -m "Record $STAGE optional diagnostic skip"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarize default Q8 policy
        shell: bash
        run: |
          {
            echo "## ${{ inputs.stage }}"
            echo "- Execution: \`SIMULATION_NOT_EXECUTED\`"
            echo "- Model/Q execution: \`none\`"
            echo "- Q8 budget claim: \`none\`"
            echo "- Default mandatory model-backed quality: \`Q4 + Q6 only\`"
          } >> "$GITHUB_STEP_SUMMARY"
