name: JetStream Q4 Third-Cycle Remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Apply packet-bound Q4 remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import ast
          import json
          import textwrap
          from pathlib import Path

          TASK = Path('jetstream-regional-stream-continuity')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_function(path: Path, name: str, replacement: str) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              node = next(
                  (item for item in tree.body if isinstance(item, ast.FunctionDef) and item.name == name),
                  None,
              )
              if node is None:
                  raise SystemExit(f'function {name} not found in {path}')
              replacement = textwrap.dedent(replacement).lstrip()
              if not replacement.endswith('\n'):
                  replacement += '\n'
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1 : node.end_lineno] = [replacement]
              updated = ''.join(lines)
              ast.parse(updated)
              path.write_text(updated, encoding='utf-8')

          # Q4-02: expose the reconciliation progress values already promised by the
          # solver-visible continuity contract.
          model = TASK / 'environment/continuity/continuity/model.py'
          replace_once(
              model,
              '''    consumer_lag_count: int\n    checksum: str\n    findings: tuple[Finding, ...] = ()\n''',
              '''    consumer_lag_count: int\n    highest_contiguous_archive_origin_sequence: int\n    required_consumer_progress: Mapping[str, int]\n    checksum: str\n    findings: tuple[Finding, ...] = ()\n''',
          )
          replace_once(
              model,
              '''        if not re.fullmatch(r"[0-9a-f]{64}", self.checksum):\n            raise ContractError("reconciliation checksum must be sha256 hex")\n''',
              '''        ensure_positive(\n            self.highest_contiguous_archive_origin_sequence,\n            "highest_contiguous_archive_origin_sequence",\n            allow_zero=True,\n        )\n        for consumer_name, sequence in self.required_consumer_progress.items():\n            ensure_name(consumer_name, "required_consumer_progress consumer")\n            ensure_positive(sequence, "required_consumer_progress sequence", allow_zero=True)\n        if not re.fullmatch(r"[0-9a-f]{64}", self.checksum):\n            raise ContractError("reconciliation checksum must be sha256 hex")\n''',
          )
          replace_once(
              model,
              '''            "consumer_lag_count": self.consumer_lag_count,\n            "checksum": self.checksum,\n''',
              '''            "consumer_lag_count": self.consumer_lag_count,\n            "highest_contiguous_archive_origin_sequence": self.highest_contiguous_archive_origin_sequence,\n            "required_consumer_progress": dict(self.required_consumer_progress),\n            "checksum": self.checksum,\n''',
          )

          policy = TASK / 'environment/continuity/continuity/policy.py'
          replace_once(
              policy,
              '''        journal_floor = contiguous_floor(journal_sequences)\n        archive_floor = contiguous_floor(archive_sequences)\n\n        if archive_count != journal_count:\n''',
              '''        journal_floor = contiguous_floor(journal_sequences)\n        archive_floor = contiguous_floor(archive_sequences)\n        archive_origin_floor = contiguous_floor(\n            sorted(record.identity.origin_sequence for record in archive.values())\n        )\n        required_consumer_progress: dict[str, int] = {}\n        for consumer_name in self.store.required_consumers():\n            checkpoint = self.store.checkpoint(consumer_name, region, generation)\n            required_consumer_progress[consumer_name] = (\n                0 if checkpoint is None else checkpoint.application_sequence\n            )\n\n        if archive_count != journal_count:\n''',
          )
          replace_once(
              policy,
              '''            metadata_mismatch_count=metadata_mismatch_count,\n            consumer_lag_count=sum(1 for f in findings if f.finding_type == "CONSUMER_LAG"),\n            checksum=checksum,\n''',
              '''            metadata_mismatch_count=metadata_mismatch_count,\n            consumer_lag_count=sum(1 for f in findings if f.finding_type == "CONSUMER_LAG"),\n            highest_contiguous_archive_origin_sequence=archive_origin_floor,\n            required_consumer_progress=required_consumer_progress,\n            checksum=checksum,\n''',
          )

          starter = TASK / 'environment/continuity/continuity/engine.py'
          replace_once(
              starter,
              '''    RetentionPolicy,\n    sha256_text,\n''',
              '''    RetentionPolicy,\n    contiguous_floor,\n    sha256_text,\n''',
          )
          replace_once(
              starter,
              '''        highest_journal = max((event.identity.origin_sequence for event in journal), default=0)\n        highest_hub = max((record.hub_stream_sequence for record in archive), default=0)\n        if highest_hub < highest_journal:\n''',
              '''        highest_journal = max((event.identity.origin_sequence for event in journal), default=0)\n        highest_hub = max((record.hub_stream_sequence for record in archive), default=0)\n        archive_origin_floor = contiguous_floor(\n            record.identity.origin_sequence for record in archive\n        )\n        required_consumer_progress: dict[str, int] = {}\n        for consumer_name in self.store.required_consumers():\n            checkpoint = self.store.checkpoint(consumer_name, region, generation)\n            required_consumer_progress[consumer_name] = (\n                0 if checkpoint is None else checkpoint.application_sequence\n            )\n        if highest_hub < highest_journal:\n''',
          )
          replace_once(
              starter,
              '''            metadata_mismatch_count=0,\n            consumer_lag_count=0,\n            checksum=checksum,\n''',
              '''            metadata_mismatch_count=0,\n            consumer_lag_count=0,\n            highest_contiguous_archive_origin_sequence=archive_origin_floor,\n            required_consumer_progress=required_consumer_progress,\n            checksum=checksum,\n''',
          )

          solution = TASK / 'solution/files/engine.py'
          replace_once(
              solution,
              '''        target = min(journal_floor, archive_floor)\n        consumer_findings = self._required_consumer_lag(region, generation, target)\n        findings.extend(consumer_findings)\n\n        checksum = report_checksum(archive_by_id.values())\n''',
              '''        target = min(journal_floor, archive_floor)\n        required_consumer_progress: dict[str, int] = {}\n        for consumer_name in self.store.required_consumers():\n            checkpoint = self.store.checkpoint(consumer_name, region, generation)\n            required_consumer_progress[consumer_name] = (\n                0 if checkpoint is None else checkpoint.application_sequence\n            )\n        consumer_findings = self._required_consumer_lag(region, generation, target)\n        findings.extend(consumer_findings)\n\n        checksum = report_checksum(archive_by_id.values())\n''',
          )
          replace_once(
              solution,
              '''            metadata_mismatch_count=metadata_mismatch_count,\n            consumer_lag_count=len(consumer_findings),\n            checksum=checksum,\n''',
              '''            metadata_mismatch_count=metadata_mismatch_count,\n            consumer_lag_count=len(consumer_findings),\n            highest_contiguous_archive_origin_sequence=archive_floor,\n            required_consumer_progress=required_consumer_progress,\n            checksum=checksum,\n''',
          )

          tests = TASK / 'tests/test_continuity.py'
          replace_function(
              tests,
              'test_f2p_publish_ack_transitions_journal_once',
              r'''
              def test_f2p_publish_ack_transitions_journal_once(engine: ContinuityEngine) -> None:
                  """Only an acknowledgement for the expected physical stream may publish a journal row."""
                  event = sample_event(engine, sequence=5985)
                  expected_stream = str(engine.store.region("east")["physical_stream"])
                  publisher = RecordingPublisher(engine.store)
                  ack = asyncio.run(engine.publish_event(event.identity.event_id, publisher))
                  assert publisher.calls[0]["journal_state_during_publish"] == "PUBLISHING"
                  assert publisher.calls[0]["message_id"] == event.identity.event_id
                  assert ack.stream == expected_stream
                  assert engine.store.journal_state(event.identity.event_id).value == "PUBLISHED"

                  wrong_event = sample_event(engine, sequence=5984)
                  wrong_stream = str(engine.store.region("west")["physical_stream"])
                  wrong_publisher = RecordingPublisher(engine.store, ack_stream=wrong_stream)
                  with pytest.raises(ContractError):
                      asyncio.run(engine.publish_event(wrong_event.identity.event_id, wrong_publisher))
                  assert wrong_publisher.calls[0]["journal_state_during_publish"] == "PUBLISHING"
                  assert engine.store.journal_state(wrong_event.identity.event_id).value == "RETRY"
                  attempt = engine.store.publish_attempts(wrong_event.identity.event_id)[-1]
                  assert attempt["outcome"] == "ERROR"
                  assert attempt["requested_stream"] == expected_stream
                  assert attempt["message_id"] == wrong_event.identity.event_id
              ''',
          )
          replace_function(
              tests,
              'test_f2p_archive_metadata_preserves_origin_identity',
              r'''
              def test_f2p_archive_metadata_preserves_origin_identity(
                  engine: ContinuityEngine,
              ) -> None:
                  """A matching event id with corrupted origin metadata is reported as divergent."""
                  complete_archive(engine, "east")
                  event = sample_event(engine, sequence=120)
                  engine.store.execute(
                      "UPDATE archive_index SET origin_sequence=? WHERE event_id=?",
                      (7001, event.identity.event_id),
                  )
                  archive_sequences = [
                      record.identity.origin_sequence
                      for record in engine.store.iter_archive(region="east", generation=1)
                  ]
                  expected_floor = contiguous_floor(archive_sequences)
                  summary = engine.reconcile_region("east", 1)
                  assert summary.metadata_mismatch_count == 1
                  assert summary.highest_contiguous_archive_origin_sequence == expected_floor
                  assert summary.converged is False
                  assert any(
                      finding.event_id == event.identity.event_id
                      for finding in summary.blocking_findings
                  )
              ''',
          )
          replace_function(
              tests,
              'test_f2p_poison_event_is_quarantined_without_completion',
              r'''
              def test_f2p_poison_event_is_quarantined_without_completion(
                  engine: ContinuityEngine,
              ) -> None:
                  """Quarantine records audit evidence without committing or dispatching a business effect."""
                  event = sample_event(engine, sequence=5680)
                  consumer = "safety-state-projector"
                  engine.store.execute(
                      "DELETE FROM processing_effects WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  )
                  engine.store.execute(
                      "DELETE FROM effect_dispatches WHERE consumer_name=? AND event_id=?",
                      (consumer, event.identity.event_id),
                  )
                  before = engine.store.checkpoint(consumer, "east", 1)
                  assert before is not None
                  result = asyncio.run(
                      engine.process_delivery(
                          FakeDelivery(event, consumer_name=consumer, delivery_count=5),
                          worker_id="safety-worker",
                          fence_epoch=1,
                          poison_predicate=lambda _: True,
                      )
                  )
                  after = engine.store.checkpoint(consumer, "east", 1)
                  effect = engine.store.effect(consumer, event.identity.event_id)
                  assert after is not None
                  assert result.status == "QUARANTINED"
                  assert effect is not None and effect.status is EffectStatus.QUARANTINED
                  assert dispatch_count(engine, consumer, event.identity.event_id) == 0
                  assert after.last_effect_sequence == before.last_effect_sequence
                  assert after.last_ack_sequence == before.last_ack_sequence
              ''',
          )
          replace_function(
              tests,
              'test_f2p_reconcile_ignores_hub_sequence_equivalence',
              r'''
              def test_f2p_reconcile_ignores_hub_sequence_equivalence(
                  engine: ContinuityEngine,
              ) -> None:
                  """Stable origin completeness and reported progress are independent of hub delivery positions."""
                  complete_archive(engine, "east")
                  for consumer in engine.store.required_consumers():
                      set_checkpoint(engine, consumer, "east", effect=6000)

                  engine.store.execute(
                      "UPDATE origin_generations SET last_observed_sequence=60002 "
                      "WHERE region='east' AND generation=1"
                  )
                  engine.store.execute(
                      "UPDATE archive_index SET hub_stream_sequence=30000+origin_sequence "
                      "WHERE region='east' AND generation=1"
                  )

                  for offset, source_event_id in enumerate(
                      ("evt-east-g01-000101", "evt-east-g01-000102", "evt-east-g01-000103")
                  ):
                      origin_sequence = 60000 + offset
                      event_id = f"evt-east-g01-{origin_sequence:06d}"
                      engine.store.execute(
                          "INSERT INTO event_journal("
                          "journal_id,event_id,region,generation,origin_sequence,device_id,site_id,event_type,event_time,accepted_at,"
                          "payload_json,payload_sha256,payload_bytes,priority,publish_state,publish_attempts,last_publish_at,publish_ack_stream,"
                          "publish_ack_sequence,archive_confirmed_at,retention_hold) "
                          "SELECT ?,?,'east',1,?,device_id,site_id,event_type,event_time,accepted_at,payload_json,payload_sha256,payload_bytes,priority,"
                          "'ARCHIVED',1,accepted_at,'EDGE_EAST_TELEMETRY',?,accepted_at,0 FROM event_journal WHERE event_id=?",
                          (
                              900000 + offset,
                              event_id,
                              origin_sequence,
                              origin_sequence,
                              source_event_id,
                          ),
                      )
                      engine.store.execute(
                          "INSERT INTO archive_index(event_id,region,generation,origin_sequence,hub_stream_sequence,payload_sha256,archived_at,source_stream,source_domain,duplicate_observation_count) "
                          "SELECT event_id,'east',1,origin_sequence,?,payload_sha256,accepted_at,'EDGE_EAST_TELEMETRY','edge-east',0 "
                          "FROM event_journal WHERE event_id=?",
                          (50000 + offset, event_id),
                      )

                  summary = engine.reconcile_region("east", 1)
                  assert summary.journal_event_count == 6003
                  assert summary.archive_event_count == 6003
                  assert summary.missing_count == 0
                  assert summary.unexpected_count == 0
                  assert summary.metadata_mismatch_count == 0
                  assert summary.consumer_lag_count == 0
                  assert summary.highest_contiguous_archive_origin_sequence == 6000
                  assert summary.required_consumer_progress == {
                      consumer: 6000 for consumer in engine.store.required_consumers()
                  }
                  assert summary.converged is True
              ''',
          )
          replace_function(
              tests,
              'test_f2p_reconcile_finds_offsetting_gap_and_duplicate',
              r'''
              def test_f2p_reconcile_finds_offsetting_gap_and_duplicate(
                  engine: ContinuityEngine,
              ) -> None:
                  """Equal counts still expose the missing and unexpected stable identities."""
                  complete_archive(engine, "east")
                  missing = "evt-east-g01-000123"
                  unexpected = "evt-east-g01-999999"
                  engine.store.execute("DELETE FROM archive_index WHERE event_id=?", (missing,))
                  engine.store.execute(
                      "INSERT INTO archive_index(event_id,region,generation,origin_sequence,hub_stream_sequence,payload_sha256,archived_at,source_stream,source_domain,duplicate_observation_count) "
                      "VALUES(?,'east',1,999999,9999999,?,'2026-08-09T00:00:00Z','EDGE_EAST_TELEMETRY','edge-east',0)",
                      (unexpected, "f" * 64),
                  )
                  summary = engine.reconcile_region("east", 1)
                  assert summary.journal_event_count == summary.archive_event_count
                  assert summary.missing_count == 1
                  assert summary.unexpected_count == 1
                  assert summary.highest_contiguous_archive_origin_sequence == 122
                  assert summary.converged is False
                  blocking_ids = {
                      finding.event_id
                      for finding in summary.blocking_findings
                      if finding.event_id is not None
                  }
                  assert {missing, unexpected} <= blocking_ids
              ''',
          )
          replace_function(
              tests,
              'test_f2p_convergence_waits_for_all_required_consumers',
              r'''
              def test_f2p_convergence_waits_for_all_required_consumers(
                  engine: ContinuityEngine,
              ) -> None:
                  """A complete archive reports required-consumer progress and waits for the slowest application."""
                  complete_archive(engine, "east")
                  set_checkpoint(engine, "telemetry-indexer", "east", effect=6000)
                  set_checkpoint(engine, "safety-state-projector", "east", effect=5999)
                  summary = engine.reconcile_region("east", 1)
                  assert summary.converged is False
                  assert summary.consumer_lag_count >= 1
                  assert summary.highest_contiguous_archive_origin_sequence == 6000
                  assert summary.required_consumer_progress["telemetry-indexer"] == 6000
                  assert summary.required_consumer_progress["safety-state-projector"] == 5999
              ''',
          )
          replace_function(
              tests,
              'test_p2p_current_lease_owner_can_renew_same_epoch',
              r'''
              def test_p2p_current_lease_owner_can_renew_same_epoch(engine: ContinuityEngine) -> None:
                  """Current-token renewal succeeds, while the same owner with a stale epoch cannot mutate the lease."""
                  t0 = datetime(2026, 8, 9, 6, 0, tzinfo=UTC)
                  first = engine.acquire_recovery_lease(
                      region="west", owner_id="worker-a", ttl_seconds=30, at=t0
                  )
                  renewed = engine.renew_recovery_lease(
                      region="west",
                      owner_id="worker-a",
                      fence_epoch=first.fence_epoch,
                      ttl_seconds=30,
                      at=t0 + timedelta(seconds=10),
                  )
                  assert renewed.fence_epoch == first.fence_epoch
                  assert renewed.expires_at > first.expires_at

                  rotated_at = t0 + timedelta(seconds=11)
                  current = engine.store.write_lease(
                      region="west",
                      owner_id="worker-a",
                      fence_epoch=renewed.fence_epoch + 1,
                      acquired_at=renewed.acquired_at,
                      renewed_at=rotated_at,
                      expires_at=rotated_at + timedelta(seconds=45),
                  )
                  with pytest.raises(FencingError):
                      engine.renew_recovery_lease(
                          region="west",
                          owner_id="worker-a",
                          fence_epoch=renewed.fence_epoch,
                          ttl_seconds=300,
                          at=rotated_at + timedelta(seconds=1),
                      )
                  after = engine.store.current_lease("west")
                  assert after is not None
                  assert after.fence_epoch == current.fence_epoch
                  assert after.expires_at == current.expires_at
              ''',
          )

          contract_tests = TASK / 'tests/test_contract_coverage.py'
          replace_function(
              contract_tests,
              'test_f2p_final_health_and_reconciliation_reports_are_materialized',
              r'''
              def test_f2p_final_health_and_reconciliation_reports_are_materialized() -> None:
                  """Final reports agree with independently observed durable state and preserve incident evidence."""
                  health_path = ROOT / "out/health.json"
                  reconciliation_path = ROOT / "out/reconciliation.json"
                  assert health_path.is_file(), "solution must materialize /app/continuity/out/health.json"
                  assert reconciliation_path.is_file(), "solution must materialize /app/continuity/out/reconciliation.json"

                  health = json.loads(health_path.read_text(encoding="utf-8"))
                  reconciliation = json.loads(reconciliation_path.read_text(encoding="utf-8"))

                  def contiguous_floor(values: list[int]) -> int:
                      present = set(values)
                      floor = 0
                      while floor + 1 in present:
                          floor += 1
                      return floor

                  connection = sqlite3.connect(ROOT / "state/continuity.db")
                  connection.row_factory = sqlite3.Row
                  try:
                      required_consumers = [
                          str(row["consumer_name"])
                          for row in connection.execute(
                              "SELECT consumer_name FROM consumer_registry WHERE required=1 AND enabled=1 ORDER BY consumer_name"
                          ).fetchall()
                      ]
                      active_plans = int(
                          connection.execute(
                              "SELECT COUNT(*) FROM replay_plans WHERE status IN ('APPROVED','RUNNING')"
                          ).fetchone()[0]
                      )
                      expected_recovery_ok = active_plans == 0

                      expected_generations_ok = True
                      expected_publication_ok = (
                          int(
                              connection.execute(
                                  "SELECT COUNT(*) FROM event_journal WHERE publish_state IN ('PUBLISHING','RETRY','HELD')"
                              ).fetchone()[0]
                          )
                          == 0
                      )
                      expected_consumers_ok = True
                      expected_region_convergence: dict[str, bool] = {}

                      assert set(reconciliation["regions"]) == {"east", "west"}
                      for region in ("east", "west"):
                          confirmed = connection.execute(
                              "SELECT generation FROM origin_generations WHERE region=? AND status='CONFIRMED' ORDER BY generation",
                              (region,),
                          ).fetchall()
                          pending_count = int(
                              connection.execute(
                                  "SELECT COUNT(*) FROM origin_generations WHERE region=? AND status='PENDING_APPROVAL'",
                                  (region,),
                              ).fetchone()[0]
                          )
                          if len(confirmed) != 1 or pending_count:
                              expected_generations_ok = False
                          assert confirmed, f"{region} must retain a confirmed generation"
                          generation = int(confirmed[-1]["generation"])

                          journal_rows = connection.execute(
                              "SELECT event_id,origin_sequence,payload_sha256 FROM event_journal WHERE region=? AND generation=?",
                              (region, generation),
                          ).fetchall()
                          archive_rows = connection.execute(
                              "SELECT event_id,origin_sequence,payload_sha256,duplicate_observation_count FROM archive_index WHERE region=? AND generation=?",
                              (region, generation),
                          ).fetchall()
                          journal = {
                              str(row["event_id"]): (int(row["origin_sequence"]), str(row["payload_sha256"]).lower())
                              for row in journal_rows
                          }
                          archive = {
                              str(row["event_id"]): (int(row["origin_sequence"]), str(row["payload_sha256"]).lower())
                              for row in archive_rows
                          }
                          missing_ids = set(journal) - set(archive)
                          unexpected_ids = set(archive) - set(journal)
                          metadata_mismatch_count = sum(
                              1 for event_id in set(journal) & set(archive) if journal[event_id] != archive[event_id]
                          )
                          duplicate_count = sum(
                              int(row["duplicate_observation_count"]) for row in archive_rows
                          )
                          journal_floor = contiguous_floor([value[0] for value in journal.values()])
                          archive_floor = contiguous_floor([value[0] for value in archive.values()])
                          target = min(journal_floor, archive_floor)

                          progress: dict[str, int] = {}
                          for consumer_name in required_consumers:
                              checkpoint = connection.execute(
                                  "SELECT last_effect_sequence,last_ack_sequence,jetstream_ack_floor FROM consumer_checkpoints "
                                  "WHERE consumer_name=? AND region=? AND generation=?",
                                  (consumer_name, region, generation),
                              ).fetchone()
                              if checkpoint is None:
                                  progress[consumer_name] = 0
                                  expected_consumers_ok = False
                                  continue
                              effect_sequence = int(checkpoint["last_effect_sequence"])
                              ack_sequence = int(checkpoint["last_ack_sequence"])
                              js_floor = int(checkpoint["jetstream_ack_floor"])
                              progress[consumer_name] = min(effect_sequence, ack_sequence)
                              if not (effect_sequence == ack_sequence == js_floor):
                                  expected_consumers_ok = False

                          consumer_lag_count = sum(
                              1 for sequence in progress.values() if sequence < target
                          )
                          expected_converged = (
                              not missing_ids
                              and not unexpected_ids
                              and metadata_mismatch_count == 0
                              and consumer_lag_count == 0
                          )
                          expected_region_convergence[region] = expected_converged

                          actual = reconciliation["regions"][region]
                          assert actual["status"] == (
                              "CONVERGED" if expected_converged else "DIVERGED"
                          )
                          assert actual["journal_event_count"] == len(journal)
                          assert actual["archive_event_count"] == len(archive)
                          assert actual["missing_count"] == len(missing_ids)
                          assert actual["unexpected_count"] == len(unexpected_ids)
                          assert actual["duplicate_count"] == duplicate_count
                          assert actual["metadata_mismatch_count"] == metadata_mismatch_count
                          assert actual["consumer_lag_count"] == consumer_lag_count
                          assert actual["highest_contiguous_archive_origin_sequence"] == archive_floor
                          assert actual["required_consumer_progress"] == progress
                          assert actual["converged"] is expected_converged

                      expected_archive_ok = all(expected_region_convergence.values())
                      assert health["generations_ok"] is expected_generations_ok
                      assert health["publication_ok"] is expected_publication_ok
                      assert health["archive_ok"] is expected_archive_ok
                      assert health["consumers_ok"] is expected_consumers_ok
                      assert health["recovery_ok"] is expected_recovery_ok
                      assert reconciliation["converged"] is expected_archive_ok
                      if not all(
                          (
                              expected_generations_ok,
                              expected_publication_ok,
                              expected_archive_ok,
                              expected_consumers_ok,
                              expected_recovery_ok,
                          )
                      ):
                          assert health["healthy"] is False

                      assert connection.execute("SELECT COUNT(*) FROM event_journal").fetchone()[0] == 12000
                      assert connection.execute("SELECT COUNT(*) FROM consumer_checkpoints").fetchone()[0] >= 4
                      assert active_plans >= 1
                  finally:
                      connection.close()

