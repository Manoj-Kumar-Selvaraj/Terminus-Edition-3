name: Terminus Agent System CI

on:
  pull_request:
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  push:
    branches: [main]
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminus-agent-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-jetstream-adjudication-packet:
    name: Generate JetStream Q4 adjudication packet
    if: github.event_name == 'pull_request' && github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Verify blocked dispute state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- jetstream-regional-stream-continuity)" = "f73b6c9a3cf52c1929a622798f36fc2e480052d4"
          grep -q -- '- Controller state: `BLOCKED`' .terminus/sessions/jetstream-regional-stream-continuity.md
          grep -q '| Adjudicator | PENDING |' .terminus/sessions/jetstream-regional-stream-continuity.md
          test -f .terminus/reviews/jetstream-regional-stream-continuity/440aa838/jetstream-regional-stream-continuity-440aa838-spec-test-contract-7c5bbb5a2b.json
          test -f .terminus/reviews/jetstream-regional-stream-continuity/f73b6c9a/jetstream-regional-stream-continuity-f73b6c9a-spec-test-contract-bc501441f0.json

      - name: Generate immutable Adjudicator packet
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            adjudication \
            --state BLOCKED \
            --change 'Protocol-2.2 Q4 circuit breaker: prior exhaustive Q4 on 440aa838 returned 12 blockers; one authorized consolidated repair/refreeze produced f73b6c9a with Oracle 40/40 and NOP 30/10; the next exhaustive Q4 on f73b6c9a again returned 12 blockers with an expanded/different finding set. Adjudicate each current finding semantically against the prior frozen Q4, exact task diff, controlling contract/materiality rules, and frozen current task evidence. Whole-file path overlap from classify_review_delta.py is only a first-pass and is not controlling semantic equivalence.'
          mapfile -t packets < <(find .terminus/reviews/jetstream-regional-stream-continuity/f73b6c9a -maxdepth 1 -type f -name '*-adjudication-*.packet.json' -print)
          test "${#packets[@]}" -eq 1
          packet="${packets[0]}"
          grep -q '"role": "Adjudicator"' "$packet"
          grep -q '"task_commit": "f73b6c9a3cf52c1929a622798f36fc2e480052d4"' "$packet"
          grep -q '"state": "BLOCKED"' "$packet"
          grep -q '"role_policy_version": "1.0"' "$packet"

      - name: Commit packet and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/terminus-agent-system-ci.yml
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add \
            .github/workflows/terminus-agent-system-ci.yml \
            .terminus/reviews/jetstream-regional-stream-continuity/f73b6c9a/
          git diff --cached --check
          git commit -m 'Generate Q4 adjudication packet for f73b6c9a'
          git push origin HEAD:task/jetstream-quality-interlock

  validate-agent-system:
    name: Validate reviewer/controller system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python
        run: |
          python3 -m py_compile \
            .terminus/validate_agent_system.py \
            .terminus/review_contract.py \
            .terminus/new_review_packet.py \
            .terminus/validate_review_freshness.py \
            .terminus/validate_task_complexity.py

      - name: Install pinned control-plane test tools
        run: python3 -m pip install --quiet ruff==0.14.10 pytest==8.4.1

      - name: Lint control-plane Python
        run: ruff check .terminus

      - name: Run control-plane regression suite
        run: python3 -m pytest .terminus/tests -q

      - name: Validate agent system structure
        run: python3 .terminus/validate_agent_system.py

      - name: Validate current review freshness and commit binding
        run: python3 .terminus/validate_review_freshness.py

      - name: Check control-plane files stay outside task packages
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -maxdepth 3 -type d -path '*/.terminus' -print -quit | grep -q .; then
            echo '::error::Found nested .terminus directory under a task/workspace path.'
            exit 1
          fi
          echo 'Control-plane files remain repository-level only.'
