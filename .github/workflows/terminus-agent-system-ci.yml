name: Terminus Agent System CI

on:
  pull_request:
    paths:
      - '.terminus/**'
      - '.cursor/agents/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  push:
    branches: [main]
    paths:
      - '.terminus/**'
      - '.cursor/agents/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminus-agent-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-agent-system:
    name: Validate reviewer/controller system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Review freshness is derived from per-task Git history, so shallow history
      # is not sufficient evidence.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python
        run: |
          python3 -m py_compile \
            .terminus/validate_agent_system.py \
            .terminus/validate_stage_contracts.py \
            .terminus/validate_retrieval_metadata.py \
            .terminus/validate_retrieval_engine.py \
            .terminus/validate_stage_invocation.py \
            .terminus/validate_execution_record.py \
            .terminus/validate_workflow_state.py \
            .terminus/review_contract.py \
            .terminus/new_review_packet.py \
            .terminus/validate_review_freshness.py \
            .terminus/validate_task_complexity.py
          python3 -m compileall -q .terminus/retrieval .terminus/execution

      - name: Install pinned control-plane test tools
        run: python3 -m pip install --quiet ruff==0.14.10 pytest==8.4.1

      - name: Lint control-plane Python
        run: ruff check .terminus

      - name: Run control-plane regression suite
        run: python3 -m pytest .terminus/tests -q

      - name: Validate agent system structure
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_agent_system.py

      - name: Validate structured stage contracts
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_stage_contracts.py

      - name: Validate retrieval metadata contract
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_retrieval_metadata.py

      - name: Validate retrieval engine
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_retrieval_engine.py

      - name: Validate executable stage invocations
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_stage_invocation.py

      - name: Validate execution records and transitions
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_execution_record.py

      - name: Validate workflow state materialization
        if: ${{ !cancelled() }}
        run: python3 .terminus/validate_workflow_state.py

      - name: Validate changed session freshness and commit binding
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              echo "No changed-session freshness scope for ${{ github.event_name }}; validator behavior is covered by the regression suite."
              exit 0
              ;;
          esac

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No comparable base commit; skipping changed-session freshness scan."
            exit 0
          fi

          mapfile -t sessions < <(
            git diff --name-only "$base" "${{ github.sha }}" -- '.terminus/sessions/*.md' \
              | grep -v '^\.terminus/sessions/TEMPLATE\.md$' \
              || true
          )

          if (( ${#sessions[@]} == 0 )); then
            echo "No task session checkpoints changed; historical stale sessions remain non-advancing evidence and are not rewritten by unrelated control-plane changes."
            exit 0
          fi

          for session in "${sessions[@]}"; do
            if [[ ! -f "$session" ]]; then
              echo "Session removed in this change: $session"
              continue
            fi
            task="$(basename "$session" .md)"
            echo "==> validating current freshness for changed session: $task"
            python3 .terminus/validate_review_freshness.py --task "$task"
          done

      - name: Check control-plane files stay outside task packages
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -maxdepth 3 -type d -path '*/.terminus' -print -quit | grep -q .; then
            echo '::error::Found nested .terminus directory under a task/workspace path.'
            exit 1
          fi
          echo 'Control-plane files remain repository-level only.'
