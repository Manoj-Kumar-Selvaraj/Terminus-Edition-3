name: Terminus Agent System CI

on:
  pull_request:
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  push:
    branches: [main]
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminus-agent-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-jetstream-quality-packets:
    name: Generate fresh JetStream Q4 Q6 packets
    if: github.event_name == 'pull_request' && github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Verify frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- jetstream-regional-stream-continuity)" = "440aa83862a3234678e27bd70319623735964173"
          grep -q -- '- Controller state: `FROZEN_CANDIDATE`' .terminus/sessions/jetstream-regional-stream-continuity.md
          python3 .terminus/validate_review_freshness.py --task jetstream-regional-stream-continuity
          python3 .terminus/validate_quality_interlock.py --task jetstream-regional-stream-continuity

      - name: Generate immutable packet pair
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change 'Consolidated Q4 closure: external replay Nats-Msg-Id coverage, durable journal recovery-horizon coverage, and generated_at report coverage; exact 40=30 F2P+10 P2P preserved.'
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity \
            production-logic \
            --state FROZEN_CANDIDATE \
            --change 'Verifier/reference-only closure since prior production review; Q6 1.1 requires fresh scope-hash provenance for the frozen task commit.'
          packets=(.terminus/reviews/jetstream-regional-stream-continuity/440aa838/*.packet.json)
          test "${#packets[@]}" -eq 2
          grep -L '"review_scope_hash"' "${packets[@]}" | grep 'production-logic' && exit 1 || true
          if grep -l '"review_scope_hash"' "${packets[@]}" | grep -q 'spec-test-contract'; then
            echo 'Q4 packet unexpectedly carries a reusable scope hash' >&2
            exit 1
          fi

      - name: Commit packets and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/terminus-agent-system-ci.yml
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/terminus-agent-system-ci.yml .terminus/reviews/jetstream-regional-stream-continuity/440aa838/
          git diff --cached --check
          git commit -m 'Generate fresh Q4 Q6 packets for 440aa838'
          git push origin HEAD:task/jetstream-quality-interlock

  validate-agent-system:
    name: Validate reviewer/controller system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python
        run: |
          python3 -m py_compile \
            .terminus/validate_agent_system.py \
            .terminus/review_contract.py \
            .terminus/new_review_packet.py \
            .terminus/validate_review_freshness.py \
            .terminus/validate_task_complexity.py

      - name: Install pinned control-plane test tools
        run: python3 -m pip install --quiet ruff==0.14.10 pytest==8.4.1

      - name: Lint control-plane Python
        run: ruff check .terminus

      - name: Run control-plane regression suite
        run: python3 -m pytest .terminus/tests -q

      - name: Validate agent system structure
        run: python3 .terminus/validate_agent_system.py

      - name: Validate current review freshness and commit binding
        run: python3 .terminus/validate_review_freshness.py

      - name: Check control-plane files stay outside task packages
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -maxdepth 3 -type d -path '*/.terminus' -print -quit | grep -q .; then
            echo '::error::Found nested .terminus directory under a task/workspace path.'
            exit 1
          fi
          echo 'Control-plane files remain repository-level only.'
