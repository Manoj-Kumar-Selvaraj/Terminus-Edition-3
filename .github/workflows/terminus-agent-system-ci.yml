name: Terminus Agent System CI

on:
  pull_request:
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  push:
    branches: [main]
    paths:
      - '.terminus/**'
      - '.github/workflows/terminus-agent-system-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminus-agent-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-jetstream-restart-assertion:
    name: Correct Q4 restart-health assertion
    if: github.event_name == 'pull_request' && github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0

      - name: Verify repair baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%H -- jetstream-regional-stream-continuity)" = "8c1c61eac9a0430e0326b8f615247506fd45daa3"
          test -f .terminus/tmp_fix_q4_restart_assertion.py

      - name: Apply assertion correction
        run: python3 .terminus/tmp_fix_q4_restart_assertion.py

      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile jetstream-regional-stream-continuity/tests/test_continuity.py
          grep -q 'persisted.application_sequence == 5600' jetstream-regional-stream-continuity/tests/test_continuity.py
          if git diff --name-only -- jetstream-regional-stream-continuity/environment | grep -q .; then
            echo '::error::Assertion correction changed environment scope.'
            exit 1
          fi
          git diff --check

      - name: Commit correction and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/terminus-agent-system-ci.yml
          rm .terminus/tmp_fix_q4_restart_assertion.py
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add \
            .github/workflows/terminus-agent-system-ci.yml \
            .terminus/tmp_fix_q4_restart_assertion.py \
            jetstream-regional-stream-continuity/tests/test_continuity.py
          git diff --cached --check
          git commit -m 'Correct restart-health assertion'
          git push origin HEAD:task/jetstream-quality-interlock

  validate-agent-system:
    name: Validate reviewer/controller system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Python
        run: |
          python3 -m py_compile \
            .terminus/validate_agent_system.py \
            .terminus/review_contract.py \
            .terminus/new_review_packet.py \
            .terminus/validate_review_freshness.py \
            .terminus/validate_task_complexity.py

      - name: Install pinned control-plane test tools
        run: python3 -m pip install --quiet ruff==0.14.10 pytest==8.4.1

      - name: Lint control-plane Python
        run: ruff check .terminus

      - name: Run control-plane regression suite
        run: python3 -m pytest .terminus/tests -q

      - name: Validate agent system structure
        run: python3 .terminus/validate_agent_system.py

      - name: Validate current review freshness and commit binding
        run: python3 .terminus/validate_review_freshness.py

      - name: Check control-plane files stay outside task packages
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -maxdepth 3 -type d -path '*/.terminus' -print -quit | grep -q .; then
            echo '::error::Found nested .terminus directory under a task/workspace path.'
            exit 1
          fi
          echo 'Control-plane files remain repository-level only.'
