name: JetStream Final Hub Origin Discriminator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Apply origin-progress discriminator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py')
          text = engine.read_text(encoding='utf-8')
          old = '            highest_contiguous_archive_origin_sequence=archive_origin_floor,\n'
          new = (
              '            highest_contiguous_archive_origin_sequence=contiguous_floor(\n'
              '                record.hub_stream_sequence for record in archive\n'
              '            ),\n'
          )
          if new not in text:
              if old not in text:
                  raise SystemExit('starter reconciliation anchor not found')
              text = text.replace(old, new, 1)
              engine.write_text(text, encoding='utf-8')

          tests = Path('jetstream-regional-stream-continuity/tests/test_continuity.py')
          text = tests.read_text(encoding='utf-8')
          phantom = '    assert shifted.checksum == baseline.checksum\n'
          if phantom in text:
              text = text.replace(phantom, '', 1)
              tests.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile \
            jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py \
            jetstream-regional-stream-continuity/tests/test_continuity.py
      - name: Commit task correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Terminus CI Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            jetstream-regional-stream-continuity/environment/continuity/continuity/engine.py \
            jetstream-regional-stream-continuity/tests/test_continuity.py
          if git diff --cached --quiet; then
            echo 'No task change required.'
            exit 0
          fi
          git commit -m 'Align hub-sequence F2P with solver-visible origin progress'
          git push origin HEAD:task/jetstream-quality-interlock
