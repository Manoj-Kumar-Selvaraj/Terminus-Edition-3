name: Temporary COBOL Q4 business-date fix

on:
  push:
    branches:
      - task/cobol-comp3-python-equiv-strict-rebuild
    paths:
      - '.github/workflows/tmp-cobol-q4-date-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cobol-comp3-python-equiv-strict-rebuild
          fetch-depth: 0
      - name: Normalize verifier business-date inputs and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cobol-comp3-python-equiv/tests/test_outputs.py')
          text = path.read_text(encoding='utf-8')
          old15 = text.count('2026-08-15')
          old16 = text.count('2026-08-16')
          if old15 == 0:
              raise SystemExit('expected 2026-08-15 test dates not found')
          text = text.replace('2026-08-15', '20260815').replace('2026-08-16', '20260816')
          path.write_text(text, encoding='utf-8')
          print(f'normalized {old15} primary and {old16} comparison date literals')
          PY
          git rm .github/workflows/tmp-cobol-q4-date-fix.yml
          git config user.name 'Terminus remediation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cobol-comp3-python-equiv/tests/test_outputs.py
          git commit -m 'Normalize Q4 verifier business dates'
          git push origin HEAD:task/cobol-comp3-python-equiv-strict-rebuild
