name: Generate Fresh JetStream 0F09 Q4 Q6 Packets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Generate immutable review packets
        shell: bash
        run: |
          set -euo pipefail
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity spec-test-contract \
            --state FROZEN_CANDIDATE \
            --change 'Fourth-cycle Q4 findings remediated and refrozen at 0f0947 with 5,530 substantive LOC, 40 tests = 30 F2P + 10 P2P, Oracle 40/40 and NOP exactly 30 F2P fail + 10 P2P pass. Confirmed-watermark, post-publish fencing, real-NATS replay, verify-generated report truth, quarantine evidence and documented origin-progress grading are current.'
          python3 .terminus/new_review_packet.py \
            jetstream-regional-stream-continuity production-logic \
            --state FROZEN_CANDIDATE \
            --change 'Refrozen at 0f0947 after fourth-cycle Q4 remediation. Production architecture remains the same; shared replay fencing gained a post-publish recheck, the inherited starter hub-position defect is exposed through the documented origin-progress output, and the verifier now exercises a real NATS replay path.'
          find .terminus/reviews/jetstream-regional-stream-continuity/0f0947ac -type f -name '*.packet.json' -print
      - uses: actions/upload-artifact@v4
        with:
          name: jetstream-q4-q6-0f09-${{ github.run_id }}
          path: .terminus/reviews/jetstream-regional-stream-continuity/0f0947ac/*.packet.json
          if-no-files-found: error
          retention-days: 14
