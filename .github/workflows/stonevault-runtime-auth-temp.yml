name: StoneVault Runtime Authenticity One Shot

on:
  push:
    paths:
      - '.github/workflows/stonevault-runtime-auth-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-authenticity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate StoneVault runtime authenticity
        run: python3 .terminus/validate_runtime_authenticity.py stonevault-crash-safe-storage
