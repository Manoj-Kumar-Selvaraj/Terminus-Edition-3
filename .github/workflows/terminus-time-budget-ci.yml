name: Terminus Time Budget CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-time-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test tools
        run: python -m pip install --quiet ruff==0.14.10 pytest==8.4.1 jsonschema==4.23.0
      - name: Compile advisory timing controller
        run: |
          python -m py_compile \
            .terminus/execution/time_budget.py \
            .terminus/execution/budget_controller_cli.py
      - name: Lint advisory timing controller
        run: |
          ruff check \
            .terminus/execution/time_budget.py \
            .terminus/execution/budget_controller_cli.py \
            .terminus/tests/test_time_budget.py \
            .terminus/tests/test_ci_orchestrator_agent.py
      - name: Run advisory timing regressions
        env:
          PYTHONPATH: .terminus
        run: |
          python -m pytest \
            .terminus/tests/test_time_budget.py \
            .terminus/tests/test_ci_orchestrator_agent.py \
            .terminus/tests/test_controller_stage_automation.py \
            -q
      - name: Validate agent-system polling contract
        run: python .terminus/validate_agent_system.py
