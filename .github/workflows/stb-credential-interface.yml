name: STB Credential Interface Diagnostic

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      XDG_CONFIG_HOME: /tmp/stb-probe-xdg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Install STB 2.4.3
        shell: bash
        run: |
          set -euo pipefail
          uv tool install "snorkelai-stb==2.4.3" \
            --find-links "https://snorkel-python-wheels.s3.us-west-2.amazonaws.com/stb/index.html" \
            --python ">=3.12" \
            --force
          stb --version

      - name: Capture credential command interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stb-interface "$XDG_CONFIG_HOME"
          stb keys --help > /tmp/stb-interface/keys-help.txt 2>&1
          stb keys set --help > /tmp/stb-interface/keys-set-help.txt 2>&1
          stb keys verify --help > /tmp/stb-interface/keys-verify-help.txt 2>&1
          stb keys show --help > /tmp/stb-interface/keys-show-help.txt 2>&1

          set +e
          timeout 5s stb keys set </dev/null > /tmp/stb-interface/keys-set-eof.txt 2>&1
          printf '%s\n' "$?" > /tmp/stb-interface/keys-set-eof.exit-code
          printf 'dummy-stb-static-key\n' | stb keys set > /tmp/stb-interface/keys-set-dummy.txt 2>&1
          printf '%s\n' "$?" > /tmp/stb-interface/keys-set-dummy.exit-code
          stb keys show > /tmp/stb-interface/keys-show-after-dummy.txt 2>&1
          printf '%s\n' "$?" > /tmp/stb-interface/keys-show-after-dummy.exit-code
          set -e

          find "$XDG_CONFIG_HOME" -maxdepth 4 -type f -print | sort > /tmp/stb-interface/config-files.txt
          while IFS= read -r f; do
            echo "### $f"
            sed 's/dummy-stb-static-key/<DUMMY_KEY>/g' "$f" || true
          done < /tmp/stb-interface/config-files.txt > /tmp/stb-interface/config-contents-sanitized.txt

          cat /tmp/stb-interface/keys-set-dummy.txt >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/stb-interface/config-files.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stb-credential-interface-2.4.3
          path: /tmp/stb-interface/
          if-no-files-found: error
          retention-days: 3
