name: STB Credential Interface Diagnostic

on:
  pull_request:
    paths:
      - "payment-eod-control-chain/.ci-validation-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      XDG_CONFIG_HOME: /tmp/stb-probe-xdg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Install STB 2.4.3
        shell: bash
        run: |
          set -euo pipefail
          uv tool install "snorkelai-stb==2.4.3" \
            --find-links "https://snorkel-python-wheels.s3.us-west-2.amazonaws.com/stb/index.html" \
            --python ">=3.12" \
            --force
          stb --version

      - name: Run Harbor Typer app directly without STB credentials
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/stb-interface/direct-oracle /tmp/stb-interface/direct-nop
          PY="$HOME/.local/share/uv/tools/snorkelai-stb/bin/python"

          "$PY" -c 'from harbor.cli.main import app; app()' --help \
            > /tmp/stb-interface/harbor-direct-help.txt 2>&1

          set +e
          "$PY" -c 'from harbor.cli.main import app; app()' run \
            -a oracle \
            -p "$GITHUB_WORKSPACE/payment-eod-control-chain" \
            -o /tmp/stb-interface/direct-oracle \
            > /tmp/stb-interface/direct-oracle.log 2>&1
          printf '%s\n' "$?" > /tmp/stb-interface/direct-oracle.exit-code

          "$PY" -c 'from harbor.cli.main import app; app()' run \
            -a nop \
            -p "$GITHUB_WORKSPACE/payment-eod-control-chain" \
            -o /tmp/stb-interface/direct-nop \
            > /tmp/stb-interface/direct-nop.log 2>&1
          printf '%s\n' "$?" > /tmp/stb-interface/direct-nop.exit-code
          set -e

          echo "Direct Oracle exit: $(cat /tmp/stb-interface/direct-oracle.exit-code)" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct NOP exit: $(cat /tmp/stb-interface/direct-nop.exit-code)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stb-credential-interface-2.4.3
          path: /tmp/stb-interface/
          if-no-files-found: error
          retention-days: 3
