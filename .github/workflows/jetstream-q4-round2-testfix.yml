name: JetStream Q4 Round 2 Test Setup Correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'task/jetstream-quality-interlock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/jetstream-quality-interlock
          fetch-depth: 0
      - name: Correct verifier setup only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          tests = Path('jetstream-regional-stream-continuity/tests/test_continuity.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    engine.store.execute(
              "UPDATE archive_index SET hub_stream_sequence=origin_sequence-1 "
              "WHERE region='east' AND generation=1"
          )'''.replace('          ', '')
          new = '''    engine.store.execute(
              "UPDATE archive_index SET hub_stream_sequence=1000000+origin_sequence "
              "WHERE region='east' AND generation=1"
          )'''.replace('          ', '')
          if old not in text:
              raise SystemExit('hub sequence setup target not found')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          coverage = Path('jetstream-regional-stream-continuity/tests/test_contract_coverage.py')
          text = coverage.read_text(encoding='utf-8')
          old = '''        "exercise preserved recovery CLI",
              "--root",'''.replace('          ', '')
          new = '''        "exercise preserved recovery CLI",
              "--approve",
              "--approved-by",
              "cli-contract-test",
              "--root",'''.replace('          ', '')
          if old not in text:
              raise SystemExit('CLI plan setup target not found')
          coverage.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m pip install --quiet ruff==0.12.8
          ruff format jetstream-regional-stream-continuity/tests/test_continuity.py jetstream-regional-stream-continuity/tests/test_contract_coverage.py
          ruff check jetstream-regional-stream-continuity/tests
          python3 -m py_compile jetstream-regional-stream-continuity/tests/test_continuity.py jetstream-regional-stream-continuity/tests/test_contract_coverage.py
          python3 .terminus/validate_task_complexity.py jetstream-regional-stream-continuity
          git config user.name 'Terminus CI Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add jetstream-regional-stream-continuity/tests/test_continuity.py jetstream-regional-stream-continuity/tests/test_contract_coverage.py
          git commit -m 'Correct JetStream verifier test setup'
          git push origin HEAD:task/jetstream-quality-interlock
