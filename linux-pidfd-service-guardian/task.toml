version = "2.0"
name = "linux-pidfd-service-guardian"
category = "Software"
subcategory = "Systems"
tags = ["linux", "cpp", "pidfd", "process-supervision", "epoll"]
languages = ["cpp", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 12
artifacts = ["/app/guardian"]

[metadata]
author_name = "anonymous"
