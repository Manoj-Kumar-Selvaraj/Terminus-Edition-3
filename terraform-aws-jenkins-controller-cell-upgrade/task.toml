version = "2.0"
name = "terraform-aws-jenkins-controller-cell-upgrade"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "jenkins", "eks", "isolation", "upgrade", "cells"]
languages = ["hcl", "python", "yaml", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 14
artifacts = ["/app/terraform", "/app/cells", "/app/var/cells", "/app/output"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
