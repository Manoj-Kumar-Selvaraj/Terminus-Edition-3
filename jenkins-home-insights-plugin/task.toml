version = "2.0"
name = "jenkins-home-insights-plugin"
category = "Software"
subcategory = "Systems"
tags = ["jenkins", "java", "plugin", "reconciliation", "recovery", "observability"]
languages = ["java", "bash", "python"]
difficulty = "advanced"
expert_time_estimate_hours = 14
artifacts = ["/app/plugin"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"