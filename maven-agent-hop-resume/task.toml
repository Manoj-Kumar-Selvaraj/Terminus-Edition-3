version = "2.0"
name = "maven-agent-hop-resume"
category = "Software"
subcategory = "Systems"
tags = ["maven", "pipeline", "agents", "resume", "incremental"]
languages = ["python", "bash", "json"]
difficulty = "advanced"
expert_time_estimate_hours = 9
artifacts = ["/app/reactor"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
