database:
  max_connections: 20
  min_connections: 2
  connect_timeout_sec: 10

control_plane:
  region: us-east-1
  default_engine: postgres
  default_engine_version: "16.2"
  max_allowed_lag_bytes: 10485760
  failover_lease_ttl_sec: 15
  health_probe_timeout_sec: 3
  max_event_retries: 5
  outbox_poll_interval_sec: 5
