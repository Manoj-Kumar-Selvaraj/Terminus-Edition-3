---
- name: restart fleet-node-exporter
  shell: |
    if [ -f "{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.pid" ]; then
      kill "$(cat "{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.pid")" 2>/dev/null || true
      rm -f "{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.pid"
    fi
    fuser -k "{{ fleet_metrics_port }}/tcp" 2>/dev/null || true
    nohup python3 "{{ fleet_root }}/lib/fleet-node-exporter.py" \
      >"{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.log" \
      2>"{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.err" &
    echo $! > "{{ fleet_root }}/var/lib/fleet-harden/fleet-node-exporter.pid"
  args:
    executable: /bin/bash
