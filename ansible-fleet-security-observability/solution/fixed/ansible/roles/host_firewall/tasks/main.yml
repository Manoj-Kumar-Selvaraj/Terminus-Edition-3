---
- name: host_firewall - require stage 07
  stat:
    path: "{{ fleet_root }}/var/lib/fleet-harden/stage-07.ok"
  register: prior_07

- name: host_firewall - soft gate warns without stage 07
  debug:
    msg: "soft gate: missing stage-07.ok under {{ fleet_root }}"
  when: fleet_soft_gates | bool and not prior_07.stat.exists

- name: host_firewall - fail closed without stage 07
  fail:
    msg: "stage-07.ok missing under {{ fleet_root }}"
  when: not (fleet_soft_gates | bool) and not prior_07.stat.exists

- name: host_firewall - template policy
  template:
    src: nft.allow.j2
    dest: "{{ fleet_root }}/etc/fleet-harden/nft.allow"
    mode: "0644"

- name: host_firewall - refuse open-world allow
  assert:
    that:
      - ("allow tcp " + (fleet_metrics_port | string) + " from 0.0.0.0/0") not in lookup('file', fleet_root + '/etc/fleet-harden/nft.allow')
      - fleet_scrape_cidr in lookup('file', fleet_root + '/etc/fleet-harden/nft.allow')
      - ("deny tcp " + (fleet_metrics_port | string) + " from 0.0.0.0/0") in lookup('file', fleet_root + '/etc/fleet-harden/nft.allow')
    fail_msg: firewall policy violates scrape cidr contract

- name: host_firewall - write stage 08 marker
  copy:
    dest: "{{ fleet_root }}/var/lib/fleet-harden/stage-08.ok"
    mode: "0644"
    content: |
      ok
