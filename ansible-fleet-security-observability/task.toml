version = "2.0"
name = "ansible-fleet-security-observability"
category = "Software"
subcategory = "Systems"
tags = ["ansible", "security", "observability", "hardening", "fleet"]
languages = ["yaml", "bash", "python"]
difficulty = "advanced"
expert_time_estimate_hours = 10
artifacts = ["/app/var/fleet-harden", "/app/edges", "/app/environment/ansible"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
