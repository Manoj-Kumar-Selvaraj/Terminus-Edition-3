version = "2.0"
name = "cobol-comp3-python-equiv"
category = "Software"
subcategory = "Languages"
tags = ["cobol", "comp-3", "redefines", "odo", "unpack"]
languages = ["python", "cobol"]
difficulty = "advanced"
expert_time_estimate_hours = 8
artifacts = ["/app/equiv"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"
difficulty_explanation = "Requires packed COMP-3 C/D/F sign-class validation, exact scale preservation, REDEFINES aliasing, and ODO record lengths. Sealed holdouts plus malformed sign, padding, digit, and ODO cases defeat hex dumps and max-span walks."
solution_explanation = "Implement typed COMP-3 decoding with signed C/D versus unsigned F validation, decimal-digit and zero-pad checks, honor REDEFINES target offsets, iterate ODO by the bounded depending-on count, and emit the contracted evaluator report."
verification_explanation = "Verifier checks public and sealed packed values, record byte lengths, REDEFINES, ODO, invalid sign/digit/pad nibbles, invalid ODO counts, stable report/failure fields, semantic rerun stability, and actual CLI layout/records/output path behavior."
relevant_experience = "COBOL packed decimal, variable record layouts, Python binary parsing, defensive malformed-record handling."

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 5400

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
