difficulty_explanation = "The failure spans packed-decimal field domains, dynamic ODO/REDEFINES storage, weighted inventory accounting, exact generation fencing, durable restart, reconciliation and atomic publication. Partial fixes can make individual records look correct while replay or close remains unsafe."
