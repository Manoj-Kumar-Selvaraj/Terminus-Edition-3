verification_explanation = "The verifier exercises independent packed-decimal, layout/framing, restart, policy, accounting, reconciliation, publication and database durability behaviors. Preservation tests cover valid signed COMP-3, active policy, matching controls and first publication."
relevant_experience = "COBOL packed decimal and record layouts, Python batch migration, SQLite transactions, inventory valuation, checkpoint/restart, idempotency and reconciliation controls."

