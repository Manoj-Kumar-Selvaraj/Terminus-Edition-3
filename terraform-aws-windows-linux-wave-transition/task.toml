version = "2.0"
name = "terraform-aws-windows-linux-wave-transition"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "ec2", "migration", "ssm", "cutover", "rehearsal"]
languages = ["hcl", "python", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 12
artifacts = ["/app/terraform", "/app/var/wave", "/app/output"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
