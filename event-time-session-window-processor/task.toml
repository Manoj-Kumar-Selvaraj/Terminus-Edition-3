version = "2.0"
name = "event-time-session-window-processor"
category = "Software"
subcategory = "Systems"
tags = ["streaming", "event-time", "watermarks", "sessions", "recovery"]
languages = ["python", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 10
artifacts = ["/app/sessions"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 2400
environment_mode = "separate"

[agent]
timeout_sec = 9000

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app/sessions"
