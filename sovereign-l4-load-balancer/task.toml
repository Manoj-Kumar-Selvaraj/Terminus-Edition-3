version = "2.0"
name = "sovereign-l4-load-balancer"
category = "Software"
subcategory = "Systems"
tags = ["load-balancer", "tcp", "distributed-systems", "go", "cpp", "recovery"]
languages = ["go", "cpp", "bash", "python"]
difficulty = "advanced"
expert_time_estimate_hours = 16
artifacts = ["/app/sovereign-lb"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 7200

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"