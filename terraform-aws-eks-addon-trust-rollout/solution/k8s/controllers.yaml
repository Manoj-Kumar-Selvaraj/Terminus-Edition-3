apiVersion: v1
kind: Namespace
metadata:
  name: regulated
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebs-csi-controller-sa
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/regulated-ebs-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/regulated-lbc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karpenter
  namespace: karpenter
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/regulated-karpenter
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ebs-csi-controller
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ebs-csi-controller
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-load-balancer-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-ledger
  namespace: regulated
  labels:
    workload-class: regulated
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-ledger
  template:
    metadata:
      labels:
        app: settlement-ledger
    spec:
      nodeSelector:
        karpenter.sh/nodepool: regulated-on-demand
        karpenter.sh/capacity-type: on-demand
      containers:
        - name: ledger
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: regulated-on-demand
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
