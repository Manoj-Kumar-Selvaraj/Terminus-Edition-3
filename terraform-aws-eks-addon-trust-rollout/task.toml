version = "2.0"
name = "terraform-aws-eks-addon-trust-rollout"
category = "Software"
subcategory = "Systems"
tags = ["terraform", "eks", "irsa", "kubernetes", "rollout", "reliability"]
languages = ["hcl", "python", "yaml", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 20
artifacts = ["/app/terraform", "/app/k8s", "/app/var/upgrade", "/app/output"]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"
custom_docker_compose = false

[verifier]
timeout_sec = 3600
environment_mode = "separate"

[agent]
timeout_sec = 9000

[environment]
network_mode = "public"
build_timeout_sec = 2400
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
