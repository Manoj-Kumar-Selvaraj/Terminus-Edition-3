apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebs-csi-controller-sa
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karpenter
  namespace: karpenter
  annotations:
    eks.amazonaws.com/role-arn: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-ledger
  namespace: regulated
  labels:
    workload-class: regulated
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-ledger
  template:
    metadata:
      labels:
        app: settlement-ledger
    spec:
      nodeSelector:
        karpenter.sh/nodepool: regulated-on-demand
        karpenter.sh/capacity-type: spot
      containers:
        - name: ledger
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: regulated-on-demand
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
