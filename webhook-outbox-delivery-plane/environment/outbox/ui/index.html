<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Outbox Delivery Plane</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header>
    <h1>Outbox Delivery Plane</h1>
    <p>Operator console for enqueue, claim, pause, and DLQ replay.</p>
  </header>
  <div id="error-box" class="error" aria-live="polite"></div>

  <section>
    <h2>Claim</h2>
    <form id="claim-form">
      <label>Event ID <input id="claim-event" name="event_id" required /></label>
      <label>Lease owner <input id="claim-owner" name="lease_owner" required /></label>
      <label>Lease seconds <input id="claim-seconds" name="lease_seconds" type="number" value="30" /></label>
      <button type="submit">Claim</button>
    </form>
  </section>

  <section>
    <h2>Replay DLQ</h2>
    <form id="replay-form">
      <label>Event ID <input id="replay-event" name="event_id" required /></label>
      <label>Operator token <input id="replay-token" name="token" type="password" /></label>
      <button type="submit">Replay</button>
    </form>
  </section>

  <section>
    <h2>Enqueue</h2>
    <form id="enqueue-form" onsubmit="return false;">
      <label>Endpoint ID <input id="enqueue-endpoint" /></label>
      <label>Payload JSON <textarea id="enqueue-payload">{"hello":true}</textarea></label>
      <label>Idempotency key <input id="enqueue-idem" /></label>
      <button type="button" id="enqueue-btn">Enqueue</button>
    </form>
  </section>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById("enqueue-btn").addEventListener("click", async () => {
      const ep = document.getElementById("enqueue-endpoint").value;
      const payload = document.getElementById("enqueue-payload").value;
      const idem = document.getElementById("enqueue-idem").value;
      await window.outboxUI.enqueue(ep, payload, idem);
    });
  </script>
</body>
</html>
